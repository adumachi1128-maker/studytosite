際のかぶり厚さと測定（指示）値を用いて補正する。","検出信号の大きさは、鉄筋間隔の二乗に比例するので、式を用いて補正する。","検出信号の大きさは、かぶり厚さの二乗に比例するので、式を用いて補正する。","近接鉄筋の影響はないので、補正は不要である。"],"type":"right","ans":0,"page":"pp.104〜105 4.7.3","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。実際と同じ配筋の上にアクリル板などを重ね、実際のかぶりと測定値の差から係数を求めて補正します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>近くに鉄筋があると、その分も信号に加わり、かぶり・位置・鉄筋径の測定に影響します。影響の大きさは配筋によって違うので、実際と同じ配筋で確かめるのが確実です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②③検出信号は、鉄筋間隔やかぶりが大きいほど小さくなります。「二乗に比例して大きくなる」という記述は誤りです。④近接鉄筋の影響はあるので、補正は必要です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「近接鉄筋の補正は、同じ配筋の模型で確かめる」。</div>","own":false,"extra":""},{"id":"c4-15","ch":"c4","n":15,"stem":"次の文は、電磁誘導法における近接鉄筋の影響について述べたものである。正しいものを一つ選べ。","choices":["鉄筋間隔が近いほど、測定値は実際のかぶり厚さより大きくなる。","かぶり厚さの補正係数に鉄筋間隔は影響を与えない。","かぶり厚さの誤差 e とかぶり厚さ t の関係は e = at<sup>2</sup> で表される。a は鉄筋間隔で決まる係数である。","鉄筋間隔 d とかぶり厚さ t の比 k = d/t が大きいほど補正は必要である。"],"type":"right","ans":2,"page":"pp.104〜105 4.7.3","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。かぶり厚さの誤差 e は、e ＝ a × t²（t：かぶり厚さ、a：鉄筋間隔で決まる係数）で表されます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>かぶりが深くなるほど、隣の鉄筋の影響が大きくなり、誤差は二乗で増えます。補正が必要かどうかは、k ＝ d/t（鉄筋間隔÷かぶり）で判断でき、この比を使うと鉄筋径によらず判断できます。kが小さい（間隔に比べてかぶりが深い）ほど、補正が必要です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①鉄筋間隔が近いほど、かぶりは実際より「小さく（浅く）」測定されます。②補正係数は鉄筋間隔の影響を受けるので、実際と同じ配筋で求めます。④kが「大きい」ほど影響は小さく、補正は不要に近づきます。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「間隔が狭い・かぶりが深い→浅く出る→補正が必要」。</div>","own":false,"extra":"<p class=\"note\">以下の設問中の「JASS 5」及び「JASS 5 T-608」は、日本建築学会：建築工事標準仕様書・同解説 鉄筋コンクリート工事 2022年版発行のものである。</p>"},{"id":"c5-1","ch":"c5","n":1,"stem":"コンクリートのかぶり厚さに関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリートのかぶり厚さは、鉄筋コンクリート構造物の耐久性を確保するために、適切な量を確保しなければならない。","コンクリートのかぶり厚さは、鉄筋コンクリート構造物の耐火性を確保するために、適切な量を確保しなければならない。","コンクリートのかぶり厚さが不足している場合、コンクリートの中性化速度が速くなり、鉄筋の腐食する時期が早まる。","コンクリートのかぶり厚さが不足している場合、飛来塩分などの劣化因子によって鉄筋が腐食を受けやすくなる。"],"type":"wrong","ans":2,"page":"P.107","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。かぶりが不足しても、中性化の「速さ」は変わりません。変わるのは、中性化が鉄筋に「届くまでの時間」です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>中性化深さは d ＝ α√t で進み、速さ（α）はコンクリートの品質や環境で決まります。かぶりが半分だと、届くまでの時間は（1/2）²＝1/4 になります。だから、鉄筋が腐食する時期は早まります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①耐久性、②耐火性のためにかぶりを確保する、④かぶり不足だと飛来塩分などで腐食しやすい。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「かぶりは鉄筋までの距離。半分になると、届く時間は1/4」。</div>","own":false,"extra":""},{"id":"c5-2","ch":"c5","n":2,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さ」に関する次の記述のうち、正しいものを一つ選べ。","choices":["建物の用途にあわせて、コンクリートのかぶり厚さを設計者が任意に定めることができる。","建物の計画供用期間にあわせて、コンクリートのかぶり厚さを定めている。","コンクリートのかぶり厚さは、建築基準法施行令で定められており、全ての部材で同じ値である。","コンクリートのかぶり厚さは、建築基準法施行令で定められており、構造部材は非構造部材よりも値が小さい。"],"type":"right","ans":1,"page":"P.109〜110 表5.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。JASS5 では、建物の計画供用期間（短期・標準・長期・超長期）に合わせて、かぶり厚さを定めています。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>長く使う建物ほど、中性化が鉄筋に届くまでの時間を長くする必要があるので、かぶりを大きくします。部材の種類（構造部材か非構造部材か）や、環境（屋内・屋外・土に接する部分）でも値が変わります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①設計者が任意に決めることはできません。③建築基準法施行令の値は部材によって違います。④構造部材の方が、非構造部材より大きい値です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「長く使うほど、かぶりは厚く」。</div>","own":false,"extra":""},{"id":"c5-3","ch":"c5","n":3,"stem":"コンクリートのかぶり厚さに関する次の記述のうち、誤っているものを一つ選べ。","choices":["建築基準法施行令では、柱・梁・耐力壁におけるコンクリートのかぶり厚さを 3 cm と定めている。","建築基準法施行令では、床スラブ・屋根スラブにおけるコンクリートのかぶり厚さを 2 cm と定めている。","建築基準法施行令では、構造部材と同等の耐久性を要求する部材におけるコンクリートのかぶり厚さを 2 cm と定めている。","建築基準法施行令では、直接土に接する壁や基礎の立上り部分におけるコンクリートのかぶり厚さを 5 cm と定めている。"],"type":"wrong","ans":3,"page":"P.110 表5.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。建築基準法施行令では、直接土に接する壁や基礎の立上りのかぶりは「4cm」です（5cmではない）。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>建築基準法施行令（第79条）のかぶり厚さ：<br>・耐力壁以外の壁・床：2cm<br>・耐力壁・柱・梁：3cm<br>・直接土に接する壁・柱・床・梁・布基礎の立上り：4cm<br>・基礎（立上り部分を除く）：6cm（捨てコンクリートの部分を除く）</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①柱・梁・耐力壁3cm、②床・屋根スラブ2cm、③は教材の表のとおりで、正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「2・3・4・6」と覚える（床・柱梁・土に接する・基礎）。</div>","own":false,"extra":""},{"id":"c5-4","ch":"c5","n":4,"stem":"JASS 5 に定められている「コンクリートの一般劣化環境でのかぶり厚さ」に関する次の記述のうち、正しいものを一つ選べ。","choices":["計画供用期間の級が短期の場合、耐久性上有効な仕上げの有無でコンクリートのかぶり厚さが異なる。","計画供用期間の級が標準の場合、耐久性上有効な仕上げが施されていても、コンクリートのかぶり厚さは同じである。","計画供用期間の級が標準・長期の場合、耐久性上有効な仕上げが施されている場合、コンクリートの最小かぶり厚さを 10 mm 減じた値とすることができる。","計画供用期間の級が超長期の場合、直接土に接する部分や基礎のコンクリートのかぶり厚さは、供用期間の級が短期の場合よりも大きく定められている。"],"type":"right","ans":2,"page":"P.110 表5.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。計画供用期間が標準・長期で、耐久性上有効な仕上げがある場合は、最小かぶり厚さを10mm減らせます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>タイルやモルタルなどの有効な仕上げは、炭酸ガスや水の侵入を遅らせるので、その分かぶりを減らせます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①短期は、仕上げの有無でかぶりは変わりません。②標準でも、仕上げがあれば減らせます。④直接土に接する部分や基礎は、計画供用期間にかかわらず同じ値（40mm など）です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「有効な仕上げがあれば−10mm（標準・長期）」。</div>","own":false,"extra":""},{"id":"c5-5","ch":"c5","n":5,"stem":"JASS 5 で定められている構造部材のコンクリートの最小かぶり厚さに関する次の記述のうち、建築基準法施行令で定められているかぶり厚さと異なる値のものとして、誤っているものを一つ選べ。","choices":["一般劣化環境（腐食環境）における計画供用期間の級が短期の場合","一般劣化環境（腐食環境）における計画供用期間の級が標準・長期の場合で、耐久性上有効な仕上げが施されている場合","一般劣化環境（腐食環境）における計画供用期間の級が超長期の場合","一般劣化環境（非腐食環境）における場合"],"type":"wrong","ans":2,"page":"P.110 表5.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。計画供用期間が「超長期」の場合は、建築基準法施行令より大きなかぶり厚さが定められています。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>超長期の建物は、中性化が鉄筋に届くまでの時間をさらに長くとる必要があるので、法令の最低値より厚いかぶりを求めています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①短期、②標準・長期で有効な仕上げあり、④非腐食環境は、建築基準法施行令と同じ値です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「超長期だけは法令より厚い」。</div>","own":false,"extra":""},{"id":"c5-6","ch":"c5","n":6,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さの測定方法」に関する次の記述のうち、正しいものを一つ選べ。","choices":["JASS 5 T-608（電磁誘導法によるコンクリートの中の鉄筋位置の測定方法）が定められている。","JASS 5 T-608（電磁波レーダ法によるコンクリートの中の鉄筋位置の測定方法）が定められている。","JASS 5 T-608（超音波法によるコンクリートの中の鉄筋位置の測定方法）が定められている。","JASS 5 T-608（電磁誘導法によるコンクリートの中の鉄筋位置の測定方法）と JASS 5 T-608（電磁波レーダ法によるコンクリートの中の鉄筋位置の測定方法）が定められている。"],"type":"right","ans":0,"page":"P.112","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。JASS 5 T-608 は「電磁誘導法によるコンクリート中の鉄筋位置の測定方法」です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>教材にも「電磁誘導法により推定する場合に適用し…」と書かれています。建築のかぶり検査は、浅いかぶりを正確に測れる電磁誘導法を基本にしています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②電磁波レーダ法、③超音波法の T-608 はありません。④2つ定められているわけではありません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「建築のT-608＝電磁誘導法」。</div>","own":false,"extra":""},{"id":"c5-7","ch":"c5","n":7,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さの検査」に関する次の記述のうち、測定方法として正しいものを一つ選べ。","choices":["測定はドリルによる穿孔など、微破壊試験で行う。","測定は定められた非破壊試験でのみ行う。","測定は定められた非破壊試験または同等の精度で検査が行える方法で行う。","測定は任意の方法で行う。"],"type":"right","ans":2,"page":"P.115","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。かぶり厚さの検査は、定められた非破壊試験（JASS 5 T-608）、またはそれと同等の精度で検査できる方法で行います。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>方法を一つに限らず、「同等の精度」が確保できればよい、という考え方です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①ドリル穿孔などの微破壊試験が原則ではありません。②「のみ」が誤りです（同等の方法も可）。④任意の方法では精度が保証されません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「T-608 か、それと同等の精度の方法」。</div>","own":false,"extra":""},{"id":"c5-8","ch":"c5","n":8,"stem":"JASS 5 に定められる「構造体コンクリートのかぶり厚さの検査」において非破壊試験を行う場合、誤っているものを一つ選べ。","choices":["検査箇所は、同一打込み日、同一打込み工区の柱、梁、壁、床または屋根スラブから選択する。","選択は、設計図および施工図を基にかぶり厚さ不足が懸念される部材をおのおの 10％選択する。","選択した部材のうち、測定可能な面についておのおの 10 本以上のかぶり厚さを測定する。","測定結果に疑義がある場合は、あらためて非破壊検査によって確認する。"],"type":"wrong","ans":3,"page":"P.113","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。測定結果に疑義（疑わしい点）がある場合は、「破壊検査」で確認します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>非破壊検査の結果が疑わしいのに、また非破壊検査をしても決着がつきません。はつって鉄筋を直接見る破壊検査で確かめます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①同じ打込み日・工区の部材から選ぶ、②不足が懸念される部材を10%ずつ選ぶ、③各部材で10本以上測る。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「怪しければ、はつって確かめる（破壊検査）」。</div>","own":false,"extra":""},{"id":"c5-9","ch":"c5","n":9,"stem":"JASS 5 に定められる「せき板または支柱の取外し後の構造体コンクリートのかぶり厚さの検査」の次の記述のうち、正しいものを一つ選べ。","choices":["構造体コンクリートのかぶり厚さ不足の兆候を目視によって検査し、かぶり厚さ不足が懸念される場合は、かぶり厚さの非破壊検査を行う。非破壊検査が不合格の場合は、破壊検査によって確認する。","構造体コンクリートのかぶり厚さ不足の兆候を目視によって検査し、かぶり厚さ不足が懸念される場合は、かぶり厚さの微破壊検査を行う。微破壊検査が不合格の場合は、破壊検査によって確認する。","構造体コンクリートのかぶり厚さ不足の兆候を目視によって検査し、かぶり厚さ不足が懸念される場合は、直ちに破壊検査によって確認する。","構造体コンクリートのかぶり厚さ不足の兆候を非破壊試験によって検査し、かぶり厚さ不足が懸念される場合は、かぶり厚さの微破壊検査を行う。微破壊検査が不合格の場合は、破壊検査によって確認する。"],"type":"right","ans":0,"page":"P.113","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。目視→（懸念があれば）非破壊検査→（不合格なら）破壊検査、の順に進めます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>まず型枠を外した後の表面を目で見て、かぶり不足の兆候（鉄筋の模様が浮き出る、ひび割れなど）を探します。懸念があれば非破壊検査、それでも不合格なら破壊検査で最終確認します。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②④微破壊検査は、この手順に入っていません。③懸念があっても、いきなり破壊検査ではなく、まず非破壊検査です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「目視 → 非破壊 → 破壊」の3段階。</div>","own":false,"extra":""},{"id":"c5-10","ch":"c5","n":10,"stem":"JASS 5 に定められるかぶり厚さの判定基準の組合せ（下表）のうち、正しいものを一つ選べ。ただし、表中の記号は次のとおりとする。","choices":["表の ① の判定基準","表の ② の判定基準","表の ③ の判定基準","表の ④ の判定基準"],"type":"right","ans":1,"page":"P.113 表11.7","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。判定基準は次の3つの組合せです。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>・個々の測定値：x ≧ Cmin − 10mm（最小かぶりを10mm以上下回らない）<br>・不良率：P(x ＜ Cmin) ≦ 0.15（最小かぶりを下回る確率が15%以下）<br>・平均値：Cmin ≦ X̄ ≦ Cd ＋ 20mm（最小かぶり以上、設計かぶり＋20mm以下）</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>表の②以外は、どれかの数値が上の基準と合いません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「−10・15%・＋20」の3点セット。</div>","own":false,"extra":"<p class=\"note\">x（個々の測定値(mm)）、X̄（測定値の平均値(mm)）、C<sub>min</sub>（最小かぶり厚さ(mm)）、C<sub>d</sub>（設計かぶり厚さ(mm)）、P(x &lt; C<sub>min</sub>)（測定値が C<sub>min</sub> を下回る確率）</p><p class=\"note\">表　かぶり厚さの判定基準</p><table class=\"t\"><tr><th></th><th>①</th><th>②</th><th>③</th><th>④</th></tr><tr><td>項目</td><td>判定基準</td><td>判定基準</td><td>判定基準</td><td>判定基準</td></tr><tr><td>測定値と最小かぶり厚さとの関係</td><td>x ≧ C<sub>min</sub> − 10mm</td><td>x ≧ C<sub>min</sub> − 10mm</td><td>x ≧ C<sub>min</sub> + 10mm</td><td>x ≧ C<sub>min</sub> − 10mm</td></tr><tr><td>最小かぶり厚さに対する不良率</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.10</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.15</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.15</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.10</td></tr><tr><td>測定結果の平均値の範囲</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> − 20mm</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> + 20mm</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> + 10mm</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> + 20mm</td></tr></table>"},{"id":"c5-11","ch":"c5","n":11,"stem":"JASS 5 に定められる JASS 5 T-608 に使用する測定装置の性能に関する次の記述のうち、誤っているものを一つ選べ。","choices":["適用範囲として、深さ方向の測定（推定）は 80 mm までである。","使用する測定装置の性能は、かぶり厚さの測定誤差が深さ方向 50 mm までは±2 mm 以下と定められている。","使用する測定装置の性能は、かぶり厚さの測定誤差が深さ方向 80 mm までは±3 mm 以下、または深さ×5.0 ％以下と定められている。","使用する測定装置の性能は、かぶり厚さの分解能が 2 mm 以下と定められている。"],"type":"wrong","ans":3,"page":"P.118 表5.5-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。かぶり厚さの分解能は「1mm以下」です（2mmではない）。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>JASS 5 T-608 の測定装置の性能：<br>・測定範囲：深さ80mmまで<br>・測定誤差：50mmまでは±2mm、80mmまでは±3mmまたは深さ×5.0%<br>・面内位置の誤差：±10mmまたは探査距離の±1.0%<br>・分解能：1mm</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①測定範囲80mmまで、②50mmまで±2mm、③80mmまで±3mmまたは5%。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「分解能は1mm」。</div>","own":false,"extra":""},{"id":"c5-12","ch":"c5","n":12,"stem":"JASS 5 に定められる JASS 5 T-608 のかぶり厚さ補正値に関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さの測定誤差（補正値）は、A法とB法の2種類があり、A法は、配筋図を基に模擬配筋を組み立て、所定のかぶり厚さと同じ厚さの板材を用いて求める方法である。","B法は、測定対象となる鉄筋の配筋状態をそのまま利用してかぶり厚さ補正値を求める方法である。","かぶり厚さの補正値は、D10、D20、D30、D40 および D80 の5種類である。","かぶり厚さの補正値を求める際の指示値は、同じ鉄筋のかぶり厚さを 3 点以上測定し、その平均値を四捨五入によって mm 単位に丸めて表す。"],"type":"wrong","ans":2,"page":"P.119","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。補正値は D10・D20・D30・D50・D80 の5種類です（D40は含まない）。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>かぶり10・20・30・50・80mmで測って、それぞれの誤差（補正値）を求めます。その間のかぶりは、誤差がほぼ比例して変わることを利用して補います。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①A法（模擬配筋と板材で求める）、②B法（実際の配筋で求める）、④指示値は同じ鉄筋を3点以上測って平均する。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「10・20・30・50・80（40は飛ばす）」。</div>","own":false,"extra":""},{"id":"c5-13","ch":"c5","n":13,"stem":"JASS 5 に定められる JASS 5 T-608 の測定手順に関する次の記述のうち、誤っているものを一つ選べ。","choices":["走査線は、主筋位置のほぼ中間を通るように、Y軸基準線と平行方向にマーキングする。","走査線は、主筋位置を通るように、Y軸基準線と平行方向にマーキングする。","かぶり厚さは、探査センサをマップ上の鉄筋位置と走査線が交差する位置に置いて測定する。","補正後の全てのかぶり厚さ測定値をグラップズの検定で棄却検定し、廃棄された場合はこれに替わる測定値を補って計算する。"],"type":"wrong","ans":1,"page":"P.113","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。走査線は、主筋の真上ではなく、「主筋と主筋のほぼ中間」を通るようにマーキングします。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>主筋の真上を走査すると、主筋そのものの影響を強く受け、直交する鉄筋（帯筋・あばら筋）のかぶりを正しく測れません。中間を通すと影響が小さくなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①中間を通る、③マップ上の鉄筋位置と走査線の交点で測る、④補正後の測定値をグラッブス検定で棄却検定する。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「走査線は鉄筋と鉄筋の真ん中」。</div>","own":false,"extra":""},{"id":"c5-14","ch":"c5","n":14,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さ」の判定基準について、次の中から正しいものを一つ選べ。","choices":["かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 10 mm 以上","かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 15 mm 以上","かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 20 mm 以上","かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 25 mm 以上"],"type":"right","ans":0,"page":"P.113 表11.7","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。個々の測定値は、最小かぶり厚さ − 10mm 以上でなければなりません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>設計かぶりは「最小かぶり＋10mm」です。施工のばらつきを考えても、最小かぶりを10mmより大きく下回るのは許されない、という基準です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②−15mm、③−20mm、④−25mm は基準より甘い値です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「個々の値は 最小−10mm 以上」。</div>","own":false,"extra":""},{"id":"c5-15","ch":"c5","n":15,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さ」の判定基準について、次の中から正しいものを一つ選べ。","choices":["かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 20 mm 以下","かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 25 mm 以下","かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 30 mm 以下","かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 35 mm 以下"],"type":"right","ans":0,"page":"P.113 表11.7","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。平均値の上限は、設計かぶり＋20mm以下です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>かぶりは厚ければよいわけではありません。厚すぎると、鉄筋が内側に寄って有効な断面が小さくなり、構造の性能が下がります。そこで上限も決めています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②＋25mm、③＋30mm、④＋35mm は基準と合いません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「平均は 最小以上、設計＋20mm以下」。</div>","own":false,"extra":""},{"id":"c5-16","ch":"c5","n":16,"stem":"かぶり厚さを精度良く測定するには、適切な補正を行うことが必要である。JASS 5 T-608 で規定されている補正を行う際の所定のかぶり厚さについて、次の中から正しいものを一つ選べ。","choices":["10 mm、20 mm、30 mm、40 mm および 80 mm である。","10 mm、20 mm、40 mm、50 mm および 80 mm である。","10 mm、20 mm、40 mm、60 mm および 90 mm である。","10 mm、20 mm、30 mm、50 mm および 80 mm である。"],"type":"right","ans":3,"page":"P.118〜119","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。補正を行うかぶり厚さは、10・20・30・50・80mm です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>この5点で測った誤差を補正値 D10・D20・D30・D50・D80 とします（問12と同じ数字）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①②③は、40mm や 60mm・90mm など、決められていない値が入っています。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「10・20・30・50・80」。</div>","own":false,"extra":""},{"id":"c5-17","ch":"c5","n":17,"stem":"JASS 5 T-608 で規定されている測定に用いる装置の満たすべき性能について、次の中から誤っているものを一つ選べ。","choices":["面内位置の測定誤差は、±10 mm または探査距離の±2.0 ％以下","かぶり厚さの測定範囲は、最小 10 mm 以下、最大 80 mm 以上","かぶり厚さの測定誤差は、深さ方向 50 mm までは±2 mm 以下","かぶり厚さの測定誤差は、深さ方向 50 mm 以上 80 mm までは±3 mm 以下または「深さ×5.0 ％」以下"],"type":"wrong","ans":0,"page":"P.117〜118","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が誤り。面内位置の測定誤差は、±10mm または探査距離の「±1.0%」以下です（2.0%ではない）。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>性能の一覧は問11の解説を参照して下さい。数値の取り違えを問う問題です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②測定範囲（最小10mm以下・最大80mm以上）、③50mmまで±2mm、④50〜80mmは±3mmまたは5.0%。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「面内は ±10mm か 1%」。</div>","own":false,"extra":""},{"id":"c5-18","ch":"c5","n":18,"stem":"JASS 5 T-608 で規定されているかぶり厚さ補正方法に関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さを精度良く測定するには、鉄筋径や配筋間隔、配筋方法などの配筋状態ごとに補正を行う。","かぶり厚さを精度良く測定するには、コンクリート圧縮強度を考慮して補正を行う。","実かぶり厚さと測定装置指示値との差を基準に補正を行う。","かぶり厚さの異なる2箇所の測定誤差が、その間のかぶり厚さの量にほぼ比例して変化することを利用した補正法を採用している。"],"type":"wrong","ans":1,"page":"P.118","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。かぶり厚さの補正に、コンクリートの圧縮強度は関係しません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>T-608 は電磁誘導法です。電磁誘導法は鉄筋の電気・磁気の反応を読むので、コンクリートの強さには影響されません。補正に関わるのは、鉄筋径・間隔・配筋方法などの配筋状態です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①配筋状態ごとに補正する、③実かぶりと指示値の差で補正する、④2か所の誤差がその間でほぼ比例して変わることを利用する。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「補正は\"配筋\"で決まる。強度は無関係」。</div>","own":false,"extra":""},{"id":"c5-19","ch":"c5","n":19,"stem":"JASS 5 T-608 の規定では、判定に用いるかぶり厚さ測定値・平均値・最小値以外にまとめておくべき報告事項がある。次の記述のうち、誤っているものを一つ選べ。","choices":["試験従事者の経歴の報告は不必要。","かぶり厚さ補正の求め方（A法またはB法）の報告は必要。","試験測定データの内、棄却検定で破棄した測定データの報告は不必要。","測定装置本体の形式、製造番号および製造メーカの報告は必要。"],"type":"wrong","ans":2,"page":"P.120","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。棄却検定で破棄した測定データも、報告に含める必要があります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>どのデータを、なぜ外したかが分からないと、結果の妥当性を後から確認できません。全データを残すのが原則です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①経歴は不要、②補正の求め方（A法・B法）は必要、④装置の形式・製造番号・メーカーは必要。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「捨てたデータも報告する」。</div>","own":false,"extra":""},{"id":"c5-20","ch":"c5","n":20,"stem":"JASS 5 T-608 で規定されているかぶり厚さ補正後のかぶり厚さ測定値の扱いに関する次の記述のうち、正しいものを一つ選べ。","choices":["測定値はそのまま全て使用しても良い。","グラップズの棄却検定を行い、棄却された場合はこれに変わる測定値を1回に限り補い再度棄却検定を行う。再棄却検定で棄却された場合、その箇所で得たすべての測定値を破棄する。","グラップズの棄却検定を行い、棄却された場合はこれに変わる測定値を補い再度棄却検定を行う。再棄却検定で測定値の棄却がなくなるまで、何回補っても良い。","必要と判断した場合のみ、測定値の棄却検定を行えば良い。"],"type":"right","ans":1,"page":"P.126","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。グラッブスの棄却検定で棄却されたら、代わりの測定値を1回だけ補い、再検定します。再び棄却されたら、その箇所の測定値はすべて破棄し、同じ部材の別の箇所で測り直します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>何度でも補えると、都合のよい値に置き換えられてしまいます。そのため、補えるのは1回に限っています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①検定せずにそのまま使うのは誤りです。③何回でも補えるわけではありません。④検定は必ず行います。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「補えるのは1回だけ。だめなら場所を変える」。</div>","own":false,"extra":""},{"id":"c6-1","ch":"c6","n":1,"stem":"NDIS 3429 に基づく報告による必ず報告する事項に関する次の記述のうち、誤っているものを一つ選べ。","choices":["工事名称","試験技術者の本籍地","点検の記録（定期点検及び日常点検）","試験結果"],"type":"wrong","ans":1,"page":"p.140","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。試験技術者の「本籍地」は、報告事項ではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>報告書に必要なのは、試験の信頼性を確かめるための情報です。工事名称・構造物・試験日、試験技術者の氏名・所属（必要に応じて資格）、装置の情報、点検の記録、試験条件、試験結果などです。本籍地は試験の信頼性と関係がありません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①工事名称、③点検の記録（定期・日常）、④試験結果は、必ず報告する事項です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「報告するのは、試験が正しく行われたと分かる情報」。</div>","own":false,"extra":""},{"id":"c6-2","ch":"c6","n":2,"stem":"JASS 5 T-608：2022 に準拠する報告書に記載する事項に関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さの全測定値","検定廃棄の有無","測定装置の定期点検場所","ぶり厚さ補正値の求め方（A法又はB法）"],"type":"wrong","ans":2,"page":"p.142","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。測定装置の「定期点検場所」までは記載不要です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>装置については、型式・製造番号・製造会社を記載し、どの装置で測ったかを特定できるようにします。どこで点検したかまでは求められていません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①全測定値、②検定で棄却したかどうか、④補正値の求め方（A法・B法）は、記載が必要です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「装置は\"どれか\"が分かればよい（型式・番号・会社）」。</div>","own":false,"extra":""},{"id":"c7-1","ch":"c7","n":1,"stem":"物の置き方に関する次の記述のうち、誤っているものを一つ選べ。","choices":["端は揃えて置く。","不安定なものには転倒防止器具を用いる。","背の低い物を後方に、背の高い物を前方にして、順に並べる。","荷重に十分耐えられる場所を選ぶ。"],"type":"wrong","ans":2,"page":"p.148〜149","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。背の高い物を後方に、背の低い物を前方に並べます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>背の低い物を後ろに置くと、前の高い物に隠れて見えず、取り出すときに高い物を倒しやすくなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①端をそろえる、②不安定な物には転倒防止器具、④荷重に耐えられる場所を選ぶ。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「ひな壇と同じ。低い物が前、高い物が後ろ」。</div>","own":false,"extra":""},{"id":"c7-2","ch":"c7","n":2,"stem":"現場作業中の安全帽に関する次の記述のうち、誤っているものを一つ選べ。","choices":["安全帽は正しくかぶり、アゴヒモをしっかり締める","一度でも衝撃を受けたものは、外観に損傷がなくても交換する。","一度でも落下時の衝撃を受けたものは使用しない。","プラスティック製の帽体は、劣化しにくいため、目立った外傷がない限り、交換はしなくてよい。"],"type":"wrong","ans":3,"page":"p.149","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。プラスチック製の帽体も、紫外線や熱で劣化するので、適当な時期に交換します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>見た目に傷がなくても、劣化した帽体は衝撃を吸収できません。メーカーが示す交換時期の目安に従います。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①正しくかぶりアゴヒモを締める、②③一度でも衝撃を受けたら交換する。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「保護具は、見た目がきれいでも寿命がある」。</div>","own":false,"extra":""},{"id":"c7-3","ch":"c7","n":3,"stem":"墜落制止用器具に関する次の記述のうち、誤っているものを一つ選べ。","choices":["フックの取付け設備は、できるだけ低い位置のものを選ぶ。","高さが 2 m 以上の箇所で作業床を設けることが困難な場合、フルハーネス型の使用を原則とする。","胴ベルト型については、できるだけ腰骨近くで装着する。","一度でも落下時の衝撃を受けたものは使用しない。"],"type":"wrong","ans":0,"page":"p.149","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が誤り。フックの取付け設備は、できるだけ「高い位置」のものを選びます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>フックが低いと、墜落したときに落ちる距離が長くなり、体にかかる衝撃も大きくなります。高い位置に掛けるほど安全です。<br>参考：高さ6.75mを超える所ではフルハーネス型が必要です（建設業では5mを超える所での使用が推奨されています）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②2m以上で作業床が設けられない場合はフルハーネス型が原則、③胴ベルト型は腰骨の近くで装着、④一度でも衝撃を受けた物は使わない。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「フックは高く、落ちる距離を短く」。</div>","own":false,"extra":""},{"id":"c7-4","ch":"c7","n":4,"stem":"防毒マスクの使用方法に関する次の記述のうち、誤っているものを一つ選べ。","choices":["有毒ガスの種類に応じた吸収缶を着用する。","予備の吸収缶は常備し、いつでも交換できるようにしておく。","作業場所の酸素濃度が 28 ％以上あることを確認してから着用する。","吸収缶は落としたり、衝撃を与えてはいけない。"],"type":"wrong","ans":2,"page":"p.149","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。確認するのは、酸素濃度が「18%以上」あることです（28%以上ではない）。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>防毒マスクは有毒ガスを吸収するだけで、酸素はつくれません。酸素が18%未満の場所では使えないので、送気マスクなどを使います。大気中の酸素濃度は約21%です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①ガスの種類に応じた吸収缶を使う、②予備を常備する、④衝撃を与えない。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「酸素18%未満は酸欠。防毒マスクは酸素をつくれない」。</div>","own":false,"extra":""},{"id":"c7-5","ch":"c7","n":5,"stem":"特殊作業に対する安全に関する次の記述のうち、誤っているものを一つ選べ。","choices":["運搬作業中、必要のある場合は監視者や合図者を配置する。","高所作業時は、備品の落下防止措置を取る。","高さが 2 m 以上の作業場では、墜落制止用器具を確実に使用する。","酸素欠乏症のおそれがある作業場では、作業開始前に酸素濃度を測定すれば換気の必要はない。"],"type":"wrong","ans":3,"page":"p.151〜152","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。酸素欠乏のおそれがある作業場では、測定するだけでなく、換気装置による強制換気を行います。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>酸素濃度は作業中にも下がることがあります。作業前に測ったうえで、18%以上を保てるよう換気を続けます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①必要に応じて監視者・合図者を置く、②高所では物の落下防止、③2m以上では墜落制止用器具を使う。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「酸欠のおそれ＝測る＋換気し続ける」。</div>","own":false,"extra":""}]};
(function(){
const K='haikin_quiz_v1',QS=DATA.qs,CHS=DATA.chapters;
const byId={};QS.forEach(q=>byId[q.id]=q);
let mem=null;
function load(){try{const s=localStorage.getItem(K);if(s)return JSON.parse(s)}catch(e){}return mem||{xp:0,best:0,days:0,last:'',ans:{},tot:0,ok:0}}
function save(){mem=S;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load();S.ans=S.ans||{};
const $=s=>document.querySelector(s),app=$('#app');
const NUM='①②③④';
const TITLES=[['見習い','🔰'],['新人','⛑️'],['一人前','🔧'],['職長','👷'],['主任技術者','📐'],['現場代理人','🏗️'],['配筋探査マスター','👑']];
const XPL=120;
const lvOf=xp=>Math.min(7,1+Math.floor(xp/XPL));
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function touchDay(){const t=today();if(S.last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.days=(S.last===ys)?(S.days||0)+1:1;S.last=t;save()}
const EXAM=new Date(2026,10,25);
function daysLeft(){const n=new Date();n.setHours(0,0,0,0);return Math.round((EXAM-n)/86400000)}
function quota(){const un=QS.filter(q=>!mastered(q.id)).length,d=daysLeft();if(un===0)return 0;const study=Math.max(1,d-5);return Math.max(3,Math.ceil(un/study))}
function todayN(){return (S.daily&&S.daily.d===today())?S.daily.n:0}
let sound=false,AC=null;
function beep(f,d,t){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function pop(t){const e=document.createElement('div');e.className='pop';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function confetti(n){const em=['🎉','✨','🧱','🔩','⭐','🏗️'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cf';e.textContent=em[i%em.length];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const st=id=>S.ans[id]||{c:0,w:0,l:null};
const mastered=id=>st(id).c>0;
function wrongIds(){return QS.filter(q=>{const a=st(q.id);return a.w>0&&a.l===false}).map(q=>q.id)}
function chapStat(k){const l=QS.filter(q=>q.ch===k);return{n:l.length,m:l.filter(q=>mastered(q.id)).length,ids:l.map(q=>q.id)}}

/* ---------- ホーム ---------- */
function cheer(){const n=todayN(),q=quota(),d=daysLeft();
 if(d<0)return '🎉 受験おつかれさま！結果を楽しみにしましょう';
 if(n===0)return '🚀 まずは1問！解き始めればスイッチが入ります';
 if(n<q)return `🔥 いい流れ！ノルマまであと${q-n}問`;
 return '🏅 今日のノルマ達成！余力があれば弱点復習でボーナスXP';}
function examHtml(){const d=daysLeft(),q=quota(),n=todayN();
 if(d<0)return '📅 試験日（11/25）は終了しました。おつかれさま！';
 const lab=d===0?'<b>今日が試験日！</b>':`試験(11/25)まで <b>あと${d}日</b>`;
 const last=d<=5?'（ラストスパート：弱点復習を中心に！）':'';
 return `📅 ${lab}　今日のノルマ <b>${Math.min(n,q)}/${q}問</b>${n>=q?' ✅達成！':''} ${last}<div class="goal"><i style="width:${q?Math.min(100,Math.round(n*100/q)):100}%"></i></div>`}
function home(){
 touchDay();
 const lv=lvOf(S.xp),T=TITLES[lv-1],into=lv>=7?XPL:S.xp%XPL;
 const total=QS.length,mm=QS.filter(q=>mastered(q.id)).length;
 const rate=S.tot?Math.round(S.ok*100/S.tot):0;
 const w=wrongIds().length;
 let h=`<div class="hero"><div class="tag">非破壊検査（配筋探査）自学自習</div><h1>配筋探査マスターへの道</h1>
 <div class="lv"><span class="badge">${T[1]} Lv.${lv} ${T[0]}</span><div class="xpbar"><i style="width:${Math.round(into*100/XPL)}%"></i></div><small>${S.xp} XP</small></div>
 <div class="exam">${examHtml()}</div><div class="cheer">${cheer()}</div>
 <div class="stats"><span>🔥 連続学習 ${S.days||0}日</span><span>✅ 習得 ${mm}/${total}問</span><span>🎯 正答率 ${rate}%</span><span>⚡ 最高連続正解 ${S.best||0}</span></div></div>
 <h2>🎮 モードを選ぶ</h2><div class="modes">
 <button class="mode wide" data-m="quota"><b>📅 今日のノルマ（${quota()}問）</b><small>試験日から逆算した今日の問題数。未習得を優先して出題します</small></button>
 <button class="mode" data-m="mix"><b>🎲 10問チャレンジ</b><small>未習得を優先してランダム出題</small></button>
 <button class="mode" data-m="surv"><b>❤️ サバイバル</b><small>ライフ3つ。何問連続で行けるか！</small></button>
 <button class="mode" data-m="wrong" ${w?'':'disabled'}><b>🔁 弱点復習（${w}問）</b><small>前回まちがえた問題だけ</small></button>
 <button class="mode" data-m="err"><b>🕵️ 誤り探し特訓</b><small>「誤っているもの」だけ10問</small></button>
 </div><h2>📚 章ごとに学ぶ</h2><div class="chaps">`;
 CHS.forEach(c=>{const s=chapStat(c.key),p=Math.round(s.m*100/s.n);
  h+=`<div class="chap"><div class="top"><span class="ic">${c.icon}</span><div class="tt"><b>${c.label}　${c.title}</b><small>${s.n}問 ／ 習得 ${s.m}${p===100?' 🏅コンプリート！':''}</small></div></div>
  <div class="bar"><i style="width:${p}%"></i></div>
  <div class="row"><button class="btn sm" data-c="${c.key}" data-u="0">最初から</button><button class="btn sm alt" data-c="${c.key}" data-u="1" ${s.m===s.n?'disabled':''}>未習得だけ</button><button class="btn sm alt" data-c="${c.key}" data-u="2">📋 全問</button></div></div>`});
h+=`</div><div class="foot"><button class="link" id="snd">🔈 効果音：${sound?'ON':'OFF'}</button> <button class="link" id="rst">進捗をリセット</button><br>教材：非破壊検査による配筋探査（問題と解説）より作成</div>`;
 app.innerHTML=h;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMode(b.dataset.m));
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;let ids=QS.filter(q=>q.ch===k).map(q=>q.id);if(b.dataset.u==='1')ids=ids.filter(i=>!mastered(i));if(b.dataset.u==='2'){listAll(k);return}start({name:CHS.find(c=>c.key===k).title,ids})});
  $('#snd').onclick=()=>{sound=!sound;beep(660,.1);home()};
 $('#rst').onclick=()=>{if(confirm('学習の記録をすべて消します。よろしいですか？')){S={xp:0,best:0,days:0,last:'',ans:{},tot:0,ok:0};save();home()}};
 window.scrollTo(0,0);
}
function listAll(k){
 const c=CHS.find(x=>x.key===k),qs=QS.filter(q=>q.ch===k);
 const tg={wrong:'❌ 誤っているものを選べ',right:'⭕ 正しいものを選べ',other:'🎯 当てはまるものを選べ'};
 let h=`<div class="top-bar"><button class="btn sm alt" id="back">← もどる</button><div class="grow"><b>${c.label}　${c.title}</b></div><small>全${qs.length}問</small></div>`;
 qs.forEach((q,qi)=>{h+=`<div class="qcard" data-qi="${qi}" style="margin-bottom:14px"><div class="meta"><span class="tg ${q.type}">${tg[q.type]}</span><span>${c.label} 問${q.n}</span></div>
  <div class="stem">${q.stem}</div>${q.extra||''}
  <div class="choices">${q.choices.map((t,i)=>`<button class="ch" data-i="${i}"><span class="no">${NUM[i]}</span><span>${t}</span></button>`).join('')}</div><div class="after"></div></div>`});
 h+=`<button class="btn alt" id="back2">🏠 ホームへ</button>`;
 app.innerHTML=h;window.scrollTo(0,0);
 $('#back').onclick=$('#back2').onclick=()=>home();
 app.querySelectorAll('.qcard[data-qi]').forEach(card=>{
  const q=qs[+card.dataset.qi];
  card.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
   const i=+b.dataset.i,ok=(i===q.ans);
   card.querySelectorAll('.ch').forEach((x,j)=>{x.disabled=true;if(j===q.ans)x.classList.add('ok');else if(j===i)x.classList.add('ng');else x.classList.add('dim')});
   card.querySelector('.after').innerHTML=`<div class="fb ${ok?'ok':'ng'}">${ok?'⭕ 正解':'❌ 不正解'}（正解は ${NUM[q.ans]}）</div><div class="exp"><div class="ref">📖 テキスト ${q.page||'（頁の記載なし）'}</div>${q.own?'<span class="own">教材に解説なし・補足</span><br>':''}${q.exp}</div>`;
  });
 });
}
function startMode(m){
 const all=QS.map(q=>q.id);
 if(m==='quota'){const un=shuffle(all.filter(i=>!mastered(i))),ms=shuffle(wrongIds().concat(all.filter(i=>mastered(i))));const q=quota()||10;start({name:'今日のノルマ',ids:un.concat(ms).slice(0,Math.max(q,3))})}
 else if(m==='mix'){const un=shuffle(all.filter(i=>!mastered(i))),ms=shuffle(all.filter(i=>mastered(i)));start({name:'10問チャレンジ',ids:un.concat(ms).slice(0,10)})}
 else if(m==='surv'){start({name:'サバイバル',ids:shuffle(all),hearts:3})}
 else if(m==='wrong'){start({name:'弱点復習',ids:shuffle(wrongIds())})}
 else if(m==='err'){start({name:'誤り探し特訓',ids:shuffle(QS.filter(q=>q.type==='wrong').map(q=>q.id)).slice(0,10)})}
}

/* ---------- クイズ ---------- */
let Q=null;
function start(o){Q={name:o.name,ids:o.ids,i:0,hearts:o.hearts||0,maxH:o.hearts||0,streak:0,gain:0,res:[],done:false};question()}
function question(){
 const q=byId[Q.ids[Q.i]],n=Q.ids.length;
 const tag={wrong:'❌ 誤っているものを選べ',right:'⭕ 正しいものを選べ',other:'🎯 当てはまるものを選べ'}[q.type];
 const ch=CHS.find(c=>c.key===q.ch);
 let h=`<div class="top-bar"><button class="btn sm alt" id="back">← もどる</button><div class="grow"><div class="prog"><i style="width:${Math.round(Q.i*100/n)}%"></i></div></div>
 <small>${Q.i+1}/${n}</small>${Q.maxH?`<span class="hearts">${'❤️'.repeat(Q.hearts)}${'🖤'.repeat(Q.maxH-Q.hearts)}</span>`:''}</div>
 <div class="qcard"><div class="meta"><span class="tg ${q.type}">${tag}</span><span>${ch.label} 問${q.n}</span>${Q.streak>=2?`<span>🔥 ${Q.streak}連続</span>`:''}</div>
 <div class="stem">${q.stem}</div>${q.extra||''}
 <div class="choices">${q.choices.map((c,i)=>`<button class="ch" data-i="${i}"><span class="no">${NUM[i]}</span><span>${c}</span></button>`).join('')}</div><div id="after"></div></div>`;
 app.innerHTML=h;window.scrollTo(0,0);
 $('#back').onclick=()=>home();
 app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 Q.locked=false;
}
const OKM=['ナイス！','その調子！','お見事！','さすが現場の人！','正解！','バッチリ！'];
const NGM=['おしい！','次は取れる！','ここが伸びしろ！','解説でスッキリ！','ドンマイ！'];
function answer(i){
 if(Q.locked)return;Q.locked=true;
 const q=byId[Q.ids[Q.i]],ok=(i===q.ans),a=st(q.id);
 a.c+=ok?1:0;a.w+=ok?0:1;a.l=ok;S.ans[q.id]=a;S.tot++;if(ok)S.ok++;S.daily=(S.daily&&S.daily.d===today())?S.daily:{d:today(),n:0};S.daily.n++;
 let gain=0;
 if(ok){Q.streak++;S.best=Math.max(S.best||0,Q.streak);gain=10+(Q.streak>=5?10:Q.streak>=3?5:0);const before=lvOf(S.xp);S.xp+=gain;Q.gain+=gain;
  beep(880,.12);setTimeout(()=>beep(1175,.15),110);pop('+'+gain+' XP');confetti(Q.streak>=3?30:12);
  if(lvOf(S.xp)>before){setTimeout(()=>{pop('🎊 レベルアップ！ '+TITLES[lvOf(S.xp)-1][0]);confetti(40)},700)}}
 else{Q.streak=0;beep(200,.25,'sawtooth');if(Q.maxH)Q.hearts--}
 save();Q.res.push({id:q.id,ok});
 app.querySelectorAll('.ch').forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add('ok');else if(k===i)b.classList.add('ng');else b.classList.add('dim')});
 const over=Q.maxH&&Q.hearts<=0,last=Q.i>=Q.ids.length-1;
 const fb=ok?`<div class="fb ok">⭕ ${OKM[Math.floor(Math.random()*OKM.length)]}（正解は ${NUM[q.ans]}）${Q.streak>=3?`　🔥${Q.streak}連続！`:''}</div>`:`<div class="fb ng">❌ ${NGM[Math.floor(Math.random()*NGM.length)]}　正解は ${NUM[q.ans]}</div>`;
 $('#after').innerHTML=fb+`<div class="exp"><div class="ref">📖 テキスト ${q.page||'（頁の記載なし）'}</div>${q.own?'<span class="own">教材に解説なし・補足</span><br>':''}${q.exp}</div>
 <div style="margin-top:12px"><button class="btn big" id="next">${(over||last)?'結果を見る 🏁':'次の問題へ ▶'}</button></div>`;
 $('#next').onclick=()=>{if(over||last)result();else{Q.i++;question()}};
 $('#next').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function result(){
 const n=Q.res.length,c=Q.res.filter(r=>r.ok).length,p=n?Math.round(c*100/n):0,stars=p>=90?3:p>=70?2:p>=40?1:0;
 const lv=lvOf(S.xp),T=TITLES[lv-1];
 const wr=Q.res.filter(r=>!r.ok);
 const surv=Q.maxH;const cleared=surv&&Q.hearts>0&&Q.i>=Q.ids.length-1;
 let msg=p===100?'パーフェクト！現場の神です👑':p>=80?'すばらしい！あと一歩でマスター':p>=50?'いい調子。復習でさらに伸びます':'ここからが伸びしろ。解説を読み返そう💪';
 if(surv)msg=cleared?'全問クリア！！伝説です🏆':`${c}問まで進みました！次は更新しよう🔥`;
 if(p===100&&n>=5)setTimeout(()=>confetti(50),300);
 app.innerHTML=`<div class="qcard res"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="score">${c} / ${n}</div>
 <p><b>${msg}</b></p><p>獲得 <b>+${Q.gain} XP</b>　／　${T[1]} Lv.${lv} ${T[0]}</p>
 ${wr.length?`<h2>復習ポイント（${wr.length}問）</h2><ul>${wr.map(r=>{const q=byId[r.id];const ch=CHS.find(x=>x.key===q.ch);return `<li>${ch.label} 問${q.n}：${q.stem.replace(/<[^>]+>/g,'').slice(0,46)}…<br><small>正解 ${NUM[q.ans]} ／ 📖 ${q.page||'―'}</small></li>`}).join('')}</ul>`:'<p>ミスなし！🎉</p>'}
 <div class="row" style="flex-direction:column;gap:8px">${wr.length?'<button class="btn" id="rt">🔁 まちがえた問題をもう一度</button>':''}<button class="btn alt" id="hm">🏠 ホームへ</button></div></div>`;
 window.scrollTo(0,0);
 if(wr.length)$('#rt').onclick=()=>start({name:'復習',ids:wr.map(r=>r.id)});
 $('#hm').onclick=home;
}
document.addEventListener('keydown',e=>{if(!Q||!document.querySelector('.ch'))return;
 if(/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.ch')[+e.key-1];if(b&&!b.disabled)b.click()}
 if(e.key==='Enter'){const n=$('#next');if(n)n.click()}});
const GLOSS={
 '比強度':'<b>比強度</b>＝強度 ÷ 重さ（密度）。<br>「軽さのわりに、どれだけ強いか」の指標です。<br>コンクリートは重いので比強度が<b>小さい</b>。地震の力は建物の重さに比例するため、耐震では不利になります。だから設計の工夫（鉄筋の配置など）が必要、というのがこの問題の答えです。',
 'コールドジョイント':'<b>コールドジョイント</b><br>先に打ったコンクリートが固まり始めてから次を打ち重ねたため、一体にならずにできる継ぎ目です。弱点になり、水の通り道や鉄筋の腐食の原因になります。打重ね時間間隔が長すぎると起こります。',
 'ブリーディング':'<b>ブリーディング</b><br>打込み後、重い材料（セメント・骨材）が沈み、水だけが表面に浮き上がってくる現象です。表面がもろくなったり、鉄筋の下側に水の隙間ができて付着が落ちたりします。',
 'アルカリシリカ反応':'<b>アルカリシリカ反応（ASR）</b><br>セメントのアルカリと、骨材の中の反応性シリカが反応し、水を吸って膨らむゲルができます。その膨張でコンクリートが内部から割れる現象で、亀甲状のひび割れが特徴です。',
 'エフロレッセンス':'<b>エフロレッセンス（白華）</b><br>ひび割れなどから染み出した水にコンクリート中のカルシウム分が溶け、表面で空気中の二酸化炭素と反応して白く固まったものです。',
 'ポップアウト':'<b>ポップアウト</b><br>コンクリート表面近くの骨材などが膨張し、表面が円錐状（お椀状）に飛び出してはがれる現象です。原因は反応性骨材や凍結融解などです。',
 'クリープ':'<b>クリープ</b><br>一定の力をかけ続けると、時間がたつにつれて変形（ひずみ）が少しずつ増えていく現象です。力を増やしていないのに進むのがポイントです。',
 'フレッシュコンクリート':'<b>フレッシュコンクリート</b><br>練り混ぜた直後から固まり始める前までの、まだやわらかい状態のコンクリートです。固まった後は「硬化コンクリート」と呼びます。',
 'ワーカビリティー':'<b>ワーカビリティー</b><br>運搬・打込み・締固め・仕上げのしやすさです。材料が分離せず、均一に施工できる度合いを表します。',
 '比誘電率':'<b>比誘電率</b><br>電磁波の伝わり方に関わる材料の性質で、真空を1とした比です。電磁波の速度 ＝ 光速 ÷ √比誘電率 なので、値が大きいほど電磁波は遅くなります。目安は、空気が1、コンクリートが約6〜10、水が約80です。レーダ法では、比誘電率が違う境目で電磁波が反射します。',
 '直接反射波形':'<b>直接反射波形（Aモード）</b><br>ある1地点で受信した反射波を、横軸＝時間（深さ）、縦軸＝振幅で表した波形です。その最初の山（ピーク）の向き＝極性を見ることで、反射した物の性質がわかります。',
 '極性':'<b>極性</b><br>反射波の山・谷の向き（プラスかマイナスか）のことです。コンクリートより比誘電率が<b>小さい</b>物（空洞）で反射するとプラス、<b>大きい</b>物（鉄筋）で反射するとマイナスになります。そのため、最初のピークの極性から比誘電率の大小関係がわかります（材質や大きさまではわかりません）。',
 'NDIS':'<b>NDIS</b><br>日本非破壊検査協会が定める規格（日本非破壊検査協会規格）の略称です。配筋探査では、NDIS 3429（電磁波レーダ法）とNDIS 3430（電磁誘導法）が中心です。'
};
const GKEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function wrapFirst(els,k){
 for(const el of els){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.term')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;
  while(n=w.nextNode()){
   const i=n.nodeValue.indexOf(k);
   if(i<0)continue;
   const mid=n.splitText(i);mid.splitText(k.length);
   const sp=document.createElement('span');sp.className='term';sp.dataset.k=k;
   mid.parentNode.replaceChild(sp,mid);sp.appendChild(mid);
   return;
  }
 }
}
function decorate(){
 app.querySelectorAll('.qcard[data-qi],.qcard:not([data-qi])').forEach(card=>{
  if(card.dataset.g)return;card.dataset.g=1;
  const els=[...card.querySelectorAll('.stem,.ch>span:last-child')];
  GKEYS.forEach(k=>wrapFirst(els,k));
 });
}
new MutationObserver(decorate).observe(app,{childList:true,subtree:true});
document.addEventListener('click',e=>{
 const old=document.getElementById('tip');if(old)old.remove();
 const t=e.target.closest&&e.target.closest('.term');
 if(!t)return;
 e.stopPropagation();e.preventDefault();
 const d=document.createElement('div');d.id='tip';
 d.innerHTML=GLOSS[t.dataset.k]+'<small>（どこかをタップすると閉じます）</small>';
 document.body.appendChild(d);
},true);
home();
})();
</script>
