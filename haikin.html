<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配筋探査マスターへの道</title>
<style>
:root{--bg:#fff7ea;--bg2:#ffe9c7;--card:#fff;--ink:#1c2340;--sub:#6b7391;--line:#f0e2c8;--acc:#ff7a1a;--acc2:#1c2f6b;--gold:#ffc42e;--ok:#17a65a;--okbg:#dcf8e6;--ng:#e5484d;--ngbg:#ffe3e3;--shadow:0 4px 0 rgba(28,35,64,.10),0 8px 18px rgba(28,35,64,.08);--c1:#ef4b5f;--c2:#2f7de1;--c3:#f2a900;--c4:#22b573}
@media (prefers-color-scheme:dark){:root{--bg:#0f1530;--bg2:#161d40;--card:#1b2350;--ink:#f4f6ff;--sub:#a3acd0;--line:#2b3566;--acc:#ff8a3a;--acc2:#8fb0ff;--gold:#ffd24d;--okbg:#103a27;--ngbg:#43202a;--shadow:0 4px 0 rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,var(--bg2),var(--bg));color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7;font-size:16px;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:12px 14px 44px}
button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
.hero{background:linear-gradient(135deg,#ff7a1a 0%,#ff4d6d 55%,#7b3fe4 120%);color:#fff;border-radius:22px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-100%);animation:shine 4s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.hero h1{margin:0;font-size:22px;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.hero .tag{font-size:12px;opacity:.95;font-weight:700}
.hero:after{content:"🏆";position:absolute;right:12px;top:6px;font-size:56px;opacity:.28;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.lv{display:flex;align-items:center;gap:10px;margin-top:12px}
.badge{background:#fff;color:#c4380a;font-weight:800;border-radius:999px;padding:3px 12px;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.xpbar{flex:1;height:16px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#ffc42e);border-radius:99px;transition:width .6s;box-shadow:0 0 10px #ffe066}
.exam{margin-top:12px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600}
.exam b{font-size:17px;color:#fff3b0}
.goal{height:10px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;margin-top:6px}
.goal i{display:block;height:100%;background:linear-gradient(90deg,#8cff9e,#2fe27a);border-radius:99px;transition:width .5s}
.cheer{margin-top:8px;font-size:14px;font-weight:700}
.stats{display:flex;gap:6px;margin-top:10px;font-size:12.5px;flex-wrap:wrap}
.stats span{background:rgba(0,0,0,.22);border-radius:10px;padding:2px 9px;font-weight:600}
h2{font-size:17px;margin:24px 2px 10px;color:var(--ink);display:flex;align-items:center;gap:6px}
h2:after{content:"";flex:1;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--acc),transparent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left;border:0;min-height:92px;color:#fff;position:relative;overflow:hidden;transition:transform .12s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.mode b{display:block;font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.mode small{opacity:.95;font-size:12px;line-height:1.4;display:block;margin-top:2px}
.mode[data-m=quota]{background:linear-gradient(135deg,#ff7a1a,#ffb02e);min-height:84px}
.mode[data-m=mix]{background:linear-gradient(135deg,#2f7de1,#5a5cf0)}
.mode[data-m=surv]{background:linear-gradient(135deg,#ef4b5f,#ff7a59)}
.mode[data-m=wrong]{background:linear-gradient(135deg,#22b573,#2dcf9a)}
.mode[data-m=err]{background:linear-gradient(135deg,#7b3fe4,#b04ff0)}
.mode.wide{grid-column:1/-1}
.mode:disabled{filter:grayscale(.85);opacity:.55;cursor:default}
.chaps{display:grid;gap:12px}
.chap{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:2px solid transparent;transition:transform .12s}
.chap:hover{transform:translateY(-2px);border-color:var(--acc)}
.chap .top{display:flex;align-items:center;gap:12px}
.chap .ic{font-size:30px;background:var(--bg2);border-radius:14px;width:52px;height:52px;display:grid;place-items:center}
.chap .tt{flex:1}
.chap .tt b{display:block;line-height:1.35}
.chap .tt small{color:var(--sub)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22b573,#7be495);border-radius:99px}
.row{display:flex;gap:8px}
.btn{background:var(--acc2);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--card);color:var(--acc2);border:2px solid var(--acc2);box-shadow:0 3px 0 rgba(28,47,107,.25)}
.btn.sm{padding:4px 12px;min-height:38px;font-size:14px}
.btn.big{width:100%;font-size:18px;min-height:56px;background:linear-gradient(135deg,#ff7a1a,#ffb02e);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2);box-shadow:0 5px 0 #c4570a}
.btn:disabled{opacity:.5}
.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top-bar .grow{flex:1}
.prog{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f7de1,#22b573);transition:width .3s;border-radius:99px}
.hearts{font-size:18px;letter-spacing:2px}
.qcard{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub);font-weight:600}
.tg{border-radius:999px;padding:2px 12px;font-weight:800;font-size:12.5px}
.tg.wrong{background:var(--ngbg);color:var(--ng)}.tg.right{background:var(--okbg);color:var(--ok)}.tg.other{background:#fff0c2;color:#8a5a00}
.stem{font-weight:800;font-size:17px;margin:10px 0}
.choices{display:grid;gap:10px;margin-top:12px}
.ch{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:54px;transition:transform .08s;box-shadow:0 3px 0 var(--line)}
.ch:active{transform:translateY(2px);box-shadow:none}
.ch .no{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ch:nth-child(1) .no{background:var(--c1)}.ch:nth-child(2) .no{background:var(--c2)}.ch:nth-child(3) .no{background:var(--c3)}.ch:nth-child(4) .no{background:var(--c4)}
.ch.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.ch.ng{background:var(--ngbg);border-color:var(--ng);animation:shake .35s;box-shadow:0 3px 0 var(--ng)}
.ch.dim{opacity:.5}
.ch:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:14px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:17px;animation:pop .35s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ng{background:var(--ngbg);color:var(--ng)}
.exp{margin-top:10px;background:var(--bg);border-left:6px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:15px}
.exp .ref{font-size:13px;color:var(--sub);margin-bottom:4px;font-weight:700}
.own{display:inline-block;background:#e6edff;color:#2a4a9a;border-radius:6px;padding:0 8px;font-size:12px;margin-bottom:4px}
.t{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.t th,.t td{border:1px solid var(--line);padding:3px 6px;text-align:center}
.t th{background:var(--line)}
.fig{max-width:100%;background:#fff;border-radius:10px;margin:6px 0}
.note{font-size:14px;margin:6px 0;color:var(--sub)}
.res{text-align:center}
.res .stars{font-size:44px;letter-spacing:6px;animation:pop .5s}
.res .score{font-size:50px;font-weight:900;background:linear-gradient(135deg,#ff7a1a,#ef4b5f);-webkit-background-clip:text;background-clip:text;color:transparent}
.res ul{text-align:left;padding-left:0;list-style:none}
.res li{padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px}
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:linear-gradient(135deg,#ffd24d,#ff9f1a);color:#4a2500;font-weight:900;font-size:18px;padding:8px 20px;border-radius:999px;z-index:50;animation:up 1.1s forwards;pointer-events:none;box-shadow:var(--shadow)}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-44px)}}
.cf{position:fixed;top:-20px;font-size:24px;z-index:40;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.6}}
.foot{margin-top:26px;font-size:12px;color:var(--sub);text-align:center}
.link{background:none;color:var(--sub);text-decoration:underline;font-size:12px;padding:6px}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.term{border-bottom:2px dotted currentColor;color:inherit;font-weight:800;cursor:pointer}
#tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,560px);background:var(--card);color:var(--ink);border:3px solid var(--acc);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);z-index:60;font-size:15px;line-height:1.7}
#tip small{display:block;color:var(--sub);margin-top:6px}
.chap .row .btn.sm{white-space:nowrap;padding:8px 6px;font-size:13px}
.exp .xp{margin:8px 0;line-height:1.75}.exp .xp:first-of-type{margin-top:4px}.exp .xh{display:block;color:var(--acc2);font-size:13px;margin-bottom:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA={"chapters":[{"key":"c1","label":"序論","icon":"🔍","title":"配筋状態と非破壊試験の基本"},{"key":"c2","label":"第2章","icon":"🧱","title":"コンクリート構造物の基礎知識"},{"key":"cr","label":"参考資料","icon":"📏","title":"鉄筋測定要領（H30.10）"},{"key":"c3","label":"第3章","icon":"📡","title":"電磁波レーダ法"},{"key":"c4","label":"第4章","icon":"🧲","title":"電磁誘導法"},{"key":"c5","label":"第5章","icon":"📐","title":"JASS5 かぶり厚さの検査"},{"key":"c6","label":"第6章","icon":"📝","title":"報告"},{"key":"c7","label":"第7章","icon":"⛑️","title":"安全・点検"}],"qs":[{"id":"c1-1","ch":"c1","n":1,"stem":"コンクリート及び配筋状態の基準・規格に関する次の記述のうち、誤っているものを一つ選べ。","choices":["土木構造物の場合は、土木学会のコンクリート標準示方書がある。","道路橋の場合は、道路橋示方書など構造物の管理者ごとに基準が設けられている。","建築物の場合は、日本建築学会の建築工事標準仕様書・同解説 JASS5 鉄筋コンクリート工事がある。","配筋に関しては JIS A 5308 レディーミクストコンクリートがある。"],"type":"wrong","ans":3,"page":"p.1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。JIS A 5308 は「レディーミクストコンクリート（生コン）」の品質・製造・試験の規格で、配筋の基準ではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>配筋（鉄筋の並べ方・継手・定着など）の基準は、建築では日本建築学会の「鉄筋コンクリート造配筋指針・同解説」が代表です。JIS は主に「材料・製品」の規格で、鉄筋そのものは JIS G 3112（鉄筋コンクリート用棒鋼）です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①土木＝土木学会「コンクリート標準示方書」、②道路橋＝「道路橋示方書」など管理者ごとの基準、③建築＝JASS5。いずれも正しい組合せです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「JIS A 5308＝生コンを注文するときのルール」。土木は示方書、建築は JASS5、と分けて覚えます。</div>","own":false,"extra":""},{"id":"c1-2","ch":"c1","n":2,"stem":"配筋状態の非破壊試験に関する規格のうち、誤っているものを一つ選べ。","choices":["NDIS 1401　コンクリート構造物の放射線透過試験方法","NDIS 3436　コンクリートの非破壊試験－表層透気試験方法","NDIS 3429　コンクリートの非破壊試験－鉄筋平面位置及びかぶり厚さの電磁波レーダ試験方法","NDIS 3430　電磁誘導法によるコンクリート構造物中の鉄筋探査方法"],"type":"wrong","ans":1,"page":"p.5","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。NDIS 3436（表層透気試験）は、コンクリート表面の緻密さ（空気の通しにくさ）を調べる試験で、配筋状態を調べる規格ではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>表層透気は「かぶりコンクリートの品質」を見る試験です。鉄筋の位置やかぶり厚さは測れません。配筋状態を調べるのは、鉄筋を写したり検出したりする方法です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①NDIS 1401＝放射線透過（X線などで内部の鉄筋を写す）、③NDIS 3429＝電磁波レーダ、④NDIS 3430＝電磁誘導。どれも配筋状態を調べる規格です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>配筋探査の2本柱は「3429＝レーダ」「3430＝電磁誘導」。連番のペアで覚えます。</div>","own":false,"extra":""},{"id":"c1-3","ch":"c1","n":3,"stem":"（一社）日本非破壊検査工業会の配筋試験技術者に関する資格のうち、誤っているものを一つ選べ。","choices":["コンクリート構造物の配筋探査技術者資格（土木・電磁波レーダ法）","コンクリート構造物の配筋探査技術者資格（土木・電磁誘導法）","コンクリート構造物の配筋探査技術者資格（土木・放射線透過法）","コンクリート構造物の配筋探査技術者資格（建築）"],"type":"wrong","ans":2,"page":"p.7","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。放射線透過法の「配筋探査技術者資格」はありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>日本非破壊検査工業会の配筋探査技術者資格は、「土木・電磁波レーダ法」「土木・電磁誘導法」「建築」の3区分です。現場で広く使われる2つの方法と、建築（JASS5 T-608 に対応）に絞られています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①②④は実在する資格区分です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「土木は2つ（レーダ・電磁誘導）、建築は1つ」の計3区分。</div>","own":false,"extra":""},{"id":"c1-4","ch":"c1","n":4,"stem":"国交省要領、JASS 5 T-608は、JIS Z 2305（非破壊試験技術者の資格及び認証）に規定されているわけではないが、配筋試験技術者に求められている要件を、JIS Z 2305に規定されているレベル相当に対応させた場合、次の記述のうち正しいものを一つ選べ。","choices":["文書化された判定基準に従った NDT 結果の記録及び分類を行うレベル 1 相当までは求められていない。","測定の実施、結果の記録、報告などを行うレベル 1 相当のみ満足すればよい。","レベル 1 相当の技術を保持していることはもちろんであるが、十分な訓練と経験を積み重ね、NDT 方法の適用限界の判断などを行うレベル 2 相当を維持することが求められている。","NDT 設備と職員についての管理及び責任を持つレベル 3 相当まで求められている。"],"type":"right","ans":2,"page":"p.8〜9","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。配筋探査の技術者には、JIS Z 2305 のレベル1相当に加え、経験を積んだレベル2相当が求められます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>JIS Z 2305 のレベルの目安は次のとおりです。<br>・レベル1：指示どおりに試験を行い、結果を記録する<br>・レベル2：手順書をつくり、方法の適用限界を判断し、結果を評価する<br>・レベル3：設備・人員を含めて全体を管理し、責任を持つ<br>配筋探査は、測った値が信用できる条件かどうか（近接鉄筋・水分など）を判断できなければなりません。そのためレベル2相当が必要です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①レベル1すら求めない、②レベル1だけでよい、はどちらも不足です。④レベル3（管理責任者）までは求められていません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「測るだけ（1）ではなく、結果の限界まで判断できる（2）人」。</div>","own":false,"extra":""},{"id":"c2-1","ch":"c2","n":1,"stem":"鉄筋コンクリート構造物が多く用いられる理由に関する次の記述のうち、誤っているものを一つ選べ。","choices":["圧縮応力を主としてコンクリートが分担し、引張応力を主として鉄筋が分担している。","鉄筋の破断に至るまでの変形量が大きいこと。","材料が比較的安価であること。","コンクリートの熱伝導率は大きく熱の遮断が行われないため、火災時に耐力低下の予防効果、特に鉄筋の熱劣化を防止できない。"],"type":"wrong","ans":3,"page":"p.11〜12","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。コンクリートは熱を伝えにくいので、火災のとき鉄筋を熱から守ります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>熱伝導率はコンクリートが約1.6 W/m・K、鋼が約45 W/m・K で、コンクリートは鋼の約1/30しか熱を伝えません。かぶりコンクリートが鉄筋の「耐火被覆」になります。<br>RC構造が多く使われる理由：①熱膨張率がほぼ同じ ②付着が良い ③鉄筋は破断まで大きく変形できる ④アルカリ性で鉄筋が錆びにくい ⑤熱を伝えにくく耐火性がある ⑥材料が比較的安い。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①（圧縮はコンクリート、引張は鉄筋が分担）②（鉄筋は粘り強い）③（安価）は正しい理由です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「かぶりコンクリートは鉄筋の耐火服」。</div>","own":false,"extra":""},{"id":"c2-2","ch":"c2","n":2,"stem":"鉄筋コンクリート構造物が成立する条件に関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリート中の鉄筋がコンクリートのアルカリ性で保護されて、腐食しないこと。","火災時において、コンクリートが鉄筋の耐火被覆材となり、鉄筋を保護すること。","コンクリートと鉄筋がしっかり付着し、一体となって変形に抵抗すること。","鉄筋の変形がコンクリートに力を及ぼさないように、鉄筋の熱膨張率がコンクリートのそれよりも著しく小さいこと。"],"type":"wrong","ans":3,"page":"p.11〜12","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。鉄筋とコンクリートの熱膨張率はほぼ同じです（どちらも約10×10⁻⁶/℃）。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>温度が変わっても、鉄筋とコンクリートが同じだけ伸び縮みするので、境目にずれや無理な力が生じません。もし大きく違うと、温度変化のたびに付着が壊れ、一体として働けなくなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①アルカリ性で錆を防ぐ、②火災時に鉄筋を守る、③付着して一体で抵抗する。どれもRCが成り立つ条件として正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>RCが成り立つ3本柱＝「同じだけ伸びる」「しっかりくっつく」「アルカリで錆びない」。</div>","own":false,"extra":""},{"id":"c2-3","ch":"c2","n":3,"stem":"コンクリート構造物の特徴に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋コンクリートは良好な施工がされていれば耐久性に優れた構造物である。","鉄筋コンクリートは、引張鉄筋、折曲げ鉄筋、スターラップ筋や圧縮鉄筋などをバランスよく配置し、上手に構造計画を行うことにより、じん性に富んだ構造とすることができる。","コンクリートは、熱伝導率が小さいためかぶり厚さが規定値を確保してあれば、内部の温度上昇を防ぎ鉄筋の高温による耐力低下を防ぐことができる。このため火災によって鉄筋コンクリート造の建物が倒壊することはほとんどなく、耐火性は優れている。","コンクリートは、セメント、水と骨材を練り混ぜた段階（フレッシュコンクリート）では流動性が悪く建築物の形を自由に形成することができない。そのため鉄筋コンクリート構造では、ラーメン構造やシェル構造、アーチ構造として使用できない。"],"type":"wrong","ans":3,"page":"p.12","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。フレッシュコンクリートは流動性があるので、型枠どおりに自由な形をつくれます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>まだ固まらないうちは液状に近く、型枠に流し込めば、その形のまま固まります。だから、柱と梁のラーメン構造、曲面のシェル構造、アーチ構造など、さまざまな形式を選べます。これはRCの大きな長所です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①（良い施工なら耐久性が高い）②（鉄筋の配置でじん性を持たせられる）③（熱を伝えにくく耐火性が高い）は正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「型枠に流し込める＝どんな形でもつくれる」。</div>","own":false,"extra":""},{"id":"c2-4","ch":"c2","n":4,"stem":"構造材料としてのコンクリートに期待できない性能を次の中から一つ選べ。","choices":["圧縮強度","耐久性","施工性","引張強度"],"type":"wrong","ans":3,"page":"p.11","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④の「引張強度」が、コンクリートに期待できない性能です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>コンクリートの引張強度は、圧縮強度の約1/10程度しかありません。引っ張られるとすぐにひび割れるので、引張は鉄筋に受け持たせます。これが「鉄筋コンクリート」にする理由そのものです。せん断強度も、圧縮に比べると小さい値です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①圧縮強度、②耐久性、③施工性（流し込んで成形できる）は、コンクリートの得意な性能です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「コンクリートは押されるのに強く、引っ張られるのに弱い（約1/10）」。</div>","own":false,"extra":""},{"id":"c2-5","ch":"c2","n":5,"stem":"鉄筋コンクリートの耐震性に関する次の記述のうち、正しいものを一つ選べ。","choices":["比強度が大きいので耐震性が必要な建物には最適である。","比強度が小さいので耐震性が必要な建物には最適である。","比強度が大きいので耐震性のある建物をつくるには設計を工夫する必要がある。","比強度が小さいので耐震性のある建物をつくるには設計を工夫する必要がある。"],"type":"right","ans":3,"page":"p.12","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。RCは比強度が小さい（重いわりに強さが小さい）ので、耐震性を持たせるには設計の工夫が必要です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>比強度＝強度÷密度です。目安として、コンクリート（30 N/mm²、密度2.3）は約13、鉄筋（降伏点345 N/mm²、密度7.85）は約44で、コンクリートはかなり小さくなります。地震の力は建物の重さに比例するので、重いRCは大きな地震力を受けます。そこで鉄筋をバランスよく配置し、粘り強い（じん性のある）構造にします。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①②：比強度は「大きい」ではなく「小さい」。また、小さいから耐震に「最適」というわけでもありません。③：比強度が「大きい」が誤りです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「重い→地震の力が大きい→工夫して粘り強くする」。</div>","own":false,"extra":""},{"id":"c2-6","ch":"c2","n":6,"stem":"構造物の構造形式に関する次の記述のうち、誤っているものを一つ選べ。","choices":["柱と梁を一体として構成した骨組み構造はラーメン構造という。","アーチ構造は半円状に曲げた梁を使用しており、梁にかかる荷重が主として材軸方向の圧縮力として支えることが出来るので、曲げモーメントが生じない構造となっている。","柱や梁を用いず、壁と床によって構成される構造は箱桁構造である。","屋根面などの面上部分を曲面にすることにより、鉛直荷重を屋根面に沿って作用する圧縮応力によって支える構造はシェル構造である。"],"type":"wrong","ans":2,"page":"p.12〜13","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。柱や梁を使わず、壁と床（スラブ）で構成する構造は「壁式構造」です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>壁式構造は、壁そのもので建物を支えます。ボックスカルバートや擁壁、5階建て以下の共同住宅などで使われます。「箱桁」は橋の桁の形式（中が空洞の箱形断面の桁）で、別のものです。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①ラーメン構造（柱と梁を一体化した骨組み）、②アーチ構造（主に圧縮力で支える）、④シェル構造（薄い曲面で支える）は正しい説明です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「柱・梁なし＝壁式」。ラーメンはドイツ語で「額縁（枠）」の意味です。</div>","own":false,"extra":""},{"id":"c2-7","ch":"c2","n":7,"stem":"構造機能の面から分類したコンクリート構造物の特性に関する次の記述のうち、誤っているものを一つ選べ。","choices":["無筋コンクリート構造は、引張応力が発生しない場合、あるいは、ひび割れの発生が直接破壊につながらない場合に用いられる。","鉄筋コンクリート(RC)構造は、鉄筋で補強された構造で、ひび割れを許容しているが、鉄筋がひび割れの分散やひび割れ幅の制御の機能を有する。","プレストレストコンクリート(PC)構造は、主にPC鋼材で補強された構造で、プレストレスを導入するため、ひび割れの発生を許容している。","鉄骨鉄筋コンクリート(SRC)構造は、RC構造の断面に鉄骨を埋め込んだ構造であり、構造機能としてはRC構造に似ているが、比較的規模が大きく、施工の合理化を要求する部材に適用される。"],"type":"wrong","ans":2,"page":"p.13〜15","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。PC構造は、プレストレス（あらかじめ入れておく圧縮力）で、ひび割れを生じさせないようにする構造です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>PC鋼材を引っ張ってコンクリートに圧縮力を入れておくと、後から荷重で引張が働いても、差し引きで引張がほとんど残りません。だから、ひび割れが生じません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①無筋（引張が生じない所に使う）、②RC（ひび割れは許すが、鉄筋で幅を抑える）、④SRC（鉄骨を埋め込んだ大規模向け）は正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「RC＝ひび割れを許して鉄筋で抑える」「PC＝最初から押しておいて、ひび割れさせない」。</div>","own":false,"extra":""},{"id":"c2-8","ch":"c2","n":8,"stem":"コンクリートの圧縮強度に関する次の記述のうち、正しいものを一つ選べ。","choices":["水セメント比が小さいほど強度は小さくなる。","養生時の温度が高くなるほど材齢 28 日の強度は大きくなるが、その後の強度増加量は小さい。","粗骨材の最大寸法が大きくなるほど強度は大きくなる傾向にある。","施工上、空気量は 3～6％が適切と言われているが、それより空気量が増えても強度は低下することはない。"],"type":"right","ans":1,"page":"p.34","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。養生温度が高いと初期の強度は早く出ますが、長期的な伸びは小さくなります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>温度が高いと水和反応が早く進み、28日強度は大きくなります。ただし急いで固まった組織は粗くなりやすく、その後の強度の伸びは小さくなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①水セメント比（W/C）は小さいほど強度が高い（余分な水が少なく、空隙が少ない）。③粗骨材の最大寸法が大きいほど、強度は小さくなる傾向。④空気量が1%増えると、強度は約4〜6%低下します。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「強度を決める一番の要因は水セメント比。水が多いほど弱い」。</div>","own":false,"extra":""},{"id":"c2-9","ch":"c2","n":9,"stem":"コンクリートの材料に関する次の記述のうち、誤っているものを一つ選べ。","choices":["骨材は、コンクリート材料の中で容積を最も多く占めるもので、いわゆる砂利、砂の類が用いられる。","粗骨材は、骨材のうち概して 5 mm ふるいにとどまるものを指す。最大寸法はコンクリートの使用目的により制限され、一般に、土木では 40 mm、25 mm、20 mm、建築で 25 mm、20 mm が多く用いられる。川砂利、山砂利、礫砂などの種類がある。","混和材料は、コンクリートの品質向上、性状改善のために用いられ、セメント、水、骨材以外の材料の総称である。","混和材とは、コンクリート中での容積が無視できる混和材料のことで、一般に有機質の水溶液で用いられ、その水分は練混ぜ水の一部として加算する。AE剤、AE減水剤、高性能AE減水剤などがある。"],"type":"wrong","ans":3,"page":"p.32〜33","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。④の内容は「混和剤（ざい：薬）」の説明で、「混和材（ざい：材料）」ではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>・混和剤：量がごく少なく、容積は無視できる。液体で使い、その水分は練混ぜ水に含める（AE剤・AE減水剤・高性能AE減水剤など）。<br>・混和材：量が多く、容積を配合計算に入れる。粉体で使う（フライアッシュ・高炉スラグ微粉末・膨張材など）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①骨材は容積の約7割を占める、②粗骨材は5mmふるいにとどまるもの、③混和材料の定義。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「剤＝薬（少量・液体）」「材＝材料（量が多い・粉）」。</div>","own":false,"extra":""},{"id":"c2-10","ch":"c2","n":10,"stem":"セメントに関する次の記述のうち、誤っているものを一つ選べ。","choices":["普通ポルトランドセメントは一般の工事用として最も広く使用されており、日本のセメント使用量の約 70% をしめる。","早強ポルトランドセメントは水和反応が早く、強度発現も早いので早期に所要の強度が必要なときに使用される。寒中コンクリートやプレストレストコンクリート工事などに使用される。","中庸熱ポルトランドは水和反応の速度を遅くして反応中の発熱を抑えたセメントで設計強度が 60N/mm<sup>2</sup> を超えるようなセメント使用量の多いコンクリートや部材断面の大きいマスコンクリート、気温が高くて水和反応が進みすぎる暑中のコンクリート工事などに使用される。","混合セメントはポルトランドセメントに混和材を混合したもので、フライアッシュを混合したフライアッシュセメントや高炉スラグを混合した高炉セメントなどがあり、混合割合で A、B、C、D、E、F 種の6種に区分される。"],"type":"wrong","ans":3,"page":"p.31〜32","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。混合セメントは、混合する量によって A種・B種・C種 の「3種」に区分されます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>A種→B種→C種の順に混和材（高炉スラグやフライアッシュ）の量が多くなります。現場でよく使うのは高炉セメントB種です。混和材が多いほど、発熱が小さく長期強度や化学抵抗性は良くなりますが、中性化は進みやすくなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①普通ポルトランド（使用量の約7割）、②早強（早く強度が出る。寒中・PC工事）、③中庸熱（発熱を抑える。マスコンクリート・暑中）は正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「混合セメントはABCの3種」。</div>","own":false,"extra":""},{"id":"c2-11","ch":"c2","n":11,"stem":"混和材料に関する次の記述のうち誤っているものを一つ選べ。","choices":["混和剤はコンクリート中の容積が無視できる材料をいう。","混和剤としてはフライアッシュとシリカフュームが一般的である。","混和材はコンクリートの収縮低減の目的で用いられる場合もある。","混和材はコンクリートの流動性を大きくする目的では石灰石微粉末が用いられる。"],"type":"wrong","ans":1,"page":"p.32〜33","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。フライアッシュとシリカフュームは「混和材（粉体）」で、「混和剤」ではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>混和剤の代表はAE剤・AE減水剤・高性能AE減水剤です。混和材の代表はフライアッシュ・高炉スラグ微粉末で、ほかに膨張材・石灰石微粉末・シリカフュームなどがあります。②は「材」と「剤」が入れ替わっています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①混和剤は容積を無視できる、③混和材（膨張材など）は収縮を減らす目的でも使う、④石灰石微粉末は流動性を大きくするために使う。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「剤＝薬（液体）」「材＝粉」。</div>","own":false,"extra":""},{"id":"c2-12","ch":"c2","n":12,"stem":"クリープに関する次の記述のうち、正しいものを一つ選べ。","choices":["コンクリートは長い間に炭酸ガスと反応して、本来のコンクリートの性質とは異なるものに変化する現象。","コンクリートは外力を加えても、弾性的な性質を殆ど示さない性質。","融雪剤や凍結防止剤に含まれている塩化物イオンによってコンクリートの中の鉄筋が腐食する性質。","一定の圧縮力を長期間コンクリートに作用させると、時間の経過とともに歪が次第に増大する性質。"],"type":"right","ans":3,"page":"p.35","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。クリープは、一定の力をかけ続けると、時間とともにひずみ（変形）が少しずつ増えていく性質です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>力を増やしていないのに、変形だけがじわじわ進むのが特徴です。たとえばPC構造では、クリープでコンクリートが縮み、導入した圧縮力（プレストレス）が少しずつ減ります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①は「中性化」、③は「塩害」の説明です。②：コンクリートは力を加えると弾性的な性質も示すので誤りです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「クリープ＝ずっと押され続けて、ジワジワ縮む」。</div>","own":false,"extra":""},{"id":"c2-13","ch":"c2","n":13,"stem":"ジャンカ（豆板）に関する次の記述のうち、誤っているものを一つ選べ。","choices":["ジャンカ（豆板）はコンクリートの打込み時の落下高さが大きくなると発生しやすいので、打込み時にはコンクリートの落下高さを抑える必要がある。","打ち込まれたコンクリートの一部に粗骨材が多く集まってきた空隙の多い不良部分をジャンカ（豆板）という。","柱に発生したジャンカ（豆板）の原因として、コンクリートの過密鉄筋による影響が大きい場合もある。","ジャンカ（豆板）が発生すると、中性化が鉄筋位置まで到達する時間が長くなることが多い。"],"type":"wrong","ans":3,"page":"p.36","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。豆板（ジャンカ）は空隙が多いので、中性化はむしろ早く鉄筋に届きます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>豆板は、粗骨材が集まってモルタルが足りない、スカスカの部分です。炭酸ガスや水が入りやすいので、中性化も鉄筋の腐食も早く進みます。原因は材料分離・締固め不足・型枠のすき間からのペースト漏れなどで、打込みの落下高さが大きいと材料分離が起こりやすくなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①落下高さを抑える、②豆板の定義、③過密鉄筋も原因になる。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「スカスカ（豆板）＝劣化の入り口」。</div>","own":false,"extra":""},{"id":"c2-14","ch":"c2","n":14,"stem":"コンクリート中の鉄筋腐食に関する次の記述のうち、正しいものを一つ選べ。","choices":["コンクリート中の鉄筋は、環境条件に関わらず塩化物イオンの量に比例して腐食速度は大きくなる。","コンクリート中の鉄筋は、塩化物イオンの量に関わらず酸素の量に比例して腐食速度は大きくなる。","コンクリート中の鉄筋は、酸素と水の存在がなければ、腐食速度に塩化物イオンの量の影響を受けない。","コンクリート中の鉄筋は、かぶりコンクリートの品質に関わらず、塩化物イオンが侵入すると、その量に応じて腐食速度が決定される。"],"type":"right","ans":2,"page":"p.35〜36","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。鉄筋の腐食には「酸素」と「水」が欠かせません。どちらかが無ければ、塩化物イオンが多くても腐食はほとんど進みません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>塩化物イオンがある量（目安としてコンクリート1m³あたり1.2kgがよく使われます）を超えると、鉄筋表面の保護膜（不動態皮膜）が壊れます。ただし錆が進むには、さらに酸素と水が必要です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①腐食速度は環境（酸素・水）に左右されるので、塩化物量だけでは決まりません。②塩化物イオンの量も関係します。④かぶりコンクリートの品質によって、塩化物の入り方も腐食の進み方も変わります。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「錆には水と酸素が必須。塩は保護膜を壊すきっかけ」。</div>","own":false,"extra":""},{"id":"c2-15","ch":"c2","n":15,"stem":"コンクリート構造物のひび割れに関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリート構造物の側面の配筋に沿ったひび割れは、鉄筋の腐食膨張による原因の可能性が高い。","初期に発生したと見られるひび割れを放置すれば、ひび割れから劣化因子が侵入し、コンクリート中の鉄筋の腐食はさらに速まる。","鉄筋のかぶり厚さが大きいと、鉄筋付近の塩化物イオン含有量が多くても、中性化が遅くなるため、鉄筋は腐食しない。","さび汁が見られなくても、塩害によるひび割れが生じている場合がある。"],"type":"wrong","ans":2,"page":"p.36","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。塩化物イオンが多ければ、中性化していなくても鉄筋は腐食します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>中性化は「アルカリ性が失われて」錆びる劣化、塩害は「塩化物イオンが保護膜を壊して」錆びる劣化で、仕組みが別です。かぶりが大きくても、鉄筋の位置に塩化物イオンが多ければ腐食します（両方が重なって進むこともあります）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①鉄筋に沿ったひび割れは腐食膨張が原因の可能性が高い、②初期ひび割れの放置は腐食を早める、④さび汁が出る前から塩害のひび割れがある場合もある。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「中性化＝アルカリが無くなって錆びる」「塩害＝アルカリが残っていても塩で錆びる」。</div>","own":false,"extra":""},{"id":"c2-16","ch":"c2","n":16,"stem":"コールドジョイントに関する次の記述のうち、誤っているものを一つ選べ。","choices":["コールドジョイントは打ち重ねまでの気温が高いほど発生しやすく、この面のコンクリートの曲げ強度は低下する。","ブリーディングが多いコンクリートほど、打ち重ね時間間隔に関わらずコールドジョイントは発生しにくい。","コールドジョイントが生じると、この面が脆弱となるため、構造物の耐力、耐久性、水密性を低下させる原因となる。","コンクリートを打ち重ねていくとき、前に打設したコンクリートに凝結が始まっていると連続性が失われ、コールドジョイントが発生しやすくなる。"],"type":"wrong","ans":1,"page":"p.36","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。ブリーディングが多いことは、コールドジョイントを防ぐ理由になりません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>コールドジョイントは、先に打ったコンクリートが固まり始めてから次を打ち重ねたため、一体にならずにできる継ぎ目です。決め手は「打重ね時間間隔」です。ブリーディングが多いと、上面に水やレイタンス（弱い層）がたまり、かえって一体化を妨げます。<br>許容打重ね時間間隔の目安：建築（JASS5）は外気温25℃未満で150分、25℃以上で120分。土木は25℃以下で2.5時間、25℃を超えると2.0時間。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①気温が高いほど早く固まるので発生しやすい、③弱い面になり耐力・耐久性・水密性が落ちる、④凝結が始まった後に打ち重ねると発生する。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「暑い日ほど早く固まる→打重ねの間隔を短く」。</div>","own":false,"extra":""},{"id":"c2-17","ch":"c2","n":17,"stem":"コンクリート構造物内の鉄筋腐食の原因に関する次の記述のうち、正しいものを一つ選べ。","choices":["コンクリートは強アルカリ性であることから、鉄筋表面に不動態皮膜が形成され、鉄筋の腐食を防ぐ性質がある。","コンクリートの中性化により鉄筋の不動態皮膜が破壊されるので、水分や酸素が無くても鉄筋は錆びる。","塩害は海岸付近で多くみられ、山間部、凍結地域にはこの被害は無い。","中性化はコンクリート表面から進行していくため、この中性化深さが鉄筋位置に達するまでは鉄筋腐食が始まらない。"],"type":"right","ans":0,"page":"p.35","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。コンクリートは強いアルカリ性（pH約12〜13）なので、鉄筋の表面に保護膜（不動態皮膜）ができ、錆びにくくなります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>この保護膜が壊れるきっかけが「中性化」と「塩害」です。壊れた後に水と酸素があると、腐食が進みます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②水と酸素が無ければ錆びません。③山間部や寒冷地でも、凍結防止剤（塩化物）による塩害が起きます。④中性化が鉄筋に届く前でも、残りが約10mmになると腐食が始まる目安とされています（コンクリート標準示方書［維持管理編］）。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「アルカリは鉄筋のバリア。中性化と塩でバリアが壊れる」。</div>","own":false,"extra":""},{"id":"c2-18","ch":"c2","n":18,"stem":"鉄筋コンクリートの中性化に関する次の記述のうち、正しいものを一つ選べ。","choices":["水中のコンクリートよりも、乾湿の影響を受けるコンクリートのほうが、中性化の進行は遅い。","水セメント比の小さいコンクリートは、水セメント比の大きいコンクリートよりも中性化の進行は遅い。","普通ポルトランドセメントよりも混合セメントを用いたほうが、同一水セメント比であれば中性化の進行は遅い。","温度が高いほうが、温度が低いときよりも中性化の進行は遅い。"],"type":"right","ans":1,"page":"p.35","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。水セメント比が小さい（緻密な）コンクリートほど、中性化はゆっくり進みます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>中性化は、空気中の炭酸ガスがコンクリートに入り、アルカリ性が下がる現象です。進みやすい条件は次のとおりです。<br>・水セメント比が大きい（すき間が多い）<br>・混合セメントを使う（アルカリの元になる成分が少ない）<br>・相対湿度50〜60%程度（水中や濡れたままでは進みにくい）<br>・温度が高い<br>・屋内（屋外より炭酸ガス濃度が高く、乾燥しやすい）</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①水中のコンクリートは炭酸ガスが入りにくいので、乾湿を受ける方が中性化は速く進みます。③混合セメントの方が速く進みます。④温度が高い方が速く進みます。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「緻密・水中・普通セメント・低温なら遅い」。</div>","own":false,"extra":""},{"id":"c2-19","ch":"c2","n":19,"stem":"コンクリートの中性化に関する次の記述のうち、正しいものを一つ選べ。","choices":["中性化深さが鉄筋位置までに到達した場合、一般的に、鉄筋の腐食は屋外より屋内の方が激しい。","中性化による劣化度の評価は、中性化深さと鉄筋のかぶり厚さとの関係についてのみ行う。","大気中の炭酸ガスによるコンクリート表面からの中性化深さの進行は、経過時間に関係する。","中性化の進行速度は、コンクリートの品質や配合の影響を受けるがセメントの種類による影響は受けない。"],"type":"right","ans":2,"page":"p.35","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。中性化深さは経過時間とともに進み、d ＝ α√t（α：中性化速度係数、t：経過年数）で表されます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>深さは時間の「平方根」に比例します。たとえば10年で10mm進んだ場合、40年では √4＝2倍 の20mmです。年数が4倍になって、深さがようやく2倍です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①鉄筋の腐食には水が必要なので、雨がかりのある屋外の方が激しくなります（中性化そのものは屋内が速い）。②劣化度は、中性化深さとかぶりの関係だけでなく、鉄筋の腐食状況なども合わせて評価します。④セメントの種類でも速度は変わります（混合セメントは速い）。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「年数が4倍で深さは2倍（ルートに比例）」。</div>","own":false,"extra":""},{"id":"c2-20","ch":"c2","n":20,"stem":"中性化の進行に関する次の記述のうち、で正しいものを一つ選べ。","choices":["コンクリートの中性化原因は炭酸ガスの影響によるもので、その深さは経過年数に1次比例して進行する。","中性化したコンクリートは力学的強度も低下する。","中性化はコンクリート表面から進行するため、ジャンカや初期ひび割れは鉄筋の腐食時期を早める要因とはならない。","中性化の進行速度はコンクリートの配（調）合、環境条件に左右される。"],"type":"right","ans":3,"page":"p.35","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。中性化の進む速さは、コンクリートの配合と環境条件で変わります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>配合では水セメント比やセメントの種類、環境では湿度・温度・炭酸ガス濃度が影響します（問18参照）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①深さは経過年数に「1次比例」ではなく、「平方根」に比例します。②中性化してもコンクリートの強度はほとんど変わりません。問題は、鉄筋を守るアルカリ性が失われることです。③ジャンカやひび割れからは炭酸ガスが入りやすく、鉄筋の腐食時期を早めます。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「中性化はルートtで進み、配合と環境で速さが変わる」。</div>","own":false,"extra":""},{"id":"c2-21","ch":"c2","n":21,"stem":"鉄筋コンクリートのアルカリシリカ反応の劣化に関する次の記述のうち、正しいものを一つ選べ。","choices":["アルカリシリカ反応は、コンクリート中のアルカリと骨材の反応であり、水分が多いとアルカリが希釈されて反応が少なくなる。","プレストレストコンクリート構造においては、導入されたプレストレスによりアルカリシリカ反応によるひび割れを防止できる。","アルカリシリカ反応は、打込み直後から膨張を開始し、材齢とともに反応は減少し、ほぼ 10 年程度で収束する。","アルカリシリカ反応によるひび割れは、網目状になることが多いが、水平方向に発生する場合もある。"],"type":"right","ans":3,"page":"p.36","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。アルカリシリカ反応（ASR）のひび割れは網目状（亀甲状）が多いですが、拘束の向きによっては一方向にそろって出ることもあります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>ASRは「高いアルカリ」「反応性のある骨材」「水の供給」の3つがそろうと起きます。反応でできたゲルが水を吸って膨らみ、内側から押し割ります。拘束が少なければ網目状に、鉄筋やプレストレスで拘束されると、その方向に沿ったひび割れになります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①水が多いと、ゲルが水を吸って膨張が進みます（反応は少なくなりません）。②プレストレスがあっても、ASRのひび割れは防げません。③膨張は数年たってから目立つことが多く、水の供給が続く限り長く進みます。10年で収束するとは限りません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「ASRの3条件＝アルカリ・反応性骨材・水」。</div>","own":false,"extra":""},{"id":"c2-22","ch":"c2","n":22,"stem":"コンクリートの劣化現象とその原因となる環境条件や使用材料の次の組合せのうち、誤っているものを一つ選べ。","choices":["中性化 ― 気温、湿度、酸性物質の種類と濃度","塩　害 ― 気温、酸性ガスの種類と量、風向きと風速","凍　害 ― 気温、日射量、含水率","アルカリシリカ反応 ― 気温、含水率、反応性骨材"],"type":"wrong","ans":1,"page":"p.35〜36","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。塩害の原因は、酸性ガスではなく、塩化ナトリウムなどの「塩化物イオン」です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>塩害に関わる環境条件は、海からの距離、風向き・風速（飛来塩分の運ばれ方）、凍結防止剤の散布などです。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①中性化＝気温・湿度・炭酸ガスなど酸性物質、③凍害＝気温（凍結と融解の繰返し）・日射・含水率、④ASR＝気温・含水率・反応性骨材。どれも正しい組合せです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「塩害は\"塩の運ばれ方\"（海・風・凍結防止剤）で決まる」。</div>","own":false,"extra":""},{"id":"c2-23","ch":"c2","n":23,"stem":"エフロレッセンスに関する次の記述のうち、誤っているものを一つ選べ。","choices":["エフロレッセンスはレイタンスがコンクリート表面に溶出したものである。","エフロレッセンスは水の移動が容易なひび割れやその周辺に発生しやすい。","エフロレッセンスが発生するとコンクリート構造物の美観を損なう。","エフロレッセンスには、水酸化カルシュウム、炭酸カルシュウム以外にアルカリ炭酸塩、アルカリ硫酸塩も含まれる。"],"type":"wrong","ans":0,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が誤り。エフロレッセンスは、レイタンスが溶け出したものではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>エフロレッセンス（白華）は、コンクリート中の水酸化カルシウムが水に溶けて表面に出て、空気中の炭酸ガスと反応し、炭酸カルシウムとして白く固まったものです。レイタンスは、打込み直後にブリーディングで上面に浮く、微粒子の弱い層のことで、別物です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②水が動きやすいひび割れ周辺に出やすい、③美観を損なう、④炭酸カルシウム以外の成分も含む。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「レイタンス＝打込み時に上にたまるカス」「エフロ＝後から染み出る白い粉」。</div>","own":false,"extra":""},{"id":"c2-24","ch":"c2","n":24,"stem":"鉄筋コンクリートの損傷とその原因の次の組合せのうち、誤っているものを一つ選べ。","choices":["ひび割れ ― 不同沈下、乾燥収縮、クリープ、疲労、鉄筋の腐食、アルカリシリカ反応","変色、着色 ― 雨水、排水、排ガス、ばいじん、海水、エフロレッセンス","ポップアウト ― 反応性骨材、凍結融解","磨　耗 ― 疲労、鉄筋腐食、凍結融解、初期養生不足、過大応力"],"type":"wrong","ans":3,"page":"p.57","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。磨耗の原因は、車両の走行や流水（土砂を含む水の流れ）など、表面がこすれることです。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>④に並んでいる「疲労・鉄筋腐食・凍結融解・初期養生不足・過大応力」は、ひび割れや剥離などの原因で、磨耗の原因ではありません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①ひび割れ、②変色・着色、③ポップアウト（反応性骨材や凍結融解で表面がはじける）は、正しい組合せです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「磨耗＝こすれてすり減る（車・水）」。</div>","own":false,"extra":""},{"id":"c2-25","ch":"c2","n":25,"stem":"コンクリートのひび割れが発生する次の原因のうち、誤っているものを一つ選べ。","choices":["不同沈下","クリープ","流水","アルカリシリカ反応"],"type":"wrong","ans":2,"page":"p.57","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。流水は「磨耗」の原因で、ひび割れの原因ではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>ひび割れの原因は、材料（乾燥収縮・ASR）、施工、環境、荷重など（不同沈下・クリープ・疲労）に分けられます。流水は表面をすり減らす原因です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①不同沈下、②クリープ、④アルカリシリカ反応は、どれもひび割れの原因になります。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「流水→すり減る（磨耗）。ひび割れではない」。</div>","own":false,"extra":""},{"id":"c2-26","ch":"c2","n":26,"stem":"コンクリートに発生したひび割れ、剥離の補修に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋腐食でひび割れ、剥離が生じた箇所の補修は、腐食した鉄筋の錆を除去することが原則である。","注入工法は、ひび割れに樹脂等を注入することで、雨水、炭酸ガスの侵入を防ぐことを目的としている。","中性化、塩害に対する対策として、コンクリート塗装は防水、ガス透過阻止を目的としているが、鉄筋を塗装することも有効な方法である。","アルカリシリカ反応に対するコンクリート塗装材は、中性化、塩害と同様に水の非浸透、撥水性のみがある材料が条件である。"],"type":"wrong","ans":3,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。ASR対策の塗装材は、水を通さない・撥水するだけでなく、「通気性（中の水分を逃がす性質）」も必要です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>ASRは水があると進みます。外から水を入れないのと同時に、中に残った水分を外に逃がさないと、膨張が続いてしまいます。完全にふさいで水を閉じ込めると逆効果です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①腐食した鉄筋の錆を落とす、②注入工法で雨水や炭酸ガスの侵入を防ぐ、③表面塗装と鉄筋の防錆処理。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「ASRの補修は、水を入れず、中の水は逃がす」。</div>","own":false,"extra":""},{"id":"c2-27","ch":"c2","n":27,"stem":"JASS5 の建築構造物の最小かぶり厚さの規定に関する次の記述のうち、誤っているものを一つ選べ。","choices":["図面等に表示する設計かぶり厚さには、最小かぶり厚さに 10 mm を加えた値を用いることにしている。","構造部材で柱、梁、耐力壁の屋内の最小かぶり厚さは 30 mm である。","床スラブ、屋根スラブの最小かぶり厚さは 50 mm である。","基礎の最小かぶり厚さは 60 mm である。"],"type":"wrong","ans":2,"page":"p.43","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。床スラブ・屋根スラブの最小かぶり厚さは、50mmではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>床スラブ・屋根スラブは、柱・梁よりも小さい値です（建築基準法施行令でも床は2cm）。教材の表（JASS5 最小かぶり厚さ）で確認して下さい。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①設計かぶり＝最小かぶり＋10mm（施工誤差を見込む）、②柱・梁・耐力壁の屋内は30mm、④基礎は60mm。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「設計かぶり＝最小かぶり＋10mm」「基礎は60mm」。</div>","own":false,"extra":""},{"id":"c2-28","ch":"c2","n":28,"stem":"鉄筋コンクリートの施工（工事）に関する次の記述のうち、誤っているものを一つ選べ。","choices":["型枠の設計は、コンクリートの施工時の荷重、コンクリートの側圧、打込み時の振動・衝撃などに耐え、かつ、コンクリートが寸法許容差を超えるたわみ、誤差などを生じないように設計し、必要に応じて強度及び剛性について構造計算を行う必要がある。","支保工としての支柱は、コンクリート施工時の水平荷重による崩壊、浮き上がり、ねじれなどが生じないように、水平つなぎ、筋かい材、控え綱などにより補強をする。","せき板と最外側鉄筋とのあき、バーサポート及びスペーサの材質と配置、各種配管、ボックス、埋込金具の位置及び数量についての検査は、型枠の終了した段階では困難であるため、型枠の組立の各工程において工事監理者の検査を受ける必要がある。","型枠、支保工の取り外しはコンクリートが自立できるようになってから行う。"],"type":"wrong","ans":3,"page":"p.44","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。型枠・支保工は、「自立できるか」ではなく、「所定の圧縮強度に達したか」で取り外しを判断します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>外すのが早すぎると、たわみやひび割れの原因になります。建築では、壁・梁側面などのせき板は5 N/mm²以上、スラブ下・梁底面の支保工は設計基準強度以上が目安です（問31の表参照）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①型枠は荷重・側圧・振動に耐えるよう設計する、②支柱は水平つなぎ・筋かいで補強する、③かぶりやスペーサの検査は組立の各工程で受ける。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「外すタイミングは\"強度\"で決める」。</div>","own":false,"extra":""},{"id":"c2-29","ch":"c2","n":29,"stem":"コンクリートの運搬・打込み及び締固めに関する次の記述のうち、正しいものを一つ選べ。","choices":["施工者は、自主管理として所定の品質の構造体コンクリートを確保するための運搬・打込み及び締固め計画を定めれば、工事監理者の承認を受けなくてもよい。","コンクリートの運搬・打込み及び締固め計画を定める場合の 1 回の打込み区画・打込み高さ及び打込み量は、型枠中にコンクリートを密実かつ均質に充填できる範囲とする。","コンクリートの打込みに先立ち、打込み場所を清掃し固形物などを取り除かなければならない。液体ではマシンオイル等の油脂類は取り除かなければならないが、散水した水については特に考えなくても良い。","鉄骨鉄筋コンクリート梁への打込みは、同条件のコンクリートができるように 1 回で一気に打込みを終えるようにする。"],"type":"right","ans":1,"page":"p.39〜40","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。1回に打ち込む区画・高さ・量は、型枠の中に密実で均質に充填できる範囲にします。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>一度に多く打ちすぎると、締固めが行き届かず、豆板や空隙ができます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①打込み・締固め計画は、工事監理者の承認を受けます。③散水した水も、打込み前に高圧空気などで取り除きます（水が残ると水セメント比が上がる）。④鉄骨鉄筋コンクリートの梁は、一気に打つと鉄骨の下に空隙ができやすいので、充填を確認しながら順に打ちます。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「打込み前は、水も油もゴミも取り除く」。</div>","own":false,"extra":""},{"id":"c2-30","ch":"c2","n":30,"stem":"鉄筋工事における品質管理・検査に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋コンクリート構造物の耐久性向上で重要なことの一つは、鉄筋の加工・組立てが設計図書あるいは各種の規定を守り、鉄筋が発せい（錆び）していないことを確認することである。","鉄筋工事では、コンクリートの流れが悪くなることでジャンカ、かぶり厚さの不足などが発生しないように、内側の鉄筋が少し緩めに固定してあることを確認する。","鉄筋の加工・組立てにおける品質管理・検査は、配筋図の確認、鉄筋工事の計画、鉄筋の加工、鉄筋の組立の各段階で実施する。","鉄筋の加工の段階では、切断加工機の仕様を確認することや、定められた許容誤差より小さい自主管理値を設けて管理することが必要である。"],"type":"wrong","ans":1,"page":"p.51","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。鉄筋を緩めに固定してはいけません。鉄筋は、打込みの振動や衝撃で動かないよう、しっかり固定します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>鉄筋が動くと、かぶり不足や間隔の乱れが起きます。コンクリートの充填性は、緩めることではなく、鉄筋のあきを確保し、棒形振動機を入れやすくすることで確保します。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①錆びていないか確認、③各段階（配筋図・計画・加工・組立）で検査、④自主管理値を設けて管理。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「鉄筋は動かないように、しっかり結束」。</div>","own":false,"extra":""},{"id":"c2-31","ch":"c2","n":31,"stem":"型枠の取り外しに関する次の記述のうち、誤っているものを一つ選べ。","choices":["型枠は、初期凍害を受けることなく、また容易に傷つけられることのない最低限のコンクリート強度を満足するまで、取り外してはならない。","型枠の取り外しのときは、コンクリートに損傷を与えないように静かに取り外す。","建築分野において、スラブ下および梁底面の型枠は、コンクリートが自立する強度を有したら、直ちに取り外してよい。","土木分野において、柱、壁、梁の側面の型枠は、コンクリートの圧縮強度が 5 N/mm<sup>2</sup> 以上になれば取り外してよい。"],"type":"wrong","ans":2,"page":"p.44","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。建築では、スラブ下・梁底面の型枠（支保工）は、「設計基準強度以上」になるまで外せません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>スラブや梁の底は、自分の重さと上に載る荷重を支える部分です。「自立する」程度の強度では足りません。部位によって必要な強度が違うので、下の表で整理して下さい。</div><table class=\"t\"><tr><th colspan=3>(a) 建築 JASS5</th></tr><tr><th>部位</th><th>条件</th><th>圧縮強度</th></tr>\n<tr><td rowspan=2>せき板</td><td>短期・標準</td><td>5 N/mm²</td></tr><tr><td>長期・超長期</td><td>10 N/mm²</td></tr>\n<tr><td>支保工</td><td>スラブ下・梁底面</td><td>設計基準強度</td></tr></table>\n<table class=\"t\"><tr><th colspan=2>(b) 土木（コンクリート標準・参考値）</th></tr><tr><th>部材面</th><th>圧縮強度</th></tr>\n<tr><td>フーチングの側面</td><td>3.5 N/mm²</td></tr><tr><td>柱・壁・梁の側面</td><td>5.0 N/mm²</td></tr><tr><td>スラブ・梁の底面、アーチの内面</td><td>14.0 N/mm²</td></tr></table><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①初期凍害を受けない強度まで外さない、②静かに外す、④土木の柱・壁・梁側面は5 N/mm²以上。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「側面は5 N/mm²、底面は設計基準強度（建築）」。</div>","own":false,"extra":""},{"id":"c2-32","ch":"c2","n":32,"stem":"コンクリートの養生に関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリートが硬化後に本来の性能を発揮するためには、硬化初期において十分な養生を施さなければならない。","使用するセメントの種類によって、標準の湿潤養生期間は異なる。","建築分野では、標準の湿潤養生期間が計画供用期間で区分されている。","土木分野では、日平均温度が低いほど湿潤養生期間は短くてよい。"],"type":"wrong","ans":3,"page":"p.40〜41","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。土木では、日平均温度が低いほど、湿潤養生期間は「長く」なります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>温度が低いと水和反応がゆっくり進み、強度が出るまで時間がかかります。そのぶん長く湿らせておく必要があります。早強セメントは短く、混合セメントは長く、と覚えます。</div><table class=\"t\"><tr><th rowspan=2>セメントの種類</th><th colspan=2>建築(JASS5)</th><th colspan=3>土木 日平均温度</th></tr>\n<tr><th>短期・標準</th><th>長期・超長期</th><th>15℃以上</th><th>10℃以上</th><th>5℃以上</th></tr>\n<tr><td>早強ポルトランド</td><td>3</td><td>5</td><td>3</td><td>4</td><td>5</td></tr>\n<tr><td>普通ポルトランド</td><td>5</td><td>7</td><td>5</td><td>7</td><td>9</td></tr>\n<tr><td>混合セメントB種</td><td>―</td><td>―</td><td>7</td><td>9</td><td>12</td></tr>\n<tr><td>中庸熱・低熱ポルトランド／高炉B種・フライアッシュB種</td><td>7</td><td>10</td><td>―</td><td>―</td><td>―</td></tr></table>\n<small>（日以上）</small><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①硬化初期の十分な養生が必要、②セメントの種類で期間が違う、③建築では計画供用期間で区分。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「寒いほど・混合セメントほど、養生は長く」。</div>","own":false,"extra":""},{"id":"c2-33","ch":"c2","n":33,"stem":"かぶり厚さに関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さは、鉄筋の最も外側からコンクリート表面までの最短距離をいう。","柱におけるかぶり厚さは、帯筋表面からコンクリート表面までの最短距離をいう。","梁におけるかぶり厚さは、あばら筋表面からコンクリート表面までの最短距離をいう。","基礎におけるかぶり厚さには、捨コンクリートの厚さも含める。"],"type":"wrong","ans":3,"page":"p.41〜43","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。捨てコンクリートの厚さは、基礎のかぶり厚さには含めません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>捨てコンクリートは墨出しや型枠設置のための下地で、品質も一体性も保証されないからです。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①かぶり＝最も外側の鉄筋からコンクリート表面までの最短距離、②柱は帯筋から、③梁はあばら筋から測る。どれも正しい記述です。配筋探査でも、最初に検出されるのは最も外側の鉄筋です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「かぶりは\"いちばん外側の鉄筋\"から測る。捨てコンは数えない」。</div>","own":false,"extra":""},{"id":"c2-34","ch":"c2","n":34,"stem":"建築構造物設計図に関する次の記述のうち、誤っているものを一つ選べ。","choices":["伏図には、主要構造部材である基礎や柱、梁、スラブ、壁などの構成が、各階別、かつ平面的に表示され、また各部材番号などが記載されている。","軸組図は、配筋にかかわる一般事項や鉄筋加工、かぶり厚さ、杭、基礎などの項目からなり、鉄筋のあき、帯筋（フープ）やあばら筋（肋筋：スターラップ）の配置についての基本事項や標準図などが記載されている。","配筋詳細図には、主要構造部材である柱の主筋や帯筋、梁の主筋やあばら筋の配筋状態が、各階をとおして詳細に記載されている。","柱・梁・スラブ・壁各断面リストには、主要構造部材である柱、梁の各階別の断面形状、鉄筋本数、径などと、スラブ、壁の種類別の厚さや鉄筋径、配筋間隔などが一覧の表として記載されている。"],"type":"wrong","ans":1,"page":"p.17〜20","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。②の内容は「配筋標準図」の説明で、軸組図ではありません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>軸組図は、各通りの柱・梁などを立面（横から見た図）で表し、高さ関係や部材の構成を示す図です。配筋標準図は、かぶり・継手・定着・フックなど、建物全体に共通するルールをまとめた図です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①伏図（各階を上から見た部材の配置）、③配筋詳細図（柱・梁の配筋の詳細）、④断面リスト（部材ごとの断面・鉄筋の一覧）は正しい説明です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「伏図＝上から」「軸組図＝横から」「標準図＝共通ルール」。</div>","own":false,"extra":""},{"id":"c2-35","ch":"c2","n":35,"stem":"土木構造物の作図方法に関する次の記述のうち、誤っているものを一つ選べ。","choices":["側面図では、道路（鉄道）は起点側を左側、終点側が右側になるように作図する。","平面図では、上からの視線で作図する。","断面図では、道路（鉄道）の起点側から終点方向の視線で作図する。","横断図では、河川の場合は下流から上流方向の視線で作図する。"],"type":"wrong","ans":3,"page":"p.23〜24","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。横断図で河川の場合は、「上流から下流」を見る向きで作図します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>河川の左岸・右岸も、下流を向いて左手側・右手側で決めます。川は流れる方向を見る、と統一されています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①側面図は起点側を左、②平面図は上から、③断面図は起点から終点方向を見る。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「川は流れる方向（下流）を見る。左岸・右岸と同じ」。</div>","own":false,"extra":""},{"id":"c2-36","ch":"c2","n":36,"stem":"コンクリートの用語に関する次の記述のうち、誤っているものを一つ選べ。","choices":["フレッシュコンクリートとは、材料の混合直後から凝結が始まるまでのコンクリートをいう。","ワーカビリティーとは、コンクリートを作るのに必要な各材料の使用割合又は使用量をいう。","混和材料とは、コンクリートの品質向上、性状改善のために用いられ、セメント、水、骨材以外の材料の総称をいう。","呼び強度とは、レディーミクストコンクリートに規定するコンクリートの強度の区分をいう。"],"type":"wrong","ans":1,"page":"p.28〜30","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。②は「配合（建築では調合）」の説明です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>ワーカビリティーは、運搬・打込み・締固め・仕上げのしやすさのことで、材料分離のしにくさも含みます。各材料の使用割合や使用量のことではありません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①フレッシュコンクリート、③混和材料、④呼び強度の説明は正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「配合（土木）＝調合（建築）＝材料の割合」「ワーカビリティー＝施工のしやすさ」。</div>","own":false,"extra":""},{"id":"c2-37","ch":"c2","n":37,"stem":"鋼材の用語に関する次の記述のうち、誤っているものを一つ選べ。","choices":["丸鋼とは、断面が一様な円形の鉄筋をいう。","異形棒鋼（鉄筋）とは、コンクリートとの付着をよくするために、表面に突起をもつ棒状の鋼材（鉄筋）をいう。","PC 鋼材とは、プレストレストコンクリートに用いる緊張用の鋼材をいう。","鋼材のあきとは、コンクリート部材内に配置された鋼材の中心間の距離をいう。"],"type":"wrong","ans":3,"page":"p.28〜30","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。④は「鉄筋間隔（中心間距離）」の説明です。「あき」は、隣り合う鋼材の表面と表面の間（すき間）の距離です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>あき ≒ 間隔 − 鉄筋の外径 です。あきは、粗骨材が通るか（充填できるか）を確認するのに使います。配筋探査で測るのは、中心間の「間隔」です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①丸鋼、②異形棒鋼（表面の突起で付着を良くする）、③PC鋼材の説明は正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「あき＝すき間」「間隔＝中心から中心」。</div>","own":false,"extra":""},{"id":"c2-38","ch":"c2","n":38,"stem":"鉄筋の役割に関する次の記述のうち、誤っているものを一つ選べ。","choices":["主鉄筋は、柱、梁、スラブなどで曲げモーメント、軸力を負担するために配置される鉄筋である。","配力鉄筋は、応力を分散させる目的で、一般に主鉄筋と直角に配置される鉄筋である。","帯鉄筋は、主筋を包含するように配置され、主に柱の曲げモーメントを負担するために配置される鉄筋である。","あばら筋は、主にせん断力に抵抗するため、梁の主筋を包含するように配置される鉄筋である。"],"type":"wrong","ans":2,"page":"p.47","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が誤り。帯鉄筋（フープ）は、主に柱の「せん断力」に抵抗するための鉄筋です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>帯鉄筋は主筋を取り巻くように配置し、せん断補強のほか、主筋の座屈を防ぎ、内部のコンクリートを拘束する役目もあります。曲げモーメントと軸力を受け持つのは主鉄筋です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①主鉄筋（曲げモーメント・軸力）、②配力鉄筋（応力を分散）、④あばら筋（梁のせん断力）は正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「せん断は\"巻く\"鉄筋が受け持つ（柱＝帯筋、梁＝あばら筋）」。</div>","own":false,"extra":""},{"id":"c2-39","ch":"c2","n":39,"stem":"鉄筋の応力ーひずみ曲線において、A～Cに対応する次の語句の組合せとして、正しいものを一つ選べ。","choices":["A：上降伏点　B：引張強度　C：破断点","A：上降伏点　B：せん断強度　C：曲げ強度","A：圧縮強度　B：引張強度　C：曲げ強度","A：圧縮強度　B：せん断強度　C：破断点"],"type":"right","ans":0,"page":"p.46","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。A＝上降伏点、B＝引張強度（最大の応力）、C＝破断点です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>鉄筋を引っ張ると、次の順に進みます。<br>①弾性域：力を抜けば元に戻る<br>②上降伏点（A）：急に伸び始める点<br>③降伏棚：力がほぼ一定のまま伸びる<br>④ひずみ硬化：再び力が上がる<br>⑤引張強度（B）：最大の応力<br>⑥くびれて破断（C）</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②③④：せん断強度・曲げ強度・圧縮強度は、鉄筋の引張試験の曲線には出てきません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「降伏→最大（引張強度）→破断」の順。</div>","own":false,"extra":"<img class=\"fig\" alt=\"応力ひずみ曲線\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/wAALCADrAUABAREA/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZ かぶりが 75 mm 以上の場合、設計かぶり×2 の距離の鉄筋間隔が測定できること。","設計かぶりが 75 mm 以上の場合、設計かぶり×3 の距離の鉄筋間隔が測定できること。","設計かぶりが 75 mm 以上の場合、設計かぶり×4 の距離の鉄筋間隔が測定できること。"],"type":"right","ans":0,"page":"P.67 表3.3-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。設計かぶりが75mm以上の場合は、「設計かぶりと同じ距離」の鉄筋間隔を測定できる性能が必要です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>レーダ法は、かぶりが深くなるほど隣の鉄筋の反射が重なり、1本ずつ見分けにくくなります。そこで、少なくとも「かぶりと同じ間隔」で並ぶ鉄筋を区別できることを求めています。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②③④の「×2〜×4」は、要領の数値と合いません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「かぶり75mm以上なら、かぶりと同じ間隔を見分けられること」。</div>","own":false,"extra":""},{"id":"cr-3","ch":"cr","n":3,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている電磁誘導法によるかぶり（厚さ）測定について、次の記述のうち正しいものを一つ選べ。","choices":["測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔が設計かぶりの 1.5 倍以下の場合補正が必要である。","測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔が設計かぶりの 2 倍以下の場合補正が必要である。","測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔が設計かぶりの 2.5 倍以下の場合補正が必要である。","測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔に関係なくかぶり補正は必要である。"],"type":"right","ans":0,"page":"P.118","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。電磁誘導法では、鉄筋間隔が設計かぶりの1.5倍以下の場合に補正が必要です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>電磁誘導法は近接鉄筋の影響を受けやすく、間隔に比べてかぶりが深いほど、かぶりが浅く出ます（第4章 問15）。間隔÷かぶり（k＝d/t）が1.5以下になると影響が無視できないため、補正します。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②2倍、③2.5倍は要領の数値と違います。④間隔に関係なく必要、ではありません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「間隔 ≦ かぶり×1.5 なら補正」。</div>","own":false,"extra":""},{"id":"cr-4","ch":"cr","n":4,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている探査装置の性能で、かぶりの測定精度について、次の記述のうち正しいものを一つ選べ。","choices":["±20 mm 以下であること。","±15 mm 以下であること。","±10 mm 以下であること。","± 5 mm 以下であること。"],"type":"right","ans":3,"page":"P.67 表3.3-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。かぶりの測定精度は±5mm以下です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>要領の探査装置の性能：かぶりの測定精度は±5mm以下、鉄筋間隔の測定精度は±10mm以下（問5）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①±20mm、②±15mm、③±10mm は、かぶりの精度としては基準と違います。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「かぶり±5、間隔±10」。</div>","own":false,"extra":""},{"id":"cr-5","ch":"cr","n":5,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている探査装置の性能で、鉄筋間隔の測定精度について、次の記述のうち正しいものを一つ選べ。","choices":["±25 mm 以下であること。","±20 mm 以下であること。","±15 mm 以下であること。","±10 mm 以下であること。"],"type":"right","ans":3,"page":"P.67 表3.3-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。鉄筋間隔の測定精度は±10mm以下です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>要領の探査装置の性能：鉄筋間隔±10mm以下、かぶり±5mm以下（問4）。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①±25mm、②±20mm、③±15mm は基準と違います。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「かぶり±5、間隔±10」。</div>","own":false,"extra":""},{"id":"cr-6","ch":"cr","n":6,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている測定対象について、次の記述のうち正しいものを一つ選べ。","choices":["ボックスカルバートの測定断面数は、1 基あたり 1 断面とする。","ボックスカルバートの測定断面数は、1 基あたり 2 断面とする。","橋梁上部工の測定断面数は、1 径間あたり 1 断面とする。","橋梁上部工の測定断面数は、1 径間あたり 2 断面とする。"],"type":"right","ans":1,"page":"P.52","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。ボックスカルバートの測定断面数は、1基あたり2断面です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>要領の測定断面数の標準：<br>・橋梁上部構造：1径間あたり3断面（支間中央部と支点部近傍）<br>・橋梁下部構造：柱部は3断面（基部・中間部・天端付近）、張出し部は下面2か所<br>・ボックスカルバート：1基あたり2断面</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①1断面は少なすぎます。③④橋梁上部工は1径間あたり「3断面」です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「上部3・下部（柱）3・ボックス2」。</div>","own":false,"extra":""},{"id":"cr-7","ch":"cr","n":7,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている測定対象について、次の記述のうち正しいものを一つ選べ。","choices":["配筋状態の測定は、鉄筋間隔を対象とする。","配筋状態の測定は、測定長さあたりの鉄筋本数を対象とする。","配筋状態の測定は、鉄筋間隔及び測定長さあたりの鉄筋本数を対象とする。","配筋状態の測定は、鉄筋間隔又は測定長さあたりの鉄筋本数を対象とする。"],"type":"right","ans":2,"page":"P.55 表2.8-3","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。配筋状態の測定は、「鉄筋間隔」と「測定長さあたりの鉄筋本数」の両方が対象です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>測定範囲は60cm×60cm以上です（問8）。間隔だけでなく本数も確かめることで、鉄筋の入れ忘れなどを見つけられます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①②どちらか片方だけでは不足です。④「又は」ではなく「及び」（両方）です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「間隔と本数、両方見る」。</div>","own":false,"extra":""},{"id":"cr-8","ch":"cr","n":8,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている測定対象について、次の記述のうち正しいものを一つ選べ。","choices":["測定断面において設定した測定箇所は、30cm 以上×30 cm 以上の範囲とする。","測定断面において設定した測定箇所は、40cm 以上×40 cm 以上の範囲とする。","測定断面において設定した測定箇所は、50cm 以上×50 cm 以上の範囲とする。","測定断面において設定した測定箇所は、60cm 以上×60 cm 以上の範囲とする。"],"type":"right","ans":3,"page":"P.153 関連資料①","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。測定箇所は、60cm以上×60cm以上の範囲とします。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>この範囲で、鉄筋間隔と測定長さあたりの本数を確認します（問7）。鉄筋が数本以上入る広さにすることで、間隔のばらつきや本数を正しく判断できます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①30cm、②40cm、③50cm は、要領の値より小さい範囲です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「測定範囲は 60cm角 以上」。</div>","own":false,"extra":""},{"id":"c3-1","ch":"c3","n":1,"stem":"次は、電磁波が比誘電率ε<sub>r</sub>の媒体中を進む速度を表している。正しいものを一つ選べ。ただし、速度単位 m/s とする。","choices":["(3×10<sup>8</sup>) ／ √ε<sub>r</sub>","(3×10<sup>8</sup>) ／ ε<sub>r</sub>","(3×10<sup>8</sup>) ／ ε<sub>r</sub><sup>2</sup>","(3×10<sup>8</sup>) ／ ε<sub>r</sub><sup>3</sup>"],"type":"right","ans":0,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。電磁波の速度 v ＝ 3×10⁸ ÷ √εr（m/s）です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>3×10⁸ m/s は空気中（真空中）の速さ（光速）です。比誘電率 εr の物の中では、その「ルート」で割った分だけ遅くなります。<br>例：εr＝4 → √4＝2 → 光速の1/2、εr＝9 → √9＝3 → 光速の1/3。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②③④は、εr をそのまま、または2乗・3乗で割っていて誤りです。割るのは「√εr」です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「速さは ルートεr で割る」。レーダ法の計算はすべてここから始まります。</div>","own":true,"extra":""},{"id":"c3-2","ch":"c3","n":2,"stem":"次の文は、電磁波が比誘電率 9 のコンクリート中を進む速度は、空気中を進む速度に比べてどのように変わるかを説明している。正しいもの一つ選べ。","choices":["全く変わらない。","1/9 に減速する。","1/3 に減速する。","1/2 に減速する。"],"type":"right","ans":2,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。比誘電率9のコンクリート中では、速度は空気中の1/3になります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>v ＝ 3×10⁸ ÷ √9 ＝ 3×10⁸ ÷ 3 ＝ 1×10⁸ m/s。空気中（3×10⁸ m/s）の1/3です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②の「1/9」は、ルートを取り忘れたときの答えです。よくある引っかけです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「εr＝9なら1/3、εr＝4なら1/2」。</div>","own":true,"extra":""},{"id":"c3-3","ch":"c3","n":3,"stem":"次は、乾燥したコンクリートの比誘電率である。最も近いものを一つ選べ。","choices":["1","2 ～ 3","4 ～ 12","∞"],"type":"right","ans":2,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。乾燥したコンクリートの比誘電率は、4〜12程度です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>比誘電率の目安：空気＝1、乾燥コンクリート＝4〜12、水＝約80。金属は、電磁波をほぼ完全に反射するので「∞」として扱います。コンクリートは水分を含むほど値が大きくなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①1は空気、④∞は金属の扱いです。②2〜3は、コンクリートとしては小さすぎます。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「空気1・コンクリート4〜12・水80・金属∞」。</div>","own":true,"extra":""},{"id":"c3-4","ch":"c3","n":4,"stem":"次の文は、コンクリート材質の誘電率の変動要因について説明している。正しいものを一つ選べ。","choices":["含水率が増えると大きくなる。","温度が高いほど大きくなる。","硬いほど大きくなる。","鉄筋の密集度合いにより変化する。"],"type":"right","ans":0,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。コンクリートの比誘電率は、含水率が増えると大きくなります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>水の比誘電率は約80と非常に大きいので、少しの水分でもコンクリート全体の値が大きく変わります。脱型直後や雨の後は値が大きくなり、電磁波が遅く・弱くなります。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②温度、③硬さ、④鉄筋の密集度は、比誘電率の主な変動要因ではありません。鉄筋は反射の対象であり、コンクリートの比誘電率そのものを変えるわけではありません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「比誘電率を動かす一番の要因は水」。</div>","own":true,"extra":""},{"id":"c3-5","ch":"c3","n":5,"stem":"次は、電磁波が比誘電率ε<sub>1</sub>からε<sub>2</sub>の境界に到達したときの反射率γを表している。正しいものを一つ選べ。","choices":["γ ＝ (ε<sub>1</sub> − ε<sub>2</sub>) ／ (ε<sub>1</sub> + ε<sub>2</sub>)","γ ＝ (ε<sub>1</sub> + ε<sub>2</sub>) ／ (ε<sub>1</sub> − ε<sub>2</sub>)","γ ＝ { (ε<sub>1</sub> − ε<sub>2</sub>) ／ (ε<sub>1</sub> + ε<sub>2</sub>) }<sup>2</sup>","γ ＝ (√ε<sub>1</sub> − √ε<sub>2</sub>) ／ (√ε<sub>1</sub> + √ε<sub>2</sub>)"],"type":"right","ans":3,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。反射率 γ ＝ (√ε₁ − √ε₂) ÷ (√ε₁ + √ε₂) です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>境目の両側で比誘電率の差が大きいほど、反射が強くなります。式にも「ルート」が付く点に注意します。速度の式（3×10⁸ ÷ √εr）と同じく、ルートで考えます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①③はルートが付いていません。②は分子と分母が逆です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「反射率も速度も、比誘電率はルートで使う」。</div>","own":true,"extra":""},{"id":"c3-6","ch":"c3","n":6,"stem":"比誘電率 4 のコンクリートと金属の境界の反射率は、同じコンクリートと空洞の境界の反射率の何倍か。正しいものを一つ選べ。","choices":["0.2 倍","0.6 倍","1 倍","3 倍"],"type":"right","ans":3,"page":"","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。金属との境目の反射は、空洞との境目の3倍の強さです。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>コンクリート：εr＝4（√＝2）。<br>・金属（εr＝∞）との境目：反射率の大きさは1（すべて反射）<br>・空洞（空気 εr＝1、√＝1）との境目：γ＝(2−1)÷(2+1)＝1/3<br>1 ÷ 1/3 ＝ 3倍。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①②③は計算が合いません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「金属は全部はね返す（1）」。空洞は差の分だけはね返す。</div>","own":true,"extra":""},{"id":"c3-7","ch":"c3","n":7,"stem":"直接反射波形（Aモード）の最初のピーク（表面から見て）の極性によりどのようなことが判るか、次の中から正しいものを一つ選べ。","choices":["空洞の大きさの測定ができる。","鉄筋径の測定ができる。","反射物標の材質の特定ができる。","コンクリートの比誘電率値に比べ反射物標の比誘電率の大小関係がわかる。"],"type":"right","ans":3,"page":"p.61 3.1.4(2)","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。最初のピークの極性（プラスかマイナスか）で、反射した物の比誘電率がコンクリートより大きいか小さいかが分かります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>反射率の式 γ＝(√ε₁−√ε₂)÷(√ε₁+√ε₂) で、ε₁＝コンクリート、ε₂＝反射物です。<br>・鉄筋（比誘電率が大きい）→ γ はマイナス<br>・空洞（比誘電率が小さい）→ γ はプラス<br>符号（極性）を見ると、鉄筋のようなものか、空洞のようなものかを区別できます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①空洞の大きさ、②鉄筋径、③材質の特定は、極性だけでは分かりません。分かるのは比誘電率の「大小関係」だけです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「マイナス＝鉄筋っぽい、プラス＝空洞っぽい」。</div>","own":false,"extra":""},{"id":"c3-8","ch":"c3","n":8,"stem":"次は、電磁波の波長λと周波数 f の関係を表している正しいものを選べ。ただし、C は媒体中を進む電磁波の速度とする。","choices":["λ ＝ Cf","λ ＝ C ／ f","λ ＝ C<sup>2</sup> ／ f","λ ＝ Cf<sup>2</sup>"],"type":"right","ans":1,"page":"p.61 式3.1-4","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。波長 λ ＝ C ÷ f（C：媒体中の速度、f：周波数）です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>例：比誘電率9のコンクリート中では C＝1×10⁸ m/s。周波数1GHz（1×10⁹ Hz）なら、λ＝1×10⁸ ÷ 1×10⁹ ＝ 0.1m ＝ 100mm。<br>周波数が高いほど波長が短くなり、細かいものを見分けやすくなります。ただし減衰が大きく、深くまでは届きません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①③④は式の形が誤りです。「速さ＝波長×周波数」を変形すると、λ＝C÷f になります。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「速さ＝波長×周波数」から変形する。</div>","own":false,"extra":""},{"id":"c3-9","ch":"c3","n":9,"stem":"次は、電磁波レーダで使用される周波数である。最も近いものを一つ選べ。","choices":["200Hz　～　2kHz","200kHz　～　2MHz","200MHz　～　2GHz","200GHz　～　2THz"],"type":"right","ans":2,"page":"p.61 3.1.5","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。電磁波レーダでは、200MHz〜2GHz の周波数が使われます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>周波数の使い分け：高い周波数は浅いところを細かく見る、低い周波数は深いところまで届く代わりに粗く見る、です。配筋探査ではかぶり程度の深さを見るので、この帯域が使われます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①②は低すぎ、④は高すぎます。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「レーダは メガ〜ギガ（200MHz〜2GHz）」。</div>","own":false,"extra":""},{"id":"c3-10","ch":"c3","n":10,"stem":"国内で使用される電磁波に関する次の記述のうち、正しいものを一つ選べ。","choices":["無線局でないので、制約はない。","電波法で制約されている。","電波法施行規則で制約されている。","電波法と電波法施行規則で制約されている。"],"type":"right","ans":3,"page":"p.61 3.1.6","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。電磁波レーダが出す電波は、電波法と電波法施行規則の両方で制約されています。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>電波を出す設備は、原則として無線局の免許が必要です（電波法第4条）。ただし、ごく弱い電波は免許不要とされ、その強さの基準を電波法施行規則（第6条）で定めています。探査装置は、この基準の範囲で使います。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①無線局でなくても制約はあります。②③は片方だけで不十分です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「法律（電波法）＋細かい基準（施行規則）」のセット。</div>","own":false,"extra":""},{"id":"c3-11","ch":"c3","n":11,"stem":"次は、電磁波レーダ法において媒体の比誘電率ε<sub>r</sub>、送信してから受信するまでの時間（反射時間）T から測定かぶり厚さ D を求める式である。正しいものを一つ選べ。","choices":["D ＝ (T ／ 4) × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>","D ＝ (T ／ 2) × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>","D ＝ T × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>","D ＝ 2T × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>"],"type":"right","ans":1,"page":"p.64 式3.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。D ＝ (T ÷ 2) × 3×10⁸ ÷ √εr です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>反射時間 T は、電波が鉄筋まで行って「戻ってくる」までの時間です。進んだ距離はかぶりの2倍（往復）なので、2D ＝ T × v、つまり D ＝ (T/2) × v です。v には問1の速度の式を入れます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①T/4、③T、④2T は往復の扱いが誤りです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「往復だから2で割る」。</div>","own":false,"extra":""},{"id":"c3-12","ch":"c3","n":12,"stem":"次は、電磁波レーダ法において、鉄筋からの反射時間 2×10<sup>-9</sup> s、コンクリートの比誘電率 4、空気中の電磁波速度 3×10<sup>8</sup> m/s のとき、かぶり厚さを示している。正しいものを一つ選べ。","choices":["25 mm","50 mm","100 mm","150 mm"],"type":"right","ans":3,"page":"p.64 式3.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。かぶり厚さは150mmです。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>D ＝ (T/2) × 3×10⁸ ÷ √εr<br>＝ (2×10⁻⁹ ÷ 2) × 3×10⁸ ÷ √4<br>＝ 1×10⁻⁹ × 1.5×10⁸<br>＝ 0.15 m ＝ 150 mm</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①25mm・②50mm・③100mm は、2で割るのを忘れたり、ルートを取り忘れたりしたときの値です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「T/2 → 速さを掛ける → mに直す」の3ステップ。</div>","own":false,"extra":""},{"id":"c3-13","ch":"c3","n":13,"stem":"次は、実際のかぶり厚さ 70mm の比誘電率が一様なコンクリート構造物を、電磁波レーダ法で比誘電率を 8 にセットして測定するとかぶり厚さは 50mm となったときの、このコンクリート構造物の実際の比誘電率を示している。最も近いものを次の中から一つ選べ。","choices":["4","6","12","16"],"type":"right","ans":0,"page":"p.64 式3.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。実際の比誘電率は約4です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>測定かぶりは √εr に反比例します。だから「実際のかぶり÷測定値＝√設定値÷√実際の値」です。<br>70 ÷ 50 ＝ √8 ÷ √εr<br>√εr ＝ √8 × 50/70<br>εr ＝ 8 × (50/70)² ＝ 8 × 0.51 ≒ 4.08 → 約4</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>比誘電率を実際（約4）より大きい8にしたため、かぶりが浅く（50mm）出た、という関係です（問14参照）。②③④は計算が合いません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「設定を大きくすると浅く出る。比を2乗して戻す」。</div>","own":false,"extra":""},{"id":"c3-14","ch":"c3","n":14,"stem":"電磁波レーダ法によるかぶり厚さ測定において、測定現場のコンクリートの比誘電率を真値よりも大きな値に設定した場合、かぶり厚さ測定値に関する次の記述のうち、正しいものを一つ選べ。","choices":["真値より深く測定される。","真値より浅く測定される。","比誘電率に影響されない。","比誘電率値に比例して大きくなる。"],"type":"right","ans":1,"page":"p.64 式3.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。比誘電率を真値より大きく設定すると、かぶりは真値より「浅く」測定されます。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>かぶりの計算式 D ＝ (T/2) × 3×10⁸ ÷ √εr で、εr を大きくすると割る数が大きくなり、D は小さく出ます。<br>例：真値4のところを9に設定すると、√4/√9＝2/3 で、100mm が約67mm と表示されます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①深くなるのは、小さく設定したときです。③比誘電率の影響は受けます。④比例ではなく、√εr に反比例して小さくなります。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「εrを大きく設定→浅く出る（危険側）」。かぶり不足を見逃さないよう注意。</div>","own":false,"extra":""},{"id":"c3-15","ch":"c3","n":15,"stem":"次の文は、電磁波レーダ法の装置について述べたものである。正しいものを一つ選べ。","choices":["一組の送信・受信アンテナが組み込まれた装置（シングルパス方式）は比誘電率の設定は必要ない。","あらかじめ設定された比誘電率とかぶり厚さから、電磁波の伝搬時間を推定する。","送信波には、「インパルス方式」と「チャープ方式」がある。","受信波の表示方法 A モード（またはスコープ）では、縦軸が縦方向の走査方向、横軸が横方向の走査方向、ある深さの反射強度を各点の輝度で表す。"],"type":"right","ans":2,"page":"p.8, p.64","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。送信波には「インパルス方式」と「チャープ方式」があります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>・インパルス方式：ごく短いパルスの電波を送る<br>・チャープ方式：周波数を連続的に変化させた電波を送る<br>受信波の表示方法は3種類です。<br>・Aモード：1地点の波形（横軸＝時間、縦軸＝振幅）<br>・Bモード：断面の画像（走査方向×深さ）<br>・Cモード：ある深さの平面の画像</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①シングルパス方式でも比誘電率の設定は必要です。②は逆で、マルチパス方式は「反射時間から比誘電率を推定」します。④はCモードの説明で、Aモードではありません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「A＝波形、B＝断面、C＝平面」。</div>","own":false,"extra":""},{"id":"c3-16","ch":"c3","n":16,"stem":"次の文は、電磁波レーダ法における測定上の注意点について述べたものである。正しいものを一つ選べ。","choices":["コンクリート内部の水分量（含水率）は測定に影響を与えない。","探査面が凹凸の場合、走査距離誤差を小さくするため高速に走査する。","炭素繊維（カーボンシート補強など）は測定に影響を与えない。","周囲に強い電磁波の発生源（強い高周波を発生する装置など）がないことを確認する。"],"type":"right","ans":3,"page":"p.68 3.4","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。周囲に強い電磁波の発生源（溶接機や強い高周波を出す装置など）がないことを確認します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>レーダ法は電磁波を受信して判定するので、外からの強い電磁波がノイズになり、正しく測れません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①水分量は比誘電率を変えるので影響します。②凹凸面ではベニヤ板などを当てて走査し、その厚さを差し引きます。速く走査するのは誤りです。③炭素繊維は電気を通すため、電磁波を反射して影響します。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「レーダの敵は、水・金属・炭素繊維・外からの電波」。</div>","own":false,"extra":""},{"id":"c3-17","ch":"c3","n":17,"stem":"次の文は、電磁波レーダ法における装置の点検について述べたものである。正しいものを一つ選べ。","choices":["定期点検は、トレーサビリティが重要なため外部に依頼してはならない。","日常点検は、試験開始前に一度だけ行う。","かぶり厚さの測定性能の確認は、対比試験体又は標準試験体を用いて行う。","走査距離の測定性能の確認は、平坦度 1 mm 以内の面の 10 mm を走査した際の読み取り誤差を用いる。"],"type":"right","ans":2,"page":"p.72〜76","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。かぶり厚さの測定性能は、対比試験体または標準試験体を使って確認します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>かぶりが分かっている試験体を測り、表示値との差を見ます。点検の区分は次のとおりです。<br>・定期点検：メーカーなど外部で校正し、トレーサビリティ（国家標準までのつながり）を確保する<br>・日常点検：試験開始前・試験中・試験終了時に行う</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①定期点検は、外部に依頼してよい（むしろ外部で校正する）。②日常点検は1回だけではありません。④走査距離の確認は、500mmと1000mmを走査して行います。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「定期＝外部で校正、日常＝前・中・後」。</div>","own":false,"extra":""},{"id":"c3-18","ch":"c3","n":18,"stem":"次の文は、電磁波レーダ法における比誘電率の推定について述べたものである。正しいものを一つ選べ。","choices":["モルタルやタイルなど厚く比誘電率が変化しやすい仕上げ材がある場合、鉄筋平面位置、鉄筋間隔は試験対象とするが、かぶり厚さは参考扱いとする。","設計図書、施工図等から得られた配筋状態は測定結果として用いてよい。","かぶり厚さ試験のための走査線は、鉄筋の真上に設定する。","距離が加算される試験装置は、前進と後退を繰り返して測定することが原則である。"],"type":"right","ans":0,"page":"p.76〜80","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。モルタルやタイルなど、厚くて比誘電率が変わりやすい仕上げがある場合、かぶり厚さは参考扱いにします。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>仕上げ材の比誘電率が分からないと、かぶりの計算（√εr で割る）が正しくできません。一方、鉄筋の平面位置や間隔は、比誘電率の影響を受けにくいので試験の対象にできます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②設計図の配筋は「確認する対象」であって、測定結果の代わりにはできません。③走査線は、鉄筋の真上ではなく、鉄筋と鉄筋の中間で、測る鉄筋に直交させます。④距離を加算する装置は、一方向に動かすのが原則です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「比誘電率が読めない所では、かぶりは参考値」。</div>","own":false,"extra":""},{"id":"c3-19","ch":"c3","n":19,"stem":"次の文は、電磁波レーダ法における比誘電率の推定について述べたものである。正しいものを一つ選べ。","choices":["カーブフィッティング法は、鉄筋の断面形状が円であることを利用する。","鉄筋径法は、格子状に配筋されている縦筋と横筋のかぶり厚さの差が、コンクリート表面に近い鉄筋の径に一致することを利用する。","鉄筋径法は、縦筋と横筋両方の鉄筋径が同じであることを前提としている。","実測法は、鉄筋探査装置ではない専用の装置を用いてボス供試体から誘電率を測定する方法である。"],"type":"right","ans":1,"page":"p.86〜89 3.7","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が正しい。鉄筋径法は、格子状の配筋で、縦筋と横筋のかぶりの差が表面側の鉄筋の径に等しいことを利用します。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>縦筋と横筋は接して結束されているので、奥の鉄筋は、手前の鉄筋の径の分だけ深い所にあります。この「深さの差（径）」と「反射時間の差」から電磁波の速度が分かり、比誘電率を逆算できます。<br>比誘電率の推定方法：<br>・カーブフィッティング法：鉄筋の反射像が双曲線になることを利用<br>・鉄筋径法：縦横筋のかぶり差＝鉄筋径を利用<br>・実測法：探査装置の測定値と、実際に測った寸法（真値）を比べて求める</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①カーブフィッティング法は、反射像が「双曲線」になることを利用します（断面が円であることではない）。③鉄筋径法は、縦筋と横筋の径が同じことを前提にしていません（径が分かっていて、縦横筋が接していることが前提）。④実測法は、探査装置で測った値と実際の寸法（真値）を比べて比誘電率を求める方法です。専用の誘電率測定装置を使う方法ではありません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「双曲線＝カーブフィッティング」「径の差＝鉄筋径法」「実際に測る＝実測法」。</div>","own":false,"extra":""},{"id":"c4-1","ch":"c4","n":1,"stem":"次の文は、電磁誘導法の特徴について述べたものである。正しいものを一つ選べ。","choices":["誘電率の影響を受けない。","かぶり厚さが大きいほど鉄筋の検出は容易である。","鉄筋間隔が狭いほど、鉄筋を個別に判別するのは容易である。","コンクリート表面にある金属パネルは取り除く必要がない。"],"type":"right","ans":0,"page":"p.100 4.5.2","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①が正しい。電磁誘導法は、誘電率の影響を受けません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>コイルに交流を流して磁界をつくると、鉄筋に渦電流が流れ、鉄筋が磁化されます。その反応でコイルの信号が変わるのを読み取ります。使うのは、鉄筋とコンクリートの「導電率」と「透磁率」の差です。誘電率はレーダ法で使う性質です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②かぶりが大きいほど信号は弱くなり、検出しにくくなります。③間隔が狭いと、隣の鉄筋と区別しにくくなります。④表面の金属パネルは強く反応するので、取り除く必要があります。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「電磁誘導＝磁気と電気（透磁率・導電率）。誘電率はレーダ」。</div>","own":false,"extra":""},{"id":"c4-2","ch":"c4","n":2,"stem":"電磁誘導法の測定に影響を与えない次の要素のうち、誤っているものを一つ選べ。","choices":["コンクリートの水分","コンクリート表面の鉄分を含まない塗装","コンクリート内の空隙","コンクリート内の鉄筋"],"type":"wrong","ans":3,"page":"p.90 4.1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④の「鉄筋」が、測定に影響を与えるものです（問題は影響を与えないものを選ぶ形）。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>電磁誘導法は、電気を通す・磁石に反応する物に反応します。水分・鉄分を含まない塗装・空隙は、電気的にも磁気的にもコンクリートとほぼ同じなので、影響しません。鉄筋は、まさに検出する対象なので、測定に影響します。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①水分、②鉄分を含まない塗装、③空隙は、影響を与えません（鉄分を含む塗装は影響するので注意）。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「電磁誘導は水に強い。レーダは水に弱い」。</div>","own":false,"extra":""},{"id":"c4-3","ch":"c4","n":3,"stem":"電磁誘導法の特徴に関する次の記述のうち、正しいものを一つ選べ。","choices":["鉄筋の位置を反射波の時間的変化で確認する。","比較的深いかぶり厚さ測定に適する。","電磁波レーダ法と比較して浅いかぶり厚さ測定に適している。","鉄筋とコンクリートの定着状態の確認ができる。"],"type":"right","ans":2,"page":"p.59, p.118","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。電磁誘導法は、電磁波レーダ法に比べて、浅いかぶりの測定に向いています。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>測れる深さの目安は、電磁誘導法が約10〜80mm、電磁波レーダ法は数十〜数千mmです。電磁誘導法は浅い所を精度よく測るのが得意です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①反射波の時間で位置を見るのは電磁波レーダ法です。②深いかぶりは電磁波レーダ法が向いています。④鉄筋とコンクリートの定着（付着）状態は、どちらの方法でも確認できません。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「浅く正確＝電磁誘導、深く広く＝レーダ」。</div>","own":false,"extra":""},{"id":"c4-4","ch":"c4","n":4,"stem":"次の文は、NDTS 4101「コンクリート中の配筋探査に使用する装置についての規格」に記載されている電磁誘導法に使用する試験装置の点検について述べたものである。正しいものを一つ選べ。","choices":["定期点検は、1 日の中で複数回定期的に行う。","日常点検には、始業前点検、及び終業時点検の 2 つで構成されている。","日常点検では、各メーカ推奨のテストブロック、または試験体（TB-E1）を使用する。","かぶり厚さ精度を点検するには、かぶり厚さ 20 mm 以下と 100 mm 以上の 2 箇所を測定する。"],"type":"right","ans":2,"page":"p.99 4.4","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③が正しい。日常点検では、メーカー推奨のテストブロック、または試験体（TB-E1）を使います。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>点検の区分：<br>・定期点検：年1回、メーカーなどで総合点検・校正<br>・日常点検：始業前・作業中・終業時<br>かぶり精度の点検は「20mm以下」と「50mm以上100mm未満」の2か所で行います。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①定期点検は年1回です（1日に複数回ではない）。②日常点検には作業中も含みます。④2か所目は「100mm以上」ではなく「50mm以上100mm未満」です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「定期＝年1回、日常＝前・中・後」。</div>","own":false,"extra":""},{"id":"c4-5","ch":"c4","n":5,"stem":"電磁誘導法で次の探査対象のうち、探査できないものを一つ選べ。","choices":["塩化ビニル管","異形鉄筋","鉄製電配管","銅管"],"type":"wrong","ans":0,"page":"p.90 4.1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>①の「塩化ビニル管」が、電磁誘導法では探査できません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>塩化ビニルは電気を通さず、磁石にも反応しません。電気的にも磁気的にもコンクリートとの差が小さいので、検出できません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>②異形鉄筋・③鉄製電配管（電気を通し磁性もある）、④銅管（磁性はないが電気を通すので渦電流が流れる）は探査できます。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「金属なら見える、樹脂は見えない」。</div>","own":false,"extra":""},{"id":"c4-6","ch":"c4","n":6,"stem":"次の用語のうち、電磁誘導法に関連のないものを一つ選べ。","choices":["透磁率","導電率","抵抗率","誘電率"],"type":"wrong","ans":3,"page":"p.90 4.1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④の「誘電率」が、電磁誘導法に関連のない用語です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>電磁誘導法で使うのは、透磁率（磁気の通しやすさ）と導電率（電気の通しやすさ）です。抵抗率は導電率の逆数なので関連があります。誘電率は電磁波レーダ法の用語です。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①透磁率、②導電率、③抵抗率は、電磁誘導法に関連します。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「誘電率が出てきたらレーダ」。</div>","own":false,"extra":""},{"id":"c4-7","ch":"c4","n":7,"stem":"次の作業場所のうち、電磁誘導法の測定に最も影響を及ぼすものを一つ選べ。","choices":["塗装がされているコンクリート","ボックスカルバート内","高圧電線に近接する場所","水分を含んでいるコンクリート"],"type":"other","ans":2,"page":"p.99, 4.5","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>③の「高圧電線に近接する場所」が、最も影響を及ぼします。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>電磁誘導法は、コイルの磁界の変化を読み取ります。高圧電線は周囲に強い磁界をつくるので、ノイズとなって測定を乱します。測定前に、周囲に強い磁界の発生源がないことを確認します。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①塗装（鉄分を含まないもの）、②ボックスカルバートの中、④水分を含んだコンクリートは、電磁誘導法への影響は小さいです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「電磁誘導の敵は、外からの強い磁界と、近くの金属」。</div>","own":false,"extra":""},{"id":"c4-8","ch":"c4","n":8,"stem":"電磁誘導法による鉄筋探査に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋が近接または密着している場合は、1 本の鉄筋として検出される場合が多い。","かぶり厚さとはコンクリート表面から鉄筋の頂点までの最短距離を示す。","ダブル配筋において手前側とその奥側の鉄筋の間隔が離れている場合は、手前側の鉄筋のみ検出できる。","ジャンカを確認することができる。"],"type":"wrong","ans":3,"page":"p.90 4.1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が誤り。電磁誘導法では、ジャンカ（空洞）は確認できません。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>ジャンカは空気のすき間で、電気も磁気も通しません。コンクリートとの差がほとんど出ないので、検出できません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①近接・密着した鉄筋は1本に見えることが多い、②かぶりの定義、③ダブル配筋で奥の鉄筋が離れていると、手前だけ検出される。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「電磁誘導で見えるのは金属だけ」。</div>","own":false,"extra":""},{"id":"c4-9","ch":"c4","n":9,"stem":"渦電流の特徴に関する次の記述のうち、誤っているものを一つ選べ。","choices":["導体表面の渦電流強度は、周波数が高くなるほど大きくなる。","渦電流の表皮厚は周波数が高くなるほど厚くなる。","渦電流の表皮厚は透磁率と導電率が大きいほど薄くなる。","励磁電流が大きくなると磁束が大きくなるので、渦電流強度も大きくなる。"],"type":"wrong","ans":1,"page":"p.94 式4.2-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。表皮厚（渦電流が流れる深さ）は、周波数が高いほど「薄く」なります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>表皮厚 δ ＝ 1 ÷ √(π × f × μ × σ)（f：周波数、μ：透磁率、σ：導電率）。周波数・透磁率・導電率が大きいほど、渦電流は表面の薄い層に集中します。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①周波数が高いほど表面の渦電流は強い、③透磁率・導電率が大きいほど表皮厚は薄い、④励磁電流が大きいほど渦電流も強い。どれも正しい記述です。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「周波数を上げると、渦電流は表面に集まる（薄くなる）」。</div>","own":false,"extra":""},{"id":"c4-10","ch":"c4","n":10,"stem":"透磁率に関する次の記述のうち、正しいものを一つ選べ。","choices":["電磁誘導法探査装置は鉄筋の透磁率を定量的に測定できる。","鉄筋の透磁率は真空の透磁率の約 0.8 倍である。","コンクリートの透磁率は真空の透磁率の約 100 倍である。","透磁率と磁界の積が磁束密度となる。"],"type":"right","ans":3,"page":"p.90 式4.1-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>④が正しい。磁束密度 B ＝ 透磁率 μ × 磁界の強さ H です。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>透磁率は「磁気の通しやすさ」です。同じ磁界でも、透磁率が大きい物ほど磁束が多く通ります。鉄筋は透磁率が大きいので、磁界を引き寄せます。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①透磁率を定量的に測れる探査装置は、今のところありません。②鉄筋の透磁率は真空の数百倍です（0.8倍ではない）。③コンクリートはほぼ1倍です（100倍ではない）。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「B＝μH。鉄は数百倍、コンクリートはほぼ1」。</div>","own":false,"extra":""},{"id":"c4-11","ch":"c4","n":11,"stem":"電流 I と磁界 H または磁束 φ の関係のうち、誤っているものを一つ選べ。","choices":["図①","図②","図③","図④"],"type":"wrong","ans":1,"page":"p.91 図4.1-1","exp":"<div class=\"xp\"><b class=\"xh\">✅ 結論</b>②が誤り。電流と磁界の向きは、アンペアの右ねじの法則で決まります。</div><div class=\"xp\"><b class=\"xh\">🔍 なぜ？</b>右ねじを電流の向きに進めると、ねじが回る向きに磁界ができます。右手の親指を電流の向きに立てて握ったとき、残りの指が巻く向きが磁界の向きです。各図をこの法則に当てはめると、②だけが合いません。</div><div class=\"xp\"><b class=\"xh\">📝 ほかの選択肢</b>①③④は、右ねじの法則どおりの向きです。</div><div class=\"xp\"><b class=\"xh\">💡 覚え方</b>「右手の親指＝電流、握った指＝磁界」。</div>","own":false,"extra":"<img class=\"fig\" alt=\"電流と磁界の図\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/wAALCACcAoABAREA/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0
