<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配筋探査マスターへの道</title>
<style>
:root{--bg:#fff7ea;--bg2:#ffe9c7;--card:#fff;--ink:#1c2340;--sub:#6b7391;--line:#f0e2c8;--acc:#ff7a1a;--acc2:#1c2f6b;--gold:#ffc42e;--ok:#17a65a;--okbg:#dcf8e6;--ng:#e5484d;--ngbg:#ffe3e3;--shadow:0 4px 0 rgba(28,35,64,.10),0 8px 18px rgba(28,35,64,.08);--c1:#ef4b5f;--c2:#2f7de1;--c3:#f2a900;--c4:#22b573}
@media (prefers-color-scheme:dark){:root{--bg:#0f1530;--bg2:#161d40;--card:#1b2350;--ink:#f4f6ff;--sub:#a3acd0;--line:#2b3566;--acc:#ff8a3a;--acc2:#8fb0ff;--gold:#ffd24d;--okbg:#103a27;--ngbg:#43202a;--shadow:0 4px 0 rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,var(--bg2),var(--bg));color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7;font-size:16px;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:12px 14px 44px}
button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
.hero{background:linear-gradient(135deg,#ff7a1a 0%,#ff4d6d 55%,#7b3fe4 120%);color:#fff;border-radius:22px;padding:16px 16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-100%);animation:shine 4s infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.hero h1{margin:0;font-size:22px;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.hero .tag{font-size:12px;opacity:.95;font-weight:700}
.hero:after{content:"🏆";position:absolute;right:12px;top:6px;font-size:56px;opacity:.28;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.lv{display:flex;align-items:center;gap:10px;margin-top:12px}
.badge{background:#fff;color:#c4380a;font-weight:800;border-radius:999px;padding:3px 12px;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.xpbar{flex:1;height:16px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#ffc42e);border-radius:99px;transition:width .6s;box-shadow:0 0 10px #ffe066}
.exam{margin-top:12px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600}
.exam b{font-size:17px;color:#fff3b0}
.goal{height:10px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;margin-top:6px}
.goal i{display:block;height:100%;background:linear-gradient(90deg,#8cff9e,#2fe27a);border-radius:99px;transition:width .5s}
.cheer{margin-top:8px;font-size:14px;font-weight:700}
.stats{display:flex;gap:6px;margin-top:10px;font-size:12.5px;flex-wrap:wrap}
.stats span{background:rgba(0,0,0,.22);border-radius:10px;padding:2px 9px;font-weight:600}
h2{font-size:17px;margin:24px 2px 10px;color:var(--ink);display:flex;align-items:center;gap:6px}
h2:after{content:"";flex:1;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--acc),transparent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left;border:0;min-height:92px;color:#fff;position:relative;overflow:hidden;transition:transform .12s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.mode b{display:block;font-size:16px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.mode small{opacity:.95;font-size:12px;line-height:1.4;display:block;margin-top:2px}
.mode[data-m=quota]{background:linear-gradient(135deg,#ff7a1a,#ffb02e);min-height:84px}
.mode[data-m=mix]{background:linear-gradient(135deg,#2f7de1,#5a5cf0)}
.mode[data-m=surv]{background:linear-gradient(135deg,#ef4b5f,#ff7a59)}
.mode[data-m=wrong]{background:linear-gradient(135deg,#22b573,#2dcf9a)}
.mode[data-m=err]{background:linear-gradient(135deg,#7b3fe4,#b04ff0)}
.mode.wide{grid-column:1/-1}
.mode:disabled{filter:grayscale(.85);opacity:.55;cursor:default}
.chaps{display:grid;gap:12px}
.chap{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:2px solid transparent;transition:transform .12s}
.chap:hover{transform:translateY(-2px);border-color:var(--acc)}
.chap .top{display:flex;align-items:center;gap:12px}
.chap .ic{font-size:30px;background:var(--bg2);border-radius:14px;width:52px;height:52px;display:grid;place-items:center}
.chap .tt{flex:1}
.chap .tt b{display:block;line-height:1.35}
.chap .tt small{color:var(--sub)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22b573,#7be495);border-radius:99px}
.row{display:flex;gap:8px}
.btn{background:var(--acc2);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--card);color:var(--acc2);border:2px solid var(--acc2);box-shadow:0 3px 0 rgba(28,47,107,.25)}
.btn.sm{padding:4px 12px;min-height:38px;font-size:14px}
.btn.big{width:100%;font-size:18px;min-height:56px;background:linear-gradient(135deg,#ff7a1a,#ffb02e);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.2);box-shadow:0 5px 0 #c4570a}
.btn:disabled{opacity:.5}
.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top-bar .grow{flex:1}
.prog{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2f7de1,#22b573);transition:width .3s;border-radius:99px}
.hearts{font-size:18px;letter-spacing:2px}
.qcard{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub);font-weight:600}
.tg{border-radius:999px;padding:2px 12px;font-weight:800;font-size:12.5px}
.tg.wrong{background:var(--ngbg);color:var(--ng)}.tg.right{background:var(--okbg);color:var(--ok)}.tg.other{background:#fff0c2;color:#8a5a00}
.stem{font-weight:800;font-size:17px;margin:10px 0}
.choices{display:grid;gap:10px;margin-top:12px}
.ch{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:54px;transition:transform .08s;box-shadow:0 3px 0 var(--line)}
.ch:active{transform:translateY(2px);box-shadow:none}
.ch .no{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ch:nth-child(1) .no{background:var(--c1)}.ch:nth-child(2) .no{background:var(--c2)}.ch:nth-child(3) .no{background:var(--c3)}.ch:nth-child(4) .no{background:var(--c4)}
.ch.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.ch.ng{background:var(--ngbg);border-color:var(--ng);animation:shake .35s;box-shadow:0 3px 0 var(--ng)}
.ch.dim{opacity:.5}
.ch:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:14px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:17px;animation:pop .35s}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.ng{background:var(--ngbg);color:var(--ng)}
.exp{margin-top:10px;background:var(--bg);border-left:6px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:15px}
.exp .ref{font-size:13px;color:var(--sub);margin-bottom:4px;font-weight:700}
.own{display:inline-block;background:#e6edff;color:#2a4a9a;border-radius:6px;padding:0 8px;font-size:12px;margin-bottom:4px}
.t{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.t th,.t td{border:1px solid var(--line);padding:3px 6px;text-align:center}
.t th{background:var(--line)}
.fig{max-width:100%;background:#fff;border-radius:10px;margin:6px 0}
.note{font-size:14px;margin:6px 0;color:var(--sub)}
.res{text-align:center}
.res .stars{font-size:44px;letter-spacing:6px;animation:pop .5s}
.res .score{font-size:50px;font-weight:900;background:linear-gradient(135deg,#ff7a1a,#ef4b5f);-webkit-background-clip:text;background-clip:text;color:transparent}
.res ul{text-align:left;padding-left:0;list-style:none}
.res li{padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px}
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:linear-gradient(135deg,#ffd24d,#ff9f1a);color:#4a2500;font-weight:900;font-size:18px;padding:8px 20px;border-radius:999px;z-index:50;animation:up 1.1s forwards;pointer-events:none;box-shadow:var(--shadow)}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-44px)}}
.cf{position:fixed;top:-20px;font-size:24px;z-index:40;pointer-events:none;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.6}}
.foot{margin-top:26px;font-size:12px;color:var(--sub);text-align:center}
.link{background:none;color:var(--sub);text-decoration:underline;font-size:12px;padding:6px}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.term{border-bottom:2px dotted currentColor;color:inherit;font-weight:800;cursor:pointer}
#tip{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,560px);background:var(--card);color:var(--ink);border:3px solid var(--acc);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);z-index:60;font-size:15px;line-height:1.7}
#tip small{display:block;color:var(--sub);margin-top:6px}
.chap .row .btn.sm{white-space:nowrap;padding:8px 6px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA={"chapters":[{"key":"c1","label":"序論","icon":"🔍","title":"配筋状態と非破壊試験の基本"},{"key":"c2","label":"第2章","icon":"🧱","title":"コンクリート構造物の基礎知識"},{"key":"cr","label":"参考資料","icon":"📏","title":"鉄筋測定要領（H30.10）"},{"key":"c3","label":"第3章","icon":"📡","title":"電磁波レーダ法"},{"key":"c4","label":"第4章","icon":"🧲","title":"電磁誘導法"},{"key":"c5","label":"第5章","icon":"📐","title":"JASS5 かぶり厚さの検査"},{"key":"c6","label":"第6章","icon":"📝","title":"報告"},{"key":"c7","label":"第7章","icon":"⛑️","title":"安全・点検"}],"qs":[{"id":"c1-1","ch":"c1","n":1,"stem":"コンクリート及び配筋状態の基準・規格に関する次の記述のうち、誤っているものを一つ選べ。","choices":["土木構造物の場合は、土木学会のコンクリート標準示方書がある。","道路橋の場合は、道路橋示方書など構造物の管理者ごとに基準が設けられている。","建築物の場合は、日本建築学会の建築工事標準仕様書・同解説 JASS5 鉄筋コンクリート工事がある。","配筋に関しては JIS A 5308 レディーミクストコンクリートがある。"],"type":"wrong","ans":3,"page":"p.1","exp":"配筋に関する基準は「鉄筋コンクリート造配筋指針・同解説」。JIS A 5308 は生コン（レディーミクストコンクリート）の規格で、配筋の基準ではありません。","own":false,"extra":""},{"id":"c1-2","ch":"c1","n":2,"stem":"配筋状態の非破壊試験に関する規格のうち、誤っているものを一つ選べ。","choices":["NDIS 1401　コンクリート構造物の放射線透過試験方法","NDIS 3436　コンクリートの非破壊試験－表層透気試験方法","NDIS 3429　コンクリートの非破壊試験－鉄筋平面位置及びかぶり厚さの電磁波レーダ試験方法","NDIS 3430　電磁誘導法によるコンクリート構造物中の鉄筋探査方法"],"type":"wrong","ans":1,"page":"p.5","exp":"NDIS 3436 はコンクリート表層部の気体の移動抵抗性（表層透気）を調べる規格で、配筋状態の試験規格ではありません。","own":false,"extra":""},{"id":"c1-3","ch":"c1","n":3,"stem":"（一社）日本非破壊検査工業会の配筋試験技術者に関する資格のうち、誤っているものを一つ選べ。","choices":["コンクリート構造物の配筋探査技術者資格（土木・電磁波レーダ法）","コンクリート構造物の配筋探査技術者資格（土木・電磁誘導法）","コンクリート構造物の配筋探査技術者資格（土木・放射線透過法）","コンクリート構造物の配筋探査技術者資格（建築）"],"type":"wrong","ans":2,"page":"p.7","exp":"放射線透過法の配筋探査技術者資格はありません（資格は電磁波レーダ法・電磁誘導法・建築）。","own":false,"extra":""},{"id":"c1-4","ch":"c1","n":4,"stem":"国交省要領、JASS 5 T-608は、JIS Z 2305（非破壊試験技術者の資格及び認証）に規定されているわけではないが、配筋試験技術者に求められている要件を、JIS Z 2305に規定されているレベル相当に対応させた場合、次の記述のうち正しいものを一つ選べ。","choices":["文書化された判定基準に従った NDT 結果の記録及び分類を行うレベル 1 相当までは求められていない。","測定の実施、結果の記録、報告などを行うレベル 1 相当のみ満足すればよい。","レベル 1 相当の技術を保持していることはもちろんであるが、十分な訓練と経験を積み重ね、NDT 方法の適用限界の判断などを行うレベル 2 相当を維持することが求められている。","NDT 設備と職員についての管理及び責任を持つレベル 3 相当まで求められている。"],"type":"right","ans":2,"page":"p.8〜9","exp":"JIS Z 2305 のレベルに対応させると、レベル1相当に加えてレベル2相当（適用限界の判断など）が求められています。","own":false,"extra":""},{"id":"c2-1","ch":"c2","n":1,"stem":"鉄筋コンクリート構造物が多く用いられる理由に関する次の記述のうち、誤っているものを一つ選べ。","choices":["圧縮応力を主としてコンクリートが分担し、引張応力を主として鉄筋が分担している。","鉄筋の破断に至るまでの変形量が大きいこと。","材料が比較的安価であること。","コンクリートの熱伝導率は大きく熱の遮断が行われないため、火災時に耐力低下の予防効果、特に鉄筋の熱劣化を防止できない。"],"type":"wrong","ans":3,"page":"p.11〜12","exp":"RC構造の特徴：①熱膨張率がほぼ同じ ②付着が良い ③鉄筋は破断まで変形量が大きい ④アルカリで鉄筋を防食 ⑤熱伝導率が小さく火災時に鉄筋の熱劣化を防げる ⑥比較的安価。<br>コンクリートの熱伝導率は約1.6 W/m・K、鋼材は45 W/m・K。コンクリートは熱を遮断できるので、④の「熱の遮断が行われない」は不適当です。","own":false,"extra":""},{"id":"c2-2","ch":"c2","n":2,"stem":"鉄筋コンクリート構造物が成立する条件に関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリート中の鉄筋がコンクリートのアルカリ性で保護されて、腐食しないこと。","火災時において、コンクリートが鉄筋の耐火被覆材となり、鉄筋を保護すること。","コンクリートと鉄筋がしっかり付着し、一体となって変形に抵抗すること。","鉄筋の変形がコンクリートに力を及ぼさないように、鉄筋の熱膨張率がコンクリートのそれよりも著しく小さいこと。"],"type":"wrong","ans":3,"page":"p.11〜12","exp":"コンクリートの熱膨張係数は約10×10⁻⁶/℃で、鉄筋とほぼ同じ。だから温度変化でも内部応力がほとんど出ません。「著しく小さい」は誤り。","own":false,"extra":""},{"id":"c2-3","ch":"c2","n":3,"stem":"コンクリート構造物の特徴に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋コンクリートは良好な施工がされていれば耐久性に優れた構造物である。","鉄筋コンクリートは、引張鉄筋、折曲げ鉄筋、スターラップ筋や圧縮鉄筋などをバランスよく配置し、上手に構造計画を行うことにより、じん性に富んだ構造とすることができる。","コンクリートは、熱伝導率が小さいためかぶり厚さが規定値を確保してあれば、内部の温度上昇を防ぎ鉄筋の高温による耐力低下を防ぐことができる。このため火災によって鉄筋コンクリート造の建物が倒壊することはほとんどなく、耐火性は優れている。","コンクリートは、セメント、水と骨材を練り混ぜた段階（フレッシュコンクリート）では流動性が悪く建築物の形を自由に形成することができない。そのため鉄筋コンクリート構造では、ラーメン構造やシェル構造、アーチ構造として使用できない。"],"type":"wrong","ans":3,"page":"p.12","exp":"フレッシュコンクリートは流動性の高い液状なので自由に形をつくれます。ラーメン・シェル・アーチなど各種の構造を選べるので、④は誤り。","own":false,"extra":""},{"id":"c2-4","ch":"c2","n":4,"stem":"構造材料としてのコンクリートに期待できない性能を次の中から一つ選べ。","choices":["圧縮強度","耐久性","施工性","引張強度"],"type":"wrong","ans":3,"page":"p.11","exp":"圧縮強度は高いが、引張強度・せん断強度は圧縮に比べて非常に小さい。耐久性・施工性は優れています。期待できないのは「引張強度」。","own":false,"extra":""},{"id":"c2-5","ch":"c2","n":5,"stem":"鉄筋コンクリートの耐震性に関する次の記述のうち、正しいものを一つ選べ。","choices":["比強度が大きいので耐震性が必要な建物には最適である。","比強度が小さいので耐震性が必要な建物には最適である。","比強度が大きいので耐震性のある建物をつくるには設計を工夫する必要がある。","比強度が小さいので耐震性のある建物をつくるには設計を工夫する必要がある。"],"type":"right","ans":3,"page":"p.12","exp":"比強度が小さく部材が重くなるため、耐震では不利になりがち。でも鉄筋をバランスよく配置し構造計画を工夫すれば、じん性に富む構造にできます。","own":false,"extra":""},{"id":"c2-6","ch":"c2","n":6,"stem":"構造物の構造形式に関する次の記述のうち、誤っているものを一つ選べ。","choices":["柱と梁を一体として構成した骨組み構造はラーメン構造という。","アーチ構造は半円状に曲げた梁を使用しており、梁にかかる荷重が主として材軸方向の圧縮力として支えることが出来るので、曲げモーメントが生じない構造となっている。","柱や梁を用いず、壁と床によって構成される構造は箱桁構造である。","屋根面などの面上部分を曲面にすることにより、鉛直荷重を屋根面に沿って作用する圧縮応力によって支える構造はシェル構造である。"],"type":"wrong","ans":2,"page":"p.12〜13","exp":"柱や梁を使わず壁やスラブで構成する構造は「壁式構造」（ボックスカルバートや擁壁など）。箱桁構造は誤り。壁式は5階建て以下の共同住宅などで、柱のない広い空間と耐震性を両立できます。","own":false,"extra":""},{"id":"c2-7","ch":"c2","n":7,"stem":"構造機能の面から分類したコンクリート構造物の特性に関する次の記述のうち、誤っているものを一つ選べ。","choices":["無筋コンクリート構造は、引張応力が発生しない場合、あるいは、ひび割れの発生が直接破壊につながらない場合に用いられる。","鉄筋コンクリート(RC)構造は、鉄筋で補強された構造で、ひび割れを許容しているが、鉄筋がひび割れの分散やひび割れ幅の制御の機能を有する。","プレストレストコンクリート(PC)構造は、主にPC鋼材で補強された構造で、プレストレスを導入するため、ひび割れの発生を許容している。","鉄骨鉄筋コンクリート(SRC)構造は、RC構造の断面に鉄骨を埋め込んだ構造であり、構造機能としてはRC構造に似ているが、比較的規模が大きく、施工の合理化を要求する部材に適用される。"],"type":"wrong","ans":2,"page":"p.13〜15","exp":"PC構造は、部材にあらかじめ圧縮応力（プレストレス）を入れておき、引張が働いても差し引き0か圧縮が残るようにして、引張ひび割れを生じさせない構造。「ひび割れの発生を許容」は誤り。","own":false,"extra":""},{"id":"c2-8","ch":"c2","n":8,"stem":"コンクリートの圧縮強度に関する次の記述のうち、正しいものを一つ選べ。","choices":["水セメント比が小さいほど強度は小さくなる。","養生時の温度が高くなるほど材齢 28 日の強度は大きくなるが、その後の強度増加量は小さい。","粗骨材の最大寸法が大きくなるほど強度は大きくなる傾向にある。","施工上、空気量は 3～6％が適切と言われているが、それより空気量が増えても強度は低下することはない。"],"type":"right","ans":1,"page":"p.34","exp":"①W/Cが小さいほど強度は高い ②養生温度が高いほど28日強度は大きいが長期の伸びは乏しい（正） ③粗骨材の最大寸法が大きいほど強度は小さい ④空気量が1%増えると強度は4〜6%低下。","own":false,"extra":""},{"id":"c2-9","ch":"c2","n":9,"stem":"コンクリートの材料に関する次の記述のうち、誤っているものを一つ選べ。","choices":["骨材は、コンクリート材料の中で容積を最も多く占めるもので、いわゆる砂利、砂の類が用いられる。","粗骨材は、骨材のうち概して 5 mm ふるいにとどまるものを指す。最大寸法はコンクリートの使用目的により制限され、一般に、土木では 40 mm、25 mm、20 mm、建築で 25 mm、20 mm が多く用いられる。川砂利、山砂利、礫砂などの種類がある。","混和材料は、コンクリートの品質向上、性状改善のために用いられ、セメント、水、骨材以外の材料の総称である。","混和材とは、コンクリート中での容積が無視できる混和材料のことで、一般に有機質の水溶液で用いられ、その水分は練混ぜ水の一部として加算する。AE剤、AE減水剤、高性能AE減水剤などがある。"],"type":"wrong","ans":3,"page":"p.32〜33","exp":"④は「混和剤」の説明。混和材は容積が無視できない混和材料で、粉体で用いられ、フライアッシュ・スラグ粉末・収縮低減材などがあります。","own":false,"extra":""},{"id":"c2-10","ch":"c2","n":10,"stem":"セメントに関する次の記述のうち、誤っているものを一つ選べ。","choices":["普通ポルトランドセメントは一般の工事用として最も広く使用されており、日本のセメント使用量の約 70% をしめる。","早強ポルトランドセメントは水和反応が早く、強度発現も早いので早期に所要の強度が必要なときに使用される。寒中コンクリートやプレストレストコンクリート工事などに使用される。","中庸熱ポルトランドは水和反応の速度を遅くして反応中の発熱を抑えたセメントで設計強度が 60N/mm<sup>2</sup> を超えるようなセメント使用量の多いコンクリートや部材断面の大きいマスコンクリート、気温が高くて水和反応が進みすぎる暑中のコンクリート工事などに使用される。","混合セメントはポルトランドセメントに混和材を混合したもので、フライアッシュを混合したフライアッシュセメントや高炉スラグを混合した高炉セメントなどがあり、混合割合で A、B、C、D、E、F 種の6種に区分される。"],"type":"wrong","ans":3,"page":"p.31〜32","exp":"混合セメントはA種・B種・C種の「3種」に区分されます（6種は誤り）。","own":false,"extra":""},{"id":"c2-11","ch":"c2","n":11,"stem":"混和材料に関する次の記述のうち誤っているものを一つ選べ。","choices":["混和剤はコンクリート中の容積が無視できる材料をいう。","混和剤としてはフライアッシュとシリカフュームが一般的である。","混和材はコンクリートの収縮低減の目的で用いられる場合もある。","混和材はコンクリートの流動性を大きくする目的では石灰石微粉末が用いられる。"],"type":"wrong","ans":1,"page":"p.32〜33","exp":"混和材＝フライアッシュ・高炉スラグ微粉末が一般的（膨張材・石灰石微粉末・シリカフュームも）。混和剤＝AE剤・AE減水剤・高性能AE減水剤が一般的。②は混和材と混和剤が逆です。","own":false,"extra":""},{"id":"c2-12","ch":"c2","n":12,"stem":"クリープに関する次の記述のうち、正しいものを一つ選べ。","choices":["コンクリートは長い間に炭酸ガスと反応して、本来のコンクリートの性質とは異なるものに変化する現象。","コンクリートは外力を加えても、弾性的な性質を殆ど示さない性質。","融雪剤や凍結防止剤に含まれている塩化物イオンによってコンクリートの中の鉄筋が腐食する性質。","一定の圧縮力を長期間コンクリートに作用させると、時間の経過とともに歪が次第に増大する性質。"],"type":"right","ans":3,"page":"p.35","exp":"クリープ＝一定の荷重を長期間かけると、時間とともにひずみが次第に増える現象。","own":false,"extra":""},{"id":"c2-13","ch":"c2","n":13,"stem":"ジャンカ（豆板）に関する次の記述のうち、誤っているものを一つ選べ。","choices":["ジャンカ（豆板）はコンクリートの打込み時の落下高さが大きくなると発生しやすいので、打込み時にはコンクリートの落下高さを抑える必要がある。","打ち込まれたコンクリートの一部に粗骨材が多く集まってきた空隙の多い不良部分をジャンカ（豆板）という。","柱に発生したジャンカ（豆板）の原因として、コンクリートの過密鉄筋による影響が大きい場合もある。","ジャンカ（豆板）が発生すると、中性化が鉄筋位置まで到達する時間が長くなることが多い。"],"type":"wrong","ans":3,"page":"p.36","exp":"豆板（ジャンカ）は材料分離・締固め不足・型枠下端からのペースト漏れなどで発生。落下高さ4m超で出やすく、3mでも注意。空隙が多いため、むしろ中性化は速く進みます。","own":false,"extra":""},{"id":"c2-14","ch":"c2","n":14,"stem":"コンクリート中の鉄筋腐食に関する次の記述のうち、正しいものを一つ選べ。","choices":["コンクリート中の鉄筋は、環境条件に関わらず塩化物イオンの量に比例して腐食速度は大きくなる。","コンクリート中の鉄筋は、塩化物イオンの量に関わらず酸素の量に比例して腐食速度は大きくなる。","コンクリート中の鉄筋は、酸素と水の存在がなければ、腐食速度に塩化物イオンの量の影響を受けない。","コンクリート中の鉄筋は、かぶりコンクリートの品質に関わらず、塩化物イオンが侵入すると、その量に応じて腐食速度が決定される。"],"type":"right","ans":2,"page":"p.35〜36","exp":"塩化物イオンが一定量を超えると不動態被膜が壊れます。ただし腐食には酸素と水が必要で、それが無ければ塩化物イオンの量の影響は受けません。③が正しい。","own":false,"extra":""},{"id":"c2-15","ch":"c2","n":15,"stem":"コンクリート構造物のひび割れに関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリート構造物の側面の配筋に沿ったひび割れは、鉄筋の腐食膨張による原因の可能性が高い。","初期に発生したと見られるひび割れを放置すれば、ひび割れから劣化因子が侵入し、コンクリート中の鉄筋の腐食はさらに速まる。","鉄筋のかぶり厚さが大きいと、鉄筋付近の塩化物イオン含有量が多くても、中性化が遅くなるため、鉄筋は腐食しない。","さび汁が見られなくても、塩害によるひび割れが生じている場合がある。"],"type":"wrong","ans":2,"page":"p.36","exp":"塩化物イオンが多ければ塩害が起き、鉄筋が腐食する可能性が高まります。塩害は中性化とは別の劣化（複合する場合はある）。③は誤り。","own":false,"extra":""},{"id":"c2-16","ch":"c2","n":16,"stem":"コールドジョイントに関する次の記述のうち、誤っているものを一つ選べ。","choices":["コールドジョイントは打ち重ねまでの気温が高いほど発生しやすく、この面のコンクリートの曲げ強度は低下する。","ブリーディングが多いコンクリートほど、打ち重ね時間間隔に関わらずコールドジョイントは発生しにくい。","コールドジョイントが生じると、この面が脆弱となるため、構造物の耐力、耐久性、水密性を低下させる原因となる。","コンクリートを打ち重ねていくとき、前に打設したコンクリートに凝結が始まっていると連続性が失われ、コールドジョイントが発生しやすくなる。"],"type":"wrong","ans":1,"page":"p.36","exp":"コールドジョイント＝打重ね間隔をあけ過ぎて、前のコンクリートと一体化しない不連続な面。ブリーディングは別の現象で、ブリーディングが多いから発生しにくい、とは言えません。","own":false,"extra":""},{"id":"c2-17","ch":"c2","n":17,"stem":"コンクリート構造物内の鉄筋腐食の原因に関する次の記述のうち、正しいものを一つ選べ。","choices":["コンクリートは強アルカリ性であることから、鉄筋表面に不動態皮膜が形成され、鉄筋の腐食を防ぐ性質がある。","コンクリートの中性化により鉄筋の不動態皮膜が破壊されるので、水分や酸素が無くても鉄筋は錆びる。","塩害は海岸付近で多くみられ、山間部、凍結地域にはこの被害は無い。","中性化はコンクリート表面から進行していくため、この中性化深さが鉄筋位置に達するまでは鉄筋腐食が始まらない。"],"type":"right","ans":0,"page":"p.35","exp":"②水と酸素が無ければ錆びません ③山間部・凍結地域でも凍結防止剤の塩化物イオンで塩害が起きます ④腐食開始の目安は中性化残り10mm（コンクリート標準示方書 維持管理編）。","own":false,"extra":""},{"id":"c2-18","ch":"c2","n":18,"stem":"鉄筋コンクリートの中性化に関する次の記述のうち、正しいものを一つ選べ。","choices":["水中のコンクリートよりも、乾湿の影響を受けるコンクリートのほうが、中性化の進行は遅い。","水セメント比の小さいコンクリートは、水セメント比の大きいコンクリートよりも中性化の進行は遅い。","普通ポルトランドセメントよりも混合セメントを用いたほうが、同一水セメント比であれば中性化の進行は遅い。","温度が高いほうが、温度が低いときよりも中性化の進行は遅い。"],"type":"right","ans":1,"page":"p.35","exp":"中性化しやすいのは、水セメント比が大きい／豆板など施工欠陥がある／相対湿度50〜60%／屋内（屋外より進む）。水セメント比が小さいほど進行は遅い。","own":false,"extra":""},{"id":"c2-19","ch":"c2","n":19,"stem":"コンクリートの中性化に関する次の記述のうち、正しいものを一つ選べ。","choices":["中性化深さが鉄筋位置までに到達した場合、一般的に、鉄筋の腐食は屋外より屋内の方が激しい。","中性化による劣化度の評価は、中性化深さと鉄筋のかぶり厚さとの関係についてのみ行う。","大気中の炭酸ガスによるコンクリート表面からの中性化深さの進行は、経過時間に関係する。","中性化の進行速度は、コンクリートの品質や配合の影響を受けるがセメントの種類による影響は受けない。"],"type":"right","ans":2,"page":"p.35","exp":"中性化深さ d＝α√t（α：速度係数、t：経過時間）。経過時間に関係して進行します。","own":false,"extra":""},{"id":"c2-20","ch":"c2","n":20,"stem":"中性化の進行に関する次の記述のうち、で正しいものを一つ選べ。","choices":["コンクリートの中性化原因は炭酸ガスの影響によるもので、その深さは経過年数に1次比例して進行する。","中性化したコンクリートは力学的強度も低下する。","中性化はコンクリート表面から進行するため、ジャンカや初期ひび割れは鉄筋の腐食時期を早める要因とはならない。","中性化の進行速度はコンクリートの配（調）合、環境条件に左右される。"],"type":"right","ans":3,"page":"p.35","exp":"中性化は経過年数の「平方根」に比例。力学的強度には影響しません。ジャンカやひび割れは腐食時期を早めます。速度は配合・環境に左右されます。","own":false,"extra":""},{"id":"c2-21","ch":"c2","n":21,"stem":"鉄筋コンクリートのアルカリシリカ反応の劣化に関する次の記述のうち、正しいものを一つ選べ。","choices":["アルカリシリカ反応は、コンクリート中のアルカリと骨材の反応であり、水分が多いとアルカリが希釈されて反応が少なくなる。","プレストレストコンクリート構造においては、導入されたプレストレスによりアルカリシリカ反応によるひび割れを防止できる。","アルカリシリカ反応は、打込み直後から膨張を開始し、材齢とともに反応は減少し、ほぼ 10 年程度で収束する。","アルカリシリカ反応によるひび割れは、網目状になることが多いが、水平方向に発生する場合もある。"],"type":"right","ans":3,"page":"p.36","exp":"ASR（アルカリシリカ反応）は「高アルカリ環境」「反応性骨材」「水の供給」の3つがそろうと発生。亀甲状・網目状や、拘束方向に沿ったひび割れが特徴です。","own":false,"extra":""},{"id":"c2-22","ch":"c2","n":22,"stem":"コンクリートの劣化現象とその原因となる環境条件や使用材料の次の組合せのうち、誤っているものを一つ選べ。","choices":["中性化 ― 気温、湿度、酸性物質の種類と濃度","塩　害 ― 気温、酸性ガスの種類と量、風向きと風速","凍　害 ― 気温、日射量、含水率","アルカリシリカ反応 ― 気温、含水率、反応性骨材"],"type":"wrong","ans":1,"page":"p.35〜36","exp":"塩害は、酸性ガスではなく塩化ナトリウム・塩化カリウムなど塩化物イオンの影響を受けます。","own":false,"extra":""},{"id":"c2-23","ch":"c2","n":23,"stem":"エフロレッセンスに関する次の記述のうち、誤っているものを一つ選べ。","choices":["エフロレッセンスはレイタンスがコンクリート表面に溶出したものである。","エフロレッセンスは水の移動が容易なひび割れやその周辺に発生しやすい。","エフロレッセンスが発生するとコンクリート構造物の美観を損なう。","エフロレッセンスには、水酸化カルシュウム、炭酸カルシュウム以外にアルカリ炭酸塩、アルカリ硫酸塩も含まれる。"],"type":"wrong","ans":0,"page":"","exp":"エフロレッセンス（白華）は、セメント硬化で生じた水酸化カルシウムが空気中の炭酸ガスと反応して炭酸カルシウムになったもの。レイタンスが溶出したものではありません。","own":false,"extra":""},{"id":"c2-24","ch":"c2","n":24,"stem":"鉄筋コンクリートの損傷とその原因の次の組合せのうち、誤っているものを一つ選べ。","choices":["ひび割れ ― 不同沈下、乾燥収縮、クリープ、疲労、鉄筋の腐食、アルカリシリカ反応","変色、着色 ― 雨水、排水、排ガス、ばいじん、海水、エフロレッセンス","ポップアウト ― 反応性骨材、凍結融解","磨　耗 ― 疲労、鉄筋腐食、凍結融解、初期養生不足、過大応力"],"type":"wrong","ans":3,"page":"p.57","exp":"磨耗は、自動車交通や流水などの影響で起こります。","own":false,"extra":""},{"id":"c2-25","ch":"c2","n":25,"stem":"コンクリートのひび割れが発生する次の原因のうち、誤っているものを一つ選べ。","choices":["不同沈下","クリープ","流水","アルカリシリカ反応"],"type":"wrong","ans":2,"page":"p.57","exp":"流水はひび割れではなく「磨耗」の原因です。","own":false,"extra":""},{"id":"c2-26","ch":"c2","n":26,"stem":"コンクリートに発生したひび割れ、剥離の補修に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋腐食でひび割れ、剥離が生じた箇所の補修は、腐食した鉄筋の錆を除去することが原則である。","注入工法は、ひび割れに樹脂等を注入することで、雨水、炭酸ガスの侵入を防ぐことを目的としている。","中性化、塩害に対する対策として、コンクリート塗装は防水、ガス透過阻止を目的としているが、鉄筋を塗装することも有効な方法である。","アルカリシリカ反応に対するコンクリート塗装材は、中性化、塩害と同様に水の非浸透、撥水性のみがある材料が条件である。"],"type":"wrong","ans":3,"page":"","exp":"ASR用のコンクリート塗装材は、中性化・塩害用と同様に水の非浸透・撥水性があり、さらに「通気性」のある材料が条件（水分を逃がすため）。","own":false,"extra":""},{"id":"c2-27","ch":"c2","n":27,"stem":"JASS5 の建築構造物の最小かぶり厚さの規定に関する次の記述のうち、誤っているものを一つ選べ。","choices":["図面等に表示する設計かぶり厚さには、最小かぶり厚さに 10 mm を加えた値を用いることにしている。","構造部材で柱、梁、耐力壁の屋内の最小かぶり厚さは 30 mm である。","床スラブ、屋根スラブの最小かぶり厚さは 50 mm である。","基礎の最小かぶり厚さは 60 mm である。"],"type":"wrong","ans":2,"page":"p.43","exp":"教材の表（JASS5 最小かぶり厚さ）より、床スラブ・屋根スラブを50mmとする③が不適当です。参考：柱・梁・耐力壁の屋内は30mm、基礎は60mm。","own":false,"extra":""},{"id":"c2-28","ch":"c2","n":28,"stem":"鉄筋コンクリートの施工（工事）に関する次の記述のうち、誤っているものを一つ選べ。","choices":["型枠の設計は、コンクリートの施工時の荷重、コンクリートの側圧、打込み時の振動・衝撃などに耐え、かつ、コンクリートが寸法許容差を超えるたわみ、誤差などを生じないように設計し、必要に応じて強度及び剛性について構造計算を行う必要がある。","支保工としての支柱は、コンクリート施工時の水平荷重による崩壊、浮き上がり、ねじれなどが生じないように、水平つなぎ、筋かい材、控え綱などにより補強をする。","せき板と最外側鉄筋とのあき、バーサポート及びスペーサの材質と配置、各種配管、ボックス、埋込金具の位置及び数量についての検査は、型枠の終了した段階では困難であるため、型枠の組立の各工程において工事監理者の検査を受ける必要がある。","型枠、支保工の取り外しはコンクリートが自立できるようになってから行う。"],"type":"wrong","ans":3,"page":"p.44","exp":"型枠・支保工は、所定の圧縮強度に達してから取り外します。建築では壁・梁側面5N/mm²以上、梁底面・スラブは設計基準強度以上。「自立できてから」は誤り。","own":false,"extra":""},{"id":"c2-29","ch":"c2","n":29,"stem":"コンクリートの運搬・打込み及び締固めに関する次の記述のうち、正しいものを一つ選べ。","choices":["施工者は、自主管理として所定の品質の構造体コンクリートを確保するための運搬・打込み及び締固め計画を定めれば、工事監理者の承認を受けなくてもよい。","コンクリートの運搬・打込み及び締固め計画を定める場合の 1 回の打込み区画・打込み高さ及び打込み量は、型枠中にコンクリートを密実かつ均質に充填できる範囲とする。","コンクリートの打込みに先立ち、打込み場所を清掃し固形物などを取り除かなければならない。液体ではマシンオイル等の油脂類は取り除かなければならないが、散水した水については特に考えなくても良い。","鉄骨鉄筋コンクリート梁への打込みは、同条件のコンクリートができるように 1 回で一気に打込みを終えるようにする。"],"type":"right","ans":1,"page":"p.39〜40","exp":"②が正しい。①工事監理者の承認を受ける ③散水した水も打込み前に高圧空気などで取り除く ④鉄骨鉄筋コンクリート梁は一気に打つと巣ができやすいので、順序よく確認して打込む。","own":false,"extra":""},{"id":"c2-30","ch":"c2","n":30,"stem":"鉄筋工事における品質管理・検査に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋コンクリート構造物の耐久性向上で重要なことの一つは、鉄筋の加工・組立てが設計図書あるいは各種の規定を守り、鉄筋が発せい（錆び）していないことを確認することである。","鉄筋工事では、コンクリートの流れが悪くなることでジャンカ、かぶり厚さの不足などが発生しないように、内側の鉄筋が少し緩めに固定してあることを確認する。","鉄筋の加工・組立てにおける品質管理・検査は、配筋図の確認、鉄筋工事の計画、鉄筋の加工、鉄筋の組立の各段階で実施する。","鉄筋の加工の段階では、切断加工機の仕様を確認することや、定められた許容誤差より小さい自主管理値を設けて管理することが必要である。"],"type":"wrong","ans":1,"page":"p.51","exp":"内側の鉄筋を緩く固定するのは誤り。鉄筋は正確に加工・組立し、棒形振動機が挿入しやすいようにします。","own":false,"extra":""},{"id":"c2-31","ch":"c2","n":31,"stem":"型枠の取り外しに関する次の記述のうち、誤っているものを一つ選べ。","choices":["型枠は、初期凍害を受けることなく、また容易に傷つけられることのない最低限のコンクリート強度を満足するまで、取り外してはならない。","型枠の取り外しのときは、コンクリートに損傷を与えないように静かに取り外す。","建築分野において、スラブ下および梁底面の型枠は、コンクリートが自立する強度を有したら、直ちに取り外してよい。","土木分野において、柱、壁、梁の側面の型枠は、コンクリートの圧縮強度が 5 N/mm<sup>2</sup> 以上になれば取り外してよい。"],"type":"wrong","ans":2,"page":"p.44","exp":"建築のスラブ下・梁底面の型枠は「設計基準強度以上」が必要。自立する強度だけでは、直ちには外せません。<table class=\"t\"><tr><th colspan=3>(a) 建築 JASS5</th></tr><tr><th>部位</th><th>条件</th><th>圧縮強度</th></tr>\n<tr><td rowspan=2>せき板</td><td>短期・標準</td><td>5 N/mm²</td></tr><tr><td>長期・超長期</td><td>10 N/mm²</td></tr>\n<tr><td>支保工</td><td>スラブ下・梁底面</td><td>設計基準強度</td></tr></table>\n<table class=\"t\"><tr><th colspan=2>(b) 土木（コンクリート標準・参考値）</th></tr><tr><th>部材面</th><th>圧縮強度</th></tr>\n<tr><td>フーチングの側面</td><td>3.5 N/mm²</td></tr><tr><td>柱・壁・梁の側面</td><td>5.0 N/mm²</td></tr><tr><td>スラブ・梁の底面、アーチの内面</td><td>14.0 N/mm²</td></tr></table>","own":false,"extra":""},{"id":"c2-32","ch":"c2","n":32,"stem":"コンクリートの養生に関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリートが硬化後に本来の性能を発揮するためには、硬化初期において十分な養生を施さなければならない。","使用するセメントの種類によって、標準の湿潤養生期間は異なる。","建築分野では、標準の湿潤養生期間が計画供用期間で区分されている。","土木分野では、日平均温度が低いほど湿潤養生期間は短くてよい。"],"type":"wrong","ans":3,"page":"p.40〜41","exp":"土木では、日平均温度が低いほど湿潤養生期間は「長く」なります。<table class=\"t\"><tr><th rowspan=2>セメントの種類</th><th colspan=2>建築(JASS5)</th><th colspan=3>土木 日平均温度</th></tr>\n<tr><th>短期・標準</th><th>長期・超長期</th><th>15℃以上</th><th>10℃以上</th><th>5℃以上</th></tr>\n<tr><td>早強ポルトランド</td><td>3</td><td>5</td><td>3</td><td>4</td><td>5</td></tr>\n<tr><td>普通ポルトランド</td><td>5</td><td>7</td><td>5</td><td>7</td><td>9</td></tr>\n<tr><td>混合セメントB種</td><td>―</td><td>―</td><td>7</td><td>9</td><td>12</td></tr>\n<tr><td>中庸熱・低熱ポルトランド／高炉B種・フライアッシュB種</td><td>7</td><td>10</td><td>―</td><td>―</td><td>―</td></tr></table>\n<small>（日以上）</small>","own":false,"extra":""},{"id":"c2-33","ch":"c2","n":33,"stem":"かぶり厚さに関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さは、鉄筋の最も外側からコンクリート表面までの最短距離をいう。","柱におけるかぶり厚さは、帯筋表面からコンクリート表面までの最短距離をいう。","梁におけるかぶり厚さは、あばら筋表面からコンクリート表面までの最短距離をいう。","基礎におけるかぶり厚さには、捨コンクリートの厚さも含める。"],"type":"wrong","ans":3,"page":"p.41〜43","exp":"捨コンクリートの厚さは、基礎のかぶり厚さには含めません。","own":false,"extra":""},{"id":"c2-34","ch":"c2","n":34,"stem":"建築構造物設計図に関する次の記述のうち、誤っているものを一つ選べ。","choices":["伏図には、主要構造部材である基礎や柱、梁、スラブ、壁などの構成が、各階別、かつ平面的に表示され、また各部材番号などが記載されている。","軸組図は、配筋にかかわる一般事項や鉄筋加工、かぶり厚さ、杭、基礎などの項目からなり、鉄筋のあき、帯筋（フープ）やあばら筋（肋筋：スターラップ）の配置についての基本事項や標準図などが記載されている。","配筋詳細図には、主要構造部材である柱の主筋や帯筋、梁の主筋やあばら筋の配筋状態が、各階をとおして詳細に記載されている。","柱・梁・スラブ・壁各断面リストには、主要構造部材である柱、梁の各階別の断面形状、鉄筋本数、径などと、スラブ、壁の種類別の厚さや鉄筋径、配筋間隔などが一覧の表として記載されている。"],"type":"wrong","ans":1,"page":"p.17〜20","exp":"②は「配筋標準図」の説明で、軸組図の説明ではありません。","own":false,"extra":""},{"id":"c2-35","ch":"c2","n":35,"stem":"土木構造物の作図方法に関する次の記述のうち、誤っているものを一つ選べ。","choices":["側面図では、道路（鉄道）は起点側を左側、終点側が右側になるように作図する。","平面図では、上からの視線で作図する。","断面図では、道路（鉄道）の起点側から終点方向の視線で作図する。","横断図では、河川の場合は下流から上流方向の視線で作図する。"],"type":"wrong","ans":3,"page":"p.23〜24","exp":"横断図で河川の場合は、上流から下流方向の視線で作図します。","own":false,"extra":""},{"id":"c2-36","ch":"c2","n":36,"stem":"コンクリートの用語に関する次の記述のうち、誤っているものを一つ選べ。","choices":["フレッシュコンクリートとは、材料の混合直後から凝結が始まるまでのコンクリートをいう。","ワーカビリティーとは、コンクリートを作るのに必要な各材料の使用割合又は使用量をいう。","混和材料とは、コンクリートの品質向上、性状改善のために用いられ、セメント、水、骨材以外の材料の総称をいう。","呼び強度とは、レディーミクストコンクリートに規定するコンクリートの強度の区分をいう。"],"type":"wrong","ans":1,"page":"p.28〜30","exp":"②は「配合（調合）」の説明。ワーカビリティーは別の用語です。","own":false,"extra":""},{"id":"c2-37","ch":"c2","n":37,"stem":"鋼材の用語に関する次の記述のうち、誤っているものを一つ選べ。","choices":["丸鋼とは、断面が一様な円形の鉄筋をいう。","異形棒鋼（鉄筋）とは、コンクリートとの付着をよくするために、表面に突起をもつ棒状の鋼材（鉄筋）をいう。","PC 鋼材とは、プレストレストコンクリートに用いる緊張用の鋼材をいう。","鋼材のあきとは、コンクリート部材内に配置された鋼材の中心間の距離をいう。"],"type":"wrong","ans":3,"page":"p.28〜30","exp":"④は「鉄筋間隔」（中心間距離）の説明。鋼材の「あき」は鋼材どうしの内側の距離です。","own":false,"extra":""},{"id":"c2-38","ch":"c2","n":38,"stem":"鉄筋の役割に関する次の記述のうち、誤っているものを一つ選べ。","choices":["主鉄筋は、柱、梁、スラブなどで曲げモーメント、軸力を負担するために配置される鉄筋である。","配力鉄筋は、応力を分散させる目的で、一般に主鉄筋と直角に配置される鉄筋である。","帯鉄筋は、主筋を包含するように配置され、主に柱の曲げモーメントを負担するために配置される鉄筋である。","あばら筋は、主にせん断力に抵抗するため、梁の主筋を包含するように配置される鉄筋である。"],"type":"wrong","ans":2,"page":"p.47","exp":"帯鉄筋は、主に柱の「せん断力」に抵抗するために配置されます（曲げモーメントではない）。","own":false,"extra":""},{"id":"c2-39","ch":"c2","n":39,"stem":"鉄筋の応力ーひずみ曲線において、A～Cに対応する次の語句の組合せとして、正しいものを一つ選べ。","choices":["A：上降伏点　B：引張強度　C：破断点","A：上降伏点　B：せん断強度　C：曲げ強度","A：圧縮強度　B：引張強度　C：曲げ強度","A：圧縮強度　B：せん断強度　C：破断点"],"type":"right","ans":0,"page":"p.46","exp":"テキスト46ページ 図2.7-2 のとおり。Aは上降伏点、Bは引張強度（最大応力）、Cは破断点。","own":false,"extra":"<img class=\"fig\" alt=\"応力ひずみ曲線\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/wAALCADrAUABAREA/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZ "P.67 表3.3-1","exp":"設計かぶりの距離の鉄筋間隔が測定できること。","own":false,"extra":""},{"id":"cr-3","ch":"cr","n":3,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている電磁誘導法によるかぶり（厚さ）測定について、次の記述のうち正しいものを一つ選べ。","choices":["測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔が設計かぶりの 1.5 倍以下の場合補正が必要である。","測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔が設計かぶりの 2 倍以下の場合補正が必要である。","測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔が設計かぶりの 2.5 倍以下の場合補正が必要である。","測定原理上、近接鉄筋の影響を受け易いので測定精度向上のため、鉄筋間隔に関係なくかぶり補正は必要である。"],"type":"right","ans":0,"page":"P.118","exp":"鉄筋間隔が設計かぶりの1.5倍以下の場合、補正が必要です。","own":false,"extra":""},{"id":"cr-4","ch":"cr","n":4,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている探査装置の性能で、かぶりの測定精度について、次の記述のうち正しいものを一つ選べ。","choices":["±20 mm 以下であること。","±15 mm 以下であること。","±10 mm 以下であること。","± 5 mm 以下であること。"],"type":"right","ans":3,"page":"P.67 表3.3-1","exp":"かぶりの測定精度は±5mm以下。","own":false,"extra":""},{"id":"cr-5","ch":"cr","n":5,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている探査装置の性能で、鉄筋間隔の測定精度について、次の記述のうち正しいものを一つ選べ。","choices":["±25 mm 以下であること。","±20 mm 以下であること。","±15 mm 以下であること。","±10 mm 以下であること。"],"type":"right","ans":3,"page":"P.67 表3.3-1","exp":"間隔の測定精度は±10mm以下。","own":false,"extra":""},{"id":"cr-6","ch":"cr","n":6,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている測定対象について、次の記述のうち正しいものを一つ選べ。","choices":["ボックスカルバートの測定断面数は、1 基あたり 1 断面とする。","ボックスカルバートの測定断面数は、1 基あたり 2 断面とする。","橋梁上部工の測定断面数は、1 径間あたり 1 断面とする。","橋梁上部工の測定断面数は、1 径間あたり 2 断面とする。"],"type":"right","ans":1,"page":"P.52","exp":"橋梁上部構造は1径間あたり3断面、ボックスカルバートは1基あたり2断面。","own":false,"extra":""},{"id":"cr-7","ch":"cr","n":7,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている測定対象について、次の記述のうち正しいものを一つ選べ。","choices":["配筋状態の測定は、鉄筋間隔を対象とする。","配筋状態の測定は、測定長さあたりの鉄筋本数を対象とする。","配筋状態の測定は、鉄筋間隔及び測定長さあたりの鉄筋本数を対象とする。","配筋状態の測定は、鉄筋間隔又は測定長さあたりの鉄筋本数を対象とする。"],"type":"right","ans":2,"page":"P.55 表2.8-3","exp":"配筋状態の測定は、60cm×60cm以上の範囲における「鉄筋間隔」と「測定長さあたりの本数」が対象。","own":false,"extra":""},{"id":"cr-8","ch":"cr","n":8,"stem":"非破壊検査によるコンクリート構造物中の配筋状態及びかぶり測定要領（H30. 10）で規定されている測定対象について、次の記述のうち正しいものを一つ選べ。","choices":["測定断面において設定した測定箇所は、30cm 以上×30 cm 以上の範囲とする。","測定断面において設定した測定箇所は、40cm 以上×40 cm 以上の範囲とする。","測定断面において設定した測定箇所は、50cm 以上×50 cm 以上の範囲とする。","測定断面において設定した測定箇所は、60cm 以上×60 cm 以上の範囲とする。"],"type":"right","ans":3,"page":"P.153 関連資料①","exp":"6.1(4) 測定手順より：60cm×60cm以上の範囲における鉄筋間隔、測定長さあたりの本数を対象とします。","own":false,"extra":""},{"id":"c3-1","ch":"c3","n":1,"stem":"次は、電磁波が比誘電率ε<sub>r</sub>の媒体中を進む速度を表している。正しいものを一つ選べ。ただし、速度単位 m/s とする。","choices":["(3×10<sup>8</sup>) ／ √ε<sub>r</sub>","(3×10<sup>8</sup>) ／ ε<sub>r</sub>","(3×10<sup>8</sup>) ／ ε<sub>r</sub><sup>2</sup>","(3×10<sup>8</sup>) ／ ε<sub>r</sub><sup>3</sup>"],"type":"right","ans":0,"page":"","exp":"【補足】電磁波の速度 v ＝ 3×10⁸ ／ √εr（m/s）。比誘電率が大きい媒体ほど遅くなります。","own":true,"extra":""},{"id":"c3-2","ch":"c3","n":2,"stem":"次の文は、電磁波が比誘電率 9 のコンクリート中を進む速度は、空気中を進む速度に比べてどのように変わるかを説明している。正しいもの一つ選べ。","choices":["全く変わらない。","1/9 に減速する。","1/3 に減速する。","1/2 に減速する。"],"type":"right","ans":2,"page":"","exp":"【補足】v ＝ 3×10⁸ ／ √9 ＝ 空気中の1/3。比誘電率9なら速度は1/3に減速します。","own":true,"extra":""},{"id":"c3-3","ch":"c3","n":3,"stem":"次は、乾燥したコンクリートの比誘電率である。最も近いものを一つ選べ。","choices":["1","2 ～ 3","4 ～ 12","∞"],"type":"right","ans":2,"page":"","exp":"【補足】乾燥したコンクリートの比誘電率は4〜12程度。水分を含むと大きくなります（水は約80）。","own":true,"extra":""},{"id":"c3-4","ch":"c3","n":4,"stem":"次の文は、コンクリート材質の誘電率の変動要因について説明している。正しいものを一つ選べ。","choices":["含水率が増えると大きくなる。","温度が高いほど大きくなる。","硬いほど大きくなる。","鉄筋の密集度合いにより変化する。"],"type":"right","ans":0,"page":"","exp":"【補足】含水率が増えると比誘電率は大きくなります（水の比誘電率が大きいため）。","own":true,"extra":""},{"id":"c3-5","ch":"c3","n":5,"stem":"次は、電磁波が比誘電率ε<sub>1</sub>からε<sub>2</sub>の境界に到達したときの反射率γを表している。正しいものを一つ選べ。","choices":["γ ＝ (ε<sub>1</sub> − ε<sub>2</sub>) ／ (ε<sub>1</sub> + ε<sub>2</sub>)","γ ＝ (ε<sub>1</sub> + ε<sub>2</sub>) ／ (ε<sub>1</sub> − ε<sub>2</sub>)","γ ＝ { (ε<sub>1</sub> − ε<sub>2</sub>) ／ (ε<sub>1</sub> + ε<sub>2</sub>) }<sup>2</sup>","γ ＝ (√ε<sub>1</sub> − √ε<sub>2</sub>) ／ (√ε<sub>1</sub> + √ε<sub>2</sub>)"],"type":"right","ans":3,"page":"","exp":"【補足】γ ＝ (√ε₁ − √ε₂) ／ (√ε₁ + √ε₂)。問7の解説にも同じ式が出てきます。","own":true,"extra":""},{"id":"c3-6","ch":"c3","n":6,"stem":"比誘電率 4 のコンクリートと金属の境界の反射率は、同じコンクリートと空洞の境界の反射率の何倍か。正しいものを一つ選べ。","choices":["0.2 倍","0.6 倍","1 倍","3 倍"],"type":"right","ans":3,"page":"","exp":"【補足】コンクリート(ε=4,√=2)→金属：|γ|=1。→空洞(ε=1)：γ＝(2−1)/(2+1)＝1/3。1 ÷ (1/3) ＝ 3倍。","own":true,"extra":""},{"id":"c3-7","ch":"c3","n":7,"stem":"直接反射波形（Aモード）の最初のピーク（表面から見て）の極性によりどのようなことが判るか、次の中から正しいものを一つ選べ。","choices":["空洞の大きさの測定ができる。","鉄筋径の測定ができる。","反射物標の材質の特定ができる。","コンクリートの比誘電率値に比べ反射物標の比誘電率の大小関係がわかる。"],"type":"right","ans":3,"page":"p.61 3.1.4(2)","exp":"境界面で電磁波は一部が反射します。γ＝(√ε₁−√ε₂)/(√ε₁+√ε₂)。コンクリートより比誘電率が大きい物標（鉄筋）は反射率がマイナス、小さい物標（空洞）はプラス。反射波の位相（極性）で、比誘電率の大小関係がわかります。","own":false,"extra":""},{"id":"c3-8","ch":"c3","n":8,"stem":"次は、電磁波の波長λと周波数 f の関係を表している正しいものを選べ。ただし、C は媒体中を進む電磁波の速度とする。","choices":["λ ＝ Cf","λ ＝ C ／ f","λ ＝ C<sup>2</sup> ／ f","λ ＝ Cf<sup>2</sup>"],"type":"right","ans":1,"page":"p.61 式3.1-4","exp":"波長 λ ＝ C ／ f。","own":false,"extra":""},{"id":"c3-9","ch":"c3","n":9,"stem":"次は、電磁波レーダで使用される周波数である。最も近いものを一つ選べ。","choices":["200Hz　～　2kHz","200kHz　～　2MHz","200MHz　～　2GHz","200GHz　～　2THz"],"type":"right","ans":2,"page":"p.61 3.1.5","exp":"電磁波レーダでは 200MHz〜2GHz が使われます。","own":false,"extra":""},{"id":"c3-10","ch":"c3","n":10,"stem":"国内で使用される電磁波に関する次の記述のうち、正しいものを一つ選べ。","choices":["無線局でないので、制約はない。","電波法で制約されている。","電波法施行規則で制約されている。","電波法と電波法施行規則で制約されている。"],"type":"right","ans":3,"page":"p.61 3.1.6","exp":"電波の強さに関する法令は、電波法（第2章第4条）と電波法施行規則（第6条）。","own":false,"extra":""},{"id":"c3-11","ch":"c3","n":11,"stem":"次は、電磁波レーダ法において媒体の比誘電率ε<sub>r</sub>、送信してから受信するまでの時間（反射時間）T から測定かぶり厚さ D を求める式である。正しいものを一つ選べ。","choices":["D ＝ (T ／ 4) × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>","D ＝ (T ／ 2) × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>","D ＝ T × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>","D ＝ 2T × (3×10<sup>8</sup>) ／ √ε<sub>r</sub>"],"type":"right","ans":1,"page":"p.64 式3.2-1","exp":"反射時間Tは、かぶり厚さの2倍の距離（往復）を電波が伝わる時間。2D＝T×v より D ＝ (T/2) × 3×10⁸／√εr。","own":false,"extra":""},{"id":"c3-12","ch":"c3","n":12,"stem":"次は、電磁波レーダ法において、鉄筋からの反射時間 2×10<sup>-9</sup> s、コンクリートの比誘電率 4、空気中の電磁波速度 3×10<sup>8</sup> m/s のとき、かぶり厚さを示している。正しいものを一つ選べ。","choices":["25 mm","50 mm","100 mm","150 mm"],"type":"right","ans":3,"page":"p.64 式3.2-1","exp":"D ＝ (2×10⁻⁹ ／ 2) × 3×10⁸／√4 ＝ 0.15 m ＝ 150mm。","own":false,"extra":""},{"id":"c3-13","ch":"c3","n":13,"stem":"次は、実際のかぶり厚さ 70mm の比誘電率が一様なコンクリート構造物を、電磁波レーダ法で比誘電率を 8 にセットして測定するとかぶり厚さは 50mm となったときの、このコンクリート構造物の実際の比誘電率を示している。最も近いものを次の中から一つ選べ。","choices":["4","6","12","16"],"type":"right","ans":0,"page":"p.64 式3.2-1","exp":"実際D＝70mm、設定εr＝8での測定値D′＝50mm。D/D′ ＝ √8 ／ √εr より 0.07/0.05 ＝ √8／√εr。εr ＝ 8×25/49 ≒ 4.08 → 約4。","own":false,"extra":""},{"id":"c3-14","ch":"c3","n":14,"stem":"電磁波レーダ法によるかぶり厚さ測定において、測定現場のコンクリートの比誘電率を真値よりも大きな値に設定した場合、かぶり厚さ測定値に関する次の記述のうち、正しいものを一つ選べ。","choices":["真値より深く測定される。","真値より浅く測定される。","比誘電率に影響されない。","比誘電率値に比例して大きくなる。"],"type":"right","ans":1,"page":"p.64 式3.2-1","exp":"D′ ＝ D／k（k&gt;1）となるので、比誘電率を大きく設定すると、真値より「浅く」測定されます。","own":false,"extra":""},{"id":"c3-15","ch":"c3","n":15,"stem":"次の文は、電磁波レーダ法の装置について述べたものである。正しいものを一つ選べ。","choices":["一組の送信・受信アンテナが組み込まれた装置（シングルパス方式）は比誘電率の設定は必要ない。","あらかじめ設定された比誘電率とかぶり厚さから、電磁波の伝搬時間を推定する。","送信波には、「インパルス方式」と「チャープ方式」がある。","受信波の表示方法 A モード（またはスコープ）では、縦軸が縦方向の走査方向、横軸が横方向の走査方向、ある深さの反射強度を各点の輝度で表す。"],"type":"right","ans":2,"page":"p.8, p.64","exp":"③が正しい。送信波にはインパルス方式とチャープ方式があります。①シングルパス方式でも比誘電率の設定は必要 ②マルチパス方式は反射時間から比誘電率を推定 ④Aモードは横軸が時間、縦軸が受信波の振幅。","own":false,"extra":""},{"id":"c3-16","ch":"c3","n":16,"stem":"次の文は、電磁波レーダ法における測定上の注意点について述べたものである。正しいものを一つ選べ。","choices":["コンクリート内部の水分量（含水率）は測定に影響を与えない。","探査面が凹凸の場合、走査距離誤差を小さくするため高速に走査する。","炭素繊維（カーボンシート補強など）は測定に影響を与えない。","周囲に強い電磁波の発生源（強い高周波を発生する装置など）がないことを確認する。"],"type":"right","ans":3,"page":"p.68 3.4","exp":"①水分量は影響する ②凹凸があると走査距離に影響（ベニヤ板などで対処し、厚さを引く） ③炭素繊維も影響する場合あり ④強い電磁波の発生源（溶接機など）の影響が小さいことを確認する（正）。","own":false,"extra":""},{"id":"c3-17","ch":"c3","n":17,"stem":"次の文は、電磁波レーダ法における装置の点検について述べたものである。正しいものを一つ選べ。","choices":["定期点検は、トレーサビリティが重要なため外部に依頼してはならない。","日常点検は、試験開始前に一度だけ行う。","かぶり厚さの測定性能の確認は、対比試験体又は標準試験体を用いて行う。","走査距離の測定性能の確認は、平坦度 1 mm 以内の面の 10 mm を走査した際の読み取り誤差を用いる。"],"type":"right","ans":2,"page":"p.72〜76","exp":"①定期点検は外部（校正）に出してトレーサビリティを確保 ②日常点検は試験前・試験中・試験終了時 ④走査距離の確認は500mmと1000mmを走査。③が正しい。","own":false,"extra":""},{"id":"c3-18","ch":"c3","n":18,"stem":"次の文は、電磁波レーダ法における比誘電率の推定について述べたものである。正しいものを一つ選べ。","choices":["モルタルやタイルなど厚く比誘電率が変化しやすい仕上げ材がある場合、鉄筋平面位置、鉄筋間隔は試験対象とするが、かぶり厚さは参考扱いとする。","設計図書、施工図等から得られた配筋状態は測定結果として用いてよい。","かぶり厚さ試験のための走査線は、鉄筋の真上に設定する。","距離が加算される試験装置は、前進と後退を繰り返して測定することが原則である。"],"type":"right","ans":0,"page":"p.76〜80","exp":"①正しい。比誘電率が変化しやすい厚い仕上げ材は、補正が難しい誤差要因なので、かぶり厚さは参考扱い。②設計どおりか確認するため電磁波レーダ法を適用 ③走査線は鉄筋の中間かつ対象鉄筋に直交 ④距離加算式は一方向に移動させるのが原則。","own":false,"extra":""},{"id":"c3-19","ch":"c3","n":19,"stem":"次の文は、電磁波レーダ法における比誘電率の推定について述べたものである。正しいものを一つ選べ。","choices":["カーブフィッティング法は、鉄筋の断面形状が円であることを利用する。","鉄筋径法は、格子状に配筋されている縦筋と横筋のかぶり厚さの差が、コンクリート表面に近い鉄筋の径に一致することを利用する。","鉄筋径法は、縦筋と横筋両方の鉄筋径が同じであることを前提としている。","実測法は、鉄筋探査装置ではない専用の装置を用いてボス供試体から誘電率を測定する方法である。"],"type":"right","ans":1,"page":"p.86〜89 3.7","exp":"②が正しい。①カーブフィッティング法は反射画像が双曲線状になることを利用 ③鉄筋径法は鉄筋径が既知で縦筋・横筋が緊張されていることを前提 ④実測法はボス供試体などから実測値で求める方法。","own":false,"extra":""},{"id":"c4-1","ch":"c4","n":1,"stem":"次の文は、電磁誘導法の特徴について述べたものである。正しいものを一つ選べ。","choices":["誘電率の影響を受けない。","かぶり厚さが大きいほど鉄筋の検出は容易である。","鉄筋間隔が狭いほど、鉄筋を個別に判別するのは容易である。","コンクリート表面にある金属パネルは取り除く必要がない。"],"type":"right","ans":0,"page":"p.100 4.5.2","exp":"電磁誘導法は、鉄筋とコンクリートの導電率・透磁率の差を利用。使用周波数では誘電率の影響はほぼ受けません。","own":false,"extra":""},{"id":"c4-2","ch":"c4","n":2,"stem":"電磁誘導法の測定に影響を与えない次の要素のうち、誤っているものを一つ選べ。","choices":["コンクリートの水分","コンクリート表面の鉄分を含まない塗装","コンクリート内の空隙","コンクリート内の鉄筋"],"type":"wrong","ans":3,"page":"p.90 4.1","exp":"水分・塗装・空隙はコンクリートとの差が小さいので影響しません（鉄分を含む塗装は注意）。影響を与えるのは鉄筋。","own":false,"extra":""},{"id":"c4-3","ch":"c4","n":3,"stem":"電磁誘導法の特徴に関する次の記述のうち、正しいものを一つ選べ。","choices":["鉄筋の位置を反射波の時間的変化で確認する。","比較的深いかぶり厚さ測定に適する。","電磁波レーダ法と比較して浅いかぶり厚さ測定に適している。","鉄筋とコンクリートの定着状態の確認ができる。"],"type":"right","ans":2,"page":"p.59, p.118","exp":"電磁誘導法は10〜80mm程度。数十〜数千mmまで使える電磁波レーダ法と比べて、浅いかぶり厚さ測定に適しています。","own":false,"extra":""},{"id":"c4-4","ch":"c4","n":4,"stem":"次の文は、NDTS 4101「コンクリート中の配筋探査に使用する装置についての規格」に記載されている電磁誘導法に使用する試験装置の点検について述べたものである。正しいものを一つ選べ。","choices":["定期点検は、1 日の中で複数回定期的に行う。","日常点検には、始業前点検、及び終業時点検の 2 つで構成されている。","日常点検では、各メーカ推奨のテストブロック、または試験体（TB-E1）を使用する。","かぶり厚さ精度を点検するには、かぶり厚さ 20 mm 以下と 100 mm 以上の 2 箇所を測定する。"],"type":"right","ans":2,"page":"p.99 4.4","exp":"①定期点検は年1回、メーカー等で総合点検・校正 ②日常点検は始業前・作業中・終業時・定期点検 ④かぶり精度は「20mm以下」と「50mm以上100mm未満」の2箇所。③が正しい。","own":false,"extra":""},{"id":"c4-5","ch":"c4","n":5,"stem":"電磁誘導法で次の探査対象のうち、探査できないものを一つ選べ。","choices":["塩化ビニル管","異形鉄筋","鉄製電配管","銅管"],"type":"wrong","ans":0,"page":"p.90 4.1","exp":"塩化ビニル管は、電気的にも磁気的にもコンクリートとの差が小さいので探査できません。","own":false,"extra":""},{"id":"c4-6","ch":"c4","n":6,"stem":"次の用語のうち、電磁誘導法に関連のないものを一つ選べ。","choices":["透磁率","導電率","抵抗率","誘電率"],"type":"wrong","ans":3,"page":"p.90 4.1","exp":"電磁誘導法は導電率・透磁率の差を利用します。誘電率は関連しません（電磁波レーダ法の用語）。","own":false,"extra":""},{"id":"c4-7","ch":"c4","n":7,"stem":"次の作業場所のうち、電磁誘導法の測定に最も影響を及ぼすものを一つ選べ。","choices":["塗装がされているコンクリート","ボックスカルバート内","高圧電線に近接する場所","水分を含んでいるコンクリート"],"type":"other","ans":2,"page":"p.99, 4.5","exp":"測定前に周囲に強い磁界の発生源がないことを確認します。高圧電線は強い磁界を発生するので要注意。","own":false,"extra":""},{"id":"c4-8","ch":"c4","n":8,"stem":"電磁誘導法による鉄筋探査に関する次の記述のうち、誤っているものを一つ選べ。","choices":["鉄筋が近接または密着している場合は、1 本の鉄筋として検出される場合が多い。","かぶり厚さとはコンクリート表面から鉄筋の頂点までの最短距離を示す。","ダブル配筋において手前側とその奥側の鉄筋の間隔が離れている場合は、手前側の鉄筋のみ検出できる。","ジャンカを確認することができる。"],"type":"wrong","ans":3,"page":"p.90 4.1","exp":"ジャンカ（空洞）は、電気的にも磁気的にもコンクリートとの区別が困難。確認できません。","own":false,"extra":""},{"id":"c4-9","ch":"c4","n":9,"stem":"渦電流の特徴に関する次の記述のうち、誤っているものを一つ選べ。","choices":["導体表面の渦電流強度は、周波数が高くなるほど大きくなる。","渦電流の表皮厚は周波数が高くなるほど厚くなる。","渦電流の表皮厚は透磁率と導電率が大きいほど薄くなる。","励磁電流が大きくなると磁束が大きくなるので、渦電流強度も大きくなる。"],"type":"wrong","ans":1,"page":"p.94 式4.2-1","exp":"表皮厚 δ＝(πμσf)^(−1/2)。周波数が高いほど表皮厚は「薄く」なります。②は誤り。","own":false,"extra":""},{"id":"c4-10","ch":"c4","n":10,"stem":"透磁率に関する次の記述のうち、正しいものを一つ選べ。","choices":["電磁誘導法探査装置は鉄筋の透磁率を定量的に測定できる。","鉄筋の透磁率は真空の透磁率の約 0.8 倍である。","コンクリートの透磁率は真空の透磁率の約 100 倍である。","透磁率と磁界の積が磁束密度となる。"],"type":"right","ans":3,"page":"p.90 式4.1-1","exp":"磁束密度 B＝μH。①透磁率を測れる探査装置は今のところ無い ②鉄筋の比透磁率は数百 ③コンクリートの比透磁率はほぼ1。","own":false,"extra":""},{"id":"c4-11","ch":"c4","n":11,"stem":"電流 I と磁界 H または磁束 φ の関係のうち、誤っているものを一つ選べ。","choices":["図①","図②","図③","図④"],"type":"wrong","ans":1,"page":"p.91 図4.1-1","exp":"アンペアの右ねじの法則（電流の向きに右ねじを進めると、磁界は右ねじの回る向き）に照らして判断します。正解は②。教材の解説は「②の図」とだけ記載されています。","own":false,"extra":"<img class=\"fig\" alt=\"電流と磁界の図\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/wAALCACcAoABAREA/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/9oACAEBAAA/APZaTdjio4rmGZmWKWNyhwwVgdp9DjpUtFFFFFFFGaKKKKKKM0U15FjUliFA7k4FKDzilooozRRRRRRRmiiiiikJxRu9qWiiiiiijNFFFFFFGaKKM4pM0tFGaKKKKKKM0UUUUUUUUUUUVk6ii3+pQ6bLu+z+S80yhseYAQqqcc45JI9h9KwtFsxLba4YdkVzp99NDaTpGiNGojVlU7QARknrmur0+5a80+3umQoZolcqf4cjOKsUUUUUUUUUUUUUUUhrkLi1Op28ep6nJHHbO8rySu4Y2yA7Y1jUgqS2OTjJzj0xY8MDUbOz0v7bALX7VG6S2gXAjcEsjAfw5QHK9ASPfPUUUUUUUUUUUUUUUUVna1LcLbR29rJ5U93KIUlxny8glmGeMhVbGeM4zXNvpUdnr9uspQ3FzcumU3h1i2MQ/nHB8zK8gHHOAO9dDoF7Nd2csdxIJJ7S4ktpJAMbyp4bHqQQT75rUoooooooooooooooPSsK7nN5qN1HNJOtnZKqtFCSpnkcZxleTgEAAdS3NUNMvGTRbDW4I5bWGSQLcWZlMihWk2Z5zgqcEkcEbuvFdZ2oooooooooooooooooooooqhf2ElxNDdW0whuoNwRmXcrK2NysMjg4B4I5A+hxNN8PapD9thlnjghv5TLcskrSu7HAITKqFBAAyckY/GunijWKNY0UKqgBVHQAdqfRRRRRRRRRRRRRRQea5HWvDWqloW0q8l8mCZ5o4RMsZRm92RwQMsRkAjPftraPpN1bC3kv7lpnt4jHGhcvgn7zs5ALOcdcADkAVsUUUUUUUUUUUUUUUVU1Gya+twkc7QSo4kilQAlGHTg9QeQR3BNc3/ZeuPNFFJZoVgu2u0drzMXmHPbbv2gkkLx1AzgV0emaeum23lB2kd3aSWVusjs  式4.1-6","exp":"誘導起電力 e＝−dφ/dt ＝ −(−10)/2 ＝ 5.0 V。","own":false,"extra":""},{"id":"c4-14","ch":"c4","n":14,"stem":"電磁誘導法において、鉄筋が近接している場合の測定値（かぶり厚さ、鉄筋径）への影響を補正する方法について、正しいものを一つ選べ。","choices":["実構造物と同様の配筋の上にアクリル板などを重ねていきながら、実際のかぶり厚さと測定（指示）値を用いて補正する。","検出信号の大きさは、鉄筋間隔の二乗に比例するので、式を用いて補正する。","検出信号の大きさは、かぶり厚さの二乗に比例するので、式を用いて補正する。","近接鉄筋の影響はないので、補正は不要である。"],"type":"right","ans":0,"page":"pp.104〜105 4.7.3","exp":"近接鉄筋はかぶり厚さ・鉄筋位置・鉄筋径の測定に影響します。実構造物と同様の配筋で係数を求めて補正します。検出信号は鉄筋間隔・かぶり厚さが大きいほど小さくなります。","own":false,"extra":""},{"id":"c4-15","ch":"c4","n":15,"stem":"次の文は、電磁誘導法における近接鉄筋の影響について述べたものである。正しいものを一つ選べ。","choices":["鉄筋間隔が近いほど、測定値は実際のかぶり厚さより大きくなる。","かぶり厚さの補正係数に鉄筋間隔は影響を与えない。","かぶり厚さの誤差 e とかぶり厚さ t の関係は e = at<sup>2</sup> で表される。a は鉄筋間隔で決まる係数である。","鉄筋間隔 d とかぶり厚さ t の比 k = d/t が大きいほど補正は必要である。"],"type":"right","ans":2,"page":"pp.104〜105 4.7.3","exp":"③が正しい。誤差はかぶり厚さの二乗に比例し、鉄筋間隔が大きいほど大きくなります。なお k＝d/t（間隔÷かぶり）を使うと、鉄筋径によらず補正の要否を判断できます。","own":false,"extra":"<p class=\"note\">以下の設問中の「JASS 5」及び「JASS 5 T-608」は、日本建築学会：建築工事標準仕様書・同解説 鉄筋コンクリート工事 2022年版発行のものである。</p>"},{"id":"c5-1","ch":"c5","n":1,"stem":"コンクリートのかぶり厚さに関する次の記述のうち、誤っているものを一つ選べ。","choices":["コンクリートのかぶり厚さは、鉄筋コンクリート構造物の耐久性を確保するために、適切な量を確保しなければならない。","コンクリートのかぶり厚さは、鉄筋コンクリート構造物の耐火性を確保するために、適切な量を確保しなければならない。","コンクリートのかぶり厚さが不足している場合、コンクリートの中性化速度が速くなり、鉄筋の腐食する時期が早まる。","コンクリートのかぶり厚さが不足している場合、飛来塩分などの劣化因子によって鉄筋が腐食を受けやすくなる。"],"type":"wrong","ans":2,"page":"P.107","exp":"かぶり不足だと鉄筋の腐食時期は早まりますが、中性化速度が速くなるわけではありません。","own":false,"extra":""},{"id":"c5-2","ch":"c5","n":2,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さ」に関する次の記述のうち、正しいものを一つ選べ。","choices":["建物の用途にあわせて、コンクリートのかぶり厚さを設計者が任意に定めることができる。","建物の計画供用期間にあわせて、コンクリートのかぶり厚さを定めている。","コンクリートのかぶり厚さは、建築基準法施行令で定められており、全ての部材で同じ値である。","コンクリートのかぶり厚さは、建築基準法施行令で定められており、構造部材は非構造部材よりも値が小さい。"],"type":"right","ans":1,"page":"P.109〜110 表5.2-1","exp":"かぶり厚さは、計画供用期間や部材の種類・環境などで決まり、設計者が任意には決められません。構造部材は非構造部材より値が大きい。","own":false,"extra":""},{"id":"c5-3","ch":"c5","n":3,"stem":"コンクリートのかぶり厚さに関する次の記述のうち、誤っているものを一つ選べ。","choices":["建築基準法施行令では、柱・梁・耐力壁におけるコンクリートのかぶり厚さを 3 cm と定めている。","建築基準法施行令では、床スラブ・屋根スラブにおけるコンクリートのかぶり厚さを 2 cm と定めている。","建築基準法施行令では、構造部材と同等の耐久性を要求する部材におけるコンクリートのかぶり厚さを 2 cm と定めている。","建築基準法施行令では、直接土に接する壁や基礎の立上り部分におけるコンクリートのかぶり厚さを 5 cm と定めている。"],"type":"wrong","ans":3,"page":"P.110 表5.2-1","exp":"直接土に接する壁や基礎の立上りは4cm。","own":false,"extra":""},{"id":"c5-4","ch":"c5","n":4,"stem":"JASS 5 に定められている「コンクリートの一般劣化環境でのかぶり厚さ」に関する次の記述のうち、正しいものを一つ選べ。","choices":["計画供用期間の級が短期の場合、耐久性上有効な仕上げの有無でコンクリートのかぶり厚さが異なる。","計画供用期間の級が標準の場合、耐久性上有効な仕上げが施されていても、コンクリートのかぶり厚さは同じである。","計画供用期間の級が標準・長期の場合、耐久性上有効な仕上げが施されている場合、コンクリートの最小かぶり厚さを 10 mm 減じた値とすることができる。","計画供用期間の級が超長期の場合、直接土に接する部分や基礎のコンクリートのかぶり厚さは、供用期間の級が短期の場合よりも大きく定められている。"],"type":"right","ans":2,"page":"P.110 表5.2-1","exp":"③が正しい。①短期は仕上げの有無によらず同じ ④直接土に接する部分は供用期間にかかわらず40mm。","own":false,"extra":""},{"id":"c5-5","ch":"c5","n":5,"stem":"JASS 5 で定められている構造部材のコンクリートの最小かぶり厚さに関する次の記述のうち、建築基準法施行令で定められているかぶり厚さと異なる値のものとして、誤っているものを一つ選べ。","choices":["一般劣化環境（腐食環境）における計画供用期間の級が短期の場合","一般劣化環境（腐食環境）における計画供用期間の級が標準・長期の場合で、耐久性上有効な仕上げが施されている場合","一般劣化環境（腐食環境）における計画供用期間の級が超長期の場合","一般劣化環境（非腐食環境）における場合"],"type":"wrong","ans":2,"page":"P.110 表5.2-1","exp":"建築基準法施行令と同じ値なのは①②④。資料の記載により、誤っているものは③。","own":false,"extra":""},{"id":"c5-6","ch":"c5","n":6,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さの測定方法」に関する次の記述のうち、正しいものを一つ選べ。","choices":["JASS 5 T-608（電磁誘導法によるコンクリートの中の鉄筋位置の測定方法）が定められている。","JASS 5 T-608（電磁波レーダ法によるコンクリートの中の鉄筋位置の測定方法）が定められている。","JASS 5 T-608（超音波法によるコンクリートの中の鉄筋位置の測定方法）が定められている。","JASS 5 T-608（電磁誘導法によるコンクリートの中の鉄筋位置の測定方法）と JASS 5 T-608（電磁波レーダ法によるコンクリートの中の鉄筋位置の測定方法）が定められている。"],"type":"right","ans":0,"page":"P.112","exp":"「電磁誘導法により推定する場合に適用し…」と記載されています。","own":false,"extra":""},{"id":"c5-7","ch":"c5","n":7,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さの検査」に関する次の記述のうち、測定方法として正しいものを一つ選べ。","choices":["測定はドリルによる穿孔など、微破壊試験で行う。","測定は定められた非破壊試験でのみ行う。","測定は定められた非破壊試験または同等の精度で検査が行える方法で行う。","測定は任意の方法で行う。"],"type":"right","ans":2,"page":"P.115","exp":"JASS5 T-608（2009年版）が規定され、同法若しくは同等の精度を有する検査方法で実施します。","own":false,"extra":""},{"id":"c5-8","ch":"c5","n":8,"stem":"JASS 5 に定められる「構造体コンクリートのかぶり厚さの検査」において非破壊試験を行う場合、誤っているものを一つ選べ。","choices":["検査箇所は、同一打込み日、同一打込み工区の柱、梁、壁、床または屋根スラブから選択する。","選択は、設計図および施工図を基にかぶり厚さ不足が懸念される部材をおのおの 10％選択する。","選択した部材のうち、測定可能な面についておのおの 10 本以上のかぶり厚さを測定する。","測定結果に疑義がある場合は、あらためて非破壊検査によって確認する。"],"type":"wrong","ans":3,"page":"P.113","exp":"測定結果に疑義がある場合は、破壊検査によって確認します。","own":false,"extra":""},{"id":"c5-9","ch":"c5","n":9,"stem":"JASS 5 に定められる「せき板または支柱の取外し後の構造体コンクリートのかぶり厚さの検査」の次の記述のうち、正しいものを一つ選べ。","choices":["構造体コンクリートのかぶり厚さ不足の兆候を目視によって検査し、かぶり厚さ不足が懸念される場合は、かぶり厚さの非破壊検査を行う。非破壊検査が不合格の場合は、破壊検査によって確認する。","構造体コンクリートのかぶり厚さ不足の兆候を目視によって検査し、かぶり厚さ不足が懸念される場合は、かぶり厚さの微破壊検査を行う。微破壊検査が不合格の場合は、破壊検査によって確認する。","構造体コンクリートのかぶり厚さ不足の兆候を目視によって検査し、かぶり厚さ不足が懸念される場合は、直ちに破壊検査によって確認する。","構造体コンクリートのかぶり厚さ不足の兆候を非破壊試験によって検査し、かぶり厚さ不足が懸念される場合は、かぶり厚さの微破壊検査を行う。微破壊検査が不合格の場合は、破壊検査によって確認する。"],"type":"right","ans":0,"page":"P.113","exp":"目視で兆候を検査→不足が懸念されれば非破壊検査→不合格なら破壊検査。","own":false,"extra":""},{"id":"c5-10","ch":"c5","n":10,"stem":"JASS 5 に定められるかぶり厚さの判定基準の組合せ（下表）のうち、正しいものを一つ選べ。ただし、表中の記号は次のとおりとする。","choices":["表の ① の判定基準","表の ② の判定基準","表の ③ の判定基準","表の ④ の判定基準"],"type":"right","ans":1,"page":"P.113 表11.7","exp":"判定基準：x≧Cmin−10mm／不良率 P(x&lt;Cmin)≦0.15／平均 Cmin≦X̄≦Cd+20mm の組合せが②。","own":false,"extra":"<p class=\"note\">x（個々の測定値(mm)）、X̄（測定値の平均値(mm)）、C<sub>min</sub>（最小かぶり厚さ(mm)）、C<sub>d</sub>（設計かぶり厚さ(mm)）、P(x &lt; C<sub>min</sub>)（測定値が C<sub>min</sub> を下回る確率）</p><p class=\"note\">表　かぶり厚さの判定基準</p><table class=\"t\"><tr><th></th><th>①</th><th>②</th><th>③</th><th>④</th></tr><tr><td>項目</td><td>判定基準</td><td>判定基準</td><td>判定基準</td><td>判定基準</td></tr><tr><td>測定値と最小かぶり厚さとの関係</td><td>x ≧ C<sub>min</sub> − 10mm</td><td>x ≧ C<sub>min</sub> − 10mm</td><td>x ≧ C<sub>min</sub> + 10mm</td><td>x ≧ C<sub>min</sub> − 10mm</td></tr><tr><td>最小かぶり厚さに対する不良率</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.10</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.15</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.15</td><td>P(x &lt; C<sub>min</sub>) ≦ 0.10</td></tr><tr><td>測定結果の平均値の範囲</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> − 20mm</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> + 20mm</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> + 10mm</td><td>C<sub>min</sub> ≦ X̄ ≦ C<sub>d</sub> + 20mm</td></tr></table>"},{"id":"c5-11","ch":"c5","n":11,"stem":"JASS 5 に定められる JASS 5 T-608 に使用する測定装置の性能に関する次の記述のうち、誤っているものを一つ選べ。","choices":["適用範囲として、深さ方向の測定（推定）は 80 mm までである。","使用する測定装置の性能は、かぶり厚さの測定誤差が深さ方向 50 mm までは±2 mm 以下と定められている。","使用する測定装置の性能は、かぶり厚さの測定誤差が深さ方向 80 mm までは±3 mm 以下、または深さ×5.0 ％以下と定められている。","使用する測定装置の性能は、かぶり厚さの分解能が 2 mm 以下と定められている。"],"type":"wrong","ans":3,"page":"P.118 表5.5-1","exp":"かぶり厚さの分解能は1mm以下です。","own":false,"extra":""},{"id":"c5-12","ch":"c5","n":12,"stem":"JASS 5 に定められる JASS 5 T-608 のかぶり厚さ補正値に関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さの測定誤差（補正値）は、A法とB法の2種類があり、A法は、配筋図を基に模擬配筋を組み立て、所定のかぶり厚さと同じ厚さの板材を用いて求める方法である。","B法は、測定対象となる鉄筋の配筋状態をそのまま利用してかぶり厚さ補正値を求める方法である。","かぶり厚さの補正値は、D10、D20、D30、D40 および D80 の5種類である。","かぶり厚さの補正値を求める際の指示値は、同じ鉄筋のかぶり厚さを 3 点以上測定し、その平均値を四捨五入によって mm 単位に丸めて表す。"],"type":"wrong","ans":2,"page":"P.119","exp":"補正値は D10・D20・D30・D50・D80 の5種類です（D40 は誤り）。","own":false,"extra":""},{"id":"c5-13","ch":"c5","n":13,"stem":"JASS 5 に定められる JASS 5 T-608 の測定手順に関する次の記述のうち、誤っているものを一つ選べ。","choices":["走査線は、主筋位置のほぼ中間を通るように、Y軸基準線と平行方向にマーキングする。","走査線は、主筋位置を通るように、Y軸基準線と平行方向にマーキングする。","かぶり厚さは、探査センサをマップ上の鉄筋位置と走査線が交差する位置に置いて測定する。","補正後の全てのかぶり厚さ測定値をグラップズの検定で棄却検定し、廃棄された場合はこれに替わる測定値を補って計算する。"],"type":"wrong","ans":1,"page":"P.113","exp":"走査線は「主筋位置のほぼ中間」を通るようにマーキングします。②は誤り。","own":false,"extra":""},{"id":"c5-14","ch":"c5","n":14,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さ」の判定基準について、次の中から正しいものを一つ選べ。","choices":["かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 10 mm 以上","かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 15 mm 以上","かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 20 mm 以上","かぶり厚さ測定値が、基準の最小かぶり厚さマイナス 25 mm 以上"],"type":"right","ans":0,"page":"P.113 表11.7","exp":"測定値と最小かぶり厚さの関係：x ≧ Cmin − 10mm。","own":false,"extra":""},{"id":"c5-15","ch":"c5","n":15,"stem":"JASS 5 に定められている「コンクリートのかぶり厚さ」の判定基準について、次の中から正しいものを一つ選べ。","choices":["かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 20 mm 以下","かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 25 mm 以下","かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 30 mm 以下","かぶり厚さ測定結果の平均値の上限は、設計かぶりプラス 35 mm 以下"],"type":"right","ans":0,"page":"P.113 表11.7","exp":"平均値の範囲：Cmin ≦ X̄ ≦ Cd＋20mm。上限は＋20mm。","own":false,"extra":""},{"id":"c5-16","ch":"c5","n":16,"stem":"かぶり厚さを精度良く測定するには、適切な補正を行うことが必要である。JASS 5 T-608 で規定されている補正を行う際の所定のかぶり厚さについて、次の中から正しいものを一つ選べ。","choices":["10 mm、20 mm、30 mm、40 mm および 80 mm である。","10 mm、20 mm、40 mm、50 mm および 80 mm である。","10 mm、20 mm、40 mm、60 mm および 90 mm である。","10 mm、20 mm、30 mm、50 mm および 80 mm である。"],"type":"right","ans":3,"page":"P.118〜119","exp":"補正は10・20・30・50・80mm で測定し、補正値を D10・D20・D30・D50・D80 とします。","own":false,"extra":""},{"id":"c5-17","ch":"c5","n":17,"stem":"JASS 5 T-608 で規定されている測定に用いる装置の満たすべき性能について、次の中から誤っているものを一つ選べ。","choices":["面内位置の測定誤差は、±10 mm または探査距離の±2.0 ％以下","かぶり厚さの測定範囲は、最小 10 mm 以下、最大 80 mm 以上","かぶり厚さの測定誤差は、深さ方向 50 mm までは±2 mm 以下","かぶり厚さの測定誤差は、深さ方向 50 mm 以上 80 mm までは±3 mm 以下または「深さ×5.0 ％」以下"],"type":"wrong","ans":0,"page":"P.117〜118","exp":"面内位置の測定誤差は ±10mm または探査距離の ±1.0%以下です。","own":false,"extra":""},{"id":"c5-18","ch":"c5","n":18,"stem":"JASS 5 T-608 で規定されているかぶり厚さ補正方法に関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さを精度良く測定するには、鉄筋径や配筋間隔、配筋方法などの配筋状態ごとに補正を行う。","かぶり厚さを精度良く測定するには、コンクリート圧縮強度を考慮して補正を行う。","実かぶり厚さと測定装置指示値との差を基準に補正を行う。","かぶり厚さの異なる2箇所の測定誤差が、その間のかぶり厚さの量にほぼ比例して変化することを利用した補正法を採用している。"],"type":"wrong","ans":1,"page":"P.118","exp":"かぶり厚さの補正にコンクリート圧縮強度は関係しません。","own":false,"extra":""},{"id":"c5-19","ch":"c5","n":19,"stem":"JASS 5 T-608 の規定では、判定に用いるかぶり厚さ測定値・平均値・最小値以外にまとめておくべき報告事項がある。次の記述のうち、誤っているものを一つ選べ。","choices":["試験従事者の経歴の報告は不必要。","かぶり厚さ補正の求め方（A法またはB法）の報告は必要。","試験測定データの内、棄却検定で破棄した測定データの報告は不必要。","測定装置本体の形式、製造番号および製造メーカの報告は必要。"],"type":"wrong","ans":2,"page":"P.120","exp":"報告事項には、棄却検定で棄却した測定データも含めた試験測定データが必要です。③は誤り。","own":false,"extra":""},{"id":"c5-20","ch":"c5","n":20,"stem":"JASS 5 T-608 で規定されているかぶり厚さ補正後のかぶり厚さ測定値の扱いに関する次の記述のうち、正しいものを一つ選べ。","choices":["測定値はそのまま全て使用しても良い。","グラップズの棄却検定を行い、棄却された場合はこれに変わる測定値を1回に限り補い再度棄却検定を行う。再棄却検定で棄却された場合、その箇所で得たすべての測定値を破棄する。","グラップズの棄却検定を行い、棄却された場合はこれに変わる測定値を補い再度棄却検定を行う。再棄却検定で測定値の棄却がなくなるまで、何回補っても良い。","必要と判断した場合のみ、測定値の棄却検定を行えば良い。"],"type":"right","ans":1,"page":"P.126","exp":"補正後の全測定値をグラップズの検定で棄却検定。補完は1測定値につき1回のみ。再度棄却されたら測定値を全て破棄し、同一部材の別の箇所で測定します。","own":false,"extra":""},{"id":"c6-1","ch":"c6","n":1,"stem":"NDIS 3429 に基づく報告による必ず報告する事項に関する次の記述のうち、誤っているものを一つ選べ。","choices":["工事名称","試験技術者の本籍地","点検の記録（定期点検及び日常点検）","試験結果"],"type":"wrong","ans":1,"page":"p.140","exp":"試験技術者の氏名・所属・必要に応じて資格は必要ですが、本籍地は不要です。","own":false,"extra":""},{"id":"c6-2","ch":"c6","n":2,"stem":"JASS 5 T-608：2022 に準拠する報告書に記載する事項に関する次の記述のうち、誤っているものを一つ選べ。","choices":["かぶり厚さの全測定値","検定廃棄の有無","測定装置の定期点検場所","ぶり厚さ補正値の求め方（A法又はB法）"],"type":"wrong","ans":2,"page":"p.142","exp":"装置の製造番号・製造会社・型式の記載は必要ですが、定期点検場所までは不要です。","own":false,"extra":""},{"id":"c7-1","ch":"c7","n":1,"stem":"物の置き方に関する次の記述のうち、誤っているものを一つ選べ。","choices":["端は揃えて置く。","不安定なものには転倒防止器具を用いる。","背の低い物を後方に、背の高い物を前方にして、順に並べる。","荷重に十分耐えられる場所を選ぶ。"],"type":"wrong","ans":2,"page":"p.148〜149","exp":"背の高い物は後方に、背の低い物を前方に並べます。③は逆。","own":false,"extra":""},{"id":"c7-2","ch":"c7","n":2,"stem":"現場作業中の安全帽に関する次の記述のうち、誤っているものを一つ選べ。","choices":["安全帽は正しくかぶり、アゴヒモをしっかり締める","一度でも衝撃を受けたものは、外観に損傷がなくても交換する。","一度でも落下時の衝撃を受けたものは使用しない。","プラスティック製の帽体は、劣化しにくいため、目立った外傷がない限り、交換はしなくてよい。"],"type":"wrong","ans":3,"page":"p.149","exp":"紫外線などで劣化するため、適当な時期に交換します。","own":false,"extra":""},{"id":"c7-3","ch":"c7","n":3,"stem":"墜落制止用器具に関する次の記述のうち、誤っているものを一つ選べ。","choices":["フックの取付け設備は、できるだけ低い位置のものを選ぶ。","高さが 2 m 以上の箇所で作業床を設けることが困難な場合、フルハーネス型の使用を原則とする。","胴ベルト型については、できるだけ腰骨近くで装着する。","一度でも落下時の衝撃を受けたものは使用しない。"],"type":"wrong","ans":0,"page":"p.149","exp":"フックの取付け設備は、できるだけ高い位置のものを選びます。","own":false,"extra":""},{"id":"c7-4","ch":"c7","n":4,"stem":"防毒マスクの使用方法に関する次の記述のうち、誤っているものを一つ選べ。","choices":["有毒ガスの種類に応じた吸収缶を着用する。","予備の吸収缶は常備し、いつでも交換できるようにしておく。","作業場所の酸素濃度が 28 ％以上あることを確認してから着用する。","吸収缶は落としたり、衝撃を与えてはいけない。"],"type":"wrong","ans":2,"page":"p.149","exp":"酸素濃度は18%以上あることを確認します（大気中は約21%）。28%以上は誤り。","own":false,"extra":""},{"id":"c7-5","ch":"c7","n":5,"stem":"特殊作業に対する安全に関する次の記述のうち、誤っているものを一つ選べ。","choices":["運搬作業中、必要のある場合は監視者や合図者を配置する。","高所作業時は、備品の落下防止措置を取る。","高さが 2 m 以上の作業場では、墜落制止用器具を確実に使用する。","酸素欠乏症のおそれがある作業場では、作業開始前に酸素濃度を測定すれば換気の必要はない。"],"type":"wrong","ans":3,"page":"p.151〜152","exp":"酸素欠乏のおそれがある作業場では、換気装置による強制換気を行います。","own":false,"extra":""}]};
(function(){
const K='haikin_quiz_v1',QS=DATA.qs,CHS=DATA.chapters;
const byId={};QS.forEach(q=>byId[q.id]=q);
let mem=null;
function load(){try{const s=localStorage.getItem(K);if(s)return JSON.parse(s)}catch(e){}return mem||{xp:0,best:0,days:0,last:'',ans:{},tot:0,ok:0}}
function save(){mem=S;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
let S=load();S.ans=S.ans||{};
const $=s=>document.querySelector(s),app=$('#app');
const NUM='①②③④';
const TITLES=[['見習い','🔰'],['新人','⛑️'],['一人前','🔧'],['職長','👷'],['主任技術者','📐'],['現場代理人','🏗️'],['配筋探査マスター','👑']];
const XPL=120;
const lvOf=xp=>Math.min(7,1+Math.floor(xp/XPL));
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function touchDay(){const t=today();if(S.last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.days=(S.last===ys)?(S.days||0)+1:1;S.last=t;save()}
const EXAM=new Date(2026,10,25);
function daysLeft(){const n=new Date();n.setHours(0,0,0,0);return Math.round((EXAM-n)/86400000)}
function quota(){const un=QS.filter(q=>!mastered(q.id)).length,d=daysLeft();if(un===0)return 0;const study=Math.max(1,d-5);return Math.max(3,Math.ceil(un/study))}
function todayN(){return (S.daily&&S.daily.d===today())?S.daily.n:0}
let sound=false,AC=null;
function beep(f,d,t){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function pop(t){const e=document.createElement('div');e.className='pop';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function confetti(n){const em=['🎉','✨','🧱','🔩','⭐','🏗️'];for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cf';e.textContent=em[i%em.length];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const st=id=>S.ans[id]||{c:0,w:0,l:null};
const mastered=id=>st(id).c>0;
function wrongIds(){return QS.filter(q=>{const a=st(q.id);return a.w>0&&a.l===false}).map(q=>q.id)}
function chapStat(k){const l=QS.filter(q=>q.ch===k);return{n:l.length,m:l.filter(q=>mastered(q.id)).length,ids:l.map(q=>q.id)}}

/* ---------- ホーム ---------- */
function cheer(){const n=todayN(),q=quota(),d=daysLeft();
 if(d<0)return '🎉 受験おつかれさま！結果を楽しみにしましょう';
 if(n===0)return '🚀 まずは1問！解き始めればスイッチが入ります';
 if(n<q)return `🔥 いい流れ！ノルマまであと${q-n}問`;
 return '🏅 今日のノルマ達成！余力があれば弱点復習でボーナスXP';}
function examHtml(){const d=daysLeft(),q=quota(),n=todayN();
 if(d<0)return '📅 試験日（11/25）は終了しました。おつかれさま！';
 const lab=d===0?'<b>今日が試験日！</b>':`試験(11/25)まで <b>あと${d}日</b>`;
 const last=d<=5?'（ラストスパート：弱点復習を中心に！）':'';
 return `📅 ${lab}　今日のノルマ <b>${Math.min(n,q)}/${q}問</b>${n>=q?' ✅達成！':''} ${last}<div class="goal"><i style="width:${q?Math.min(100,Math.round(n*100/q)):100}%"></i></div>`}
function home(){
 touchDay();
 const lv=lvOf(S.xp),T=TITLES[lv-1],into=lv>=7?XPL:S.xp%XPL;
 const total=QS.length,mm=QS.filter(q=>mastered(q.id)).length;
 const rate=S.tot?Math.round(S.ok*100/S.tot):0;
 const w=wrongIds().length;
 let h=`<div class="hero"><div class="tag">非破壊検査（配筋探査）自学自習</div><h1>配筋探査マスターへの道</h1>
 <div class="lv"><span class="badge">${T[1]} Lv.${lv} ${T[0]}</span><div class="xpbar"><i style="width:${Math.round(into*100/XPL)}%"></i></div><small>${S.xp} XP</small></div>
 <div class="exam">${examHtml()}</div><div class="cheer">${cheer()}</div>
 <div class="stats"><span>🔥 連続学習 ${S.days||0}日</span><span>✅ 習得 ${mm}/${total}問</span><span>🎯 正答率 ${rate}%</span><span>⚡ 最高連続正解 ${S.best||0}</span></div></div>
 <h2>🎮 モードを選ぶ</h2><div class="modes">
 <button class="mode wide" data-m="quota"><b>📅 今日のノルマ（${quota()}問）</b><small>試験日から逆算した今日の問題数。未習得を優先して出題します</small></button>
 <button class="mode" data-m="mix"><b>🎲 10問チャレンジ</b><small>未習得を優先してランダム出題</small></button>
 <button class="mode" data-m="surv"><b>❤️ サバイバル</b><small>ライフ3つ。何問連続で行けるか！</small></button>
 <button class="mode" data-m="wrong" ${w?'':'disabled'}><b>🔁 弱点復習（${w}問）</b><small>前回まちがえた問題だけ</small></button>
 <button class="mode" data-m="err"><b>🕵️ 誤り探し特訓</b><small>「誤っているもの」だけ10問</small></button>
 </div><h2>📚 章ごとに学ぶ</h2><div class="chaps">`;
 CHS.forEach(c=>{const s=chapStat(c.key),p=Math.round(s.m*100/s.n);
  h+=`<div class="chap"><div class="top"><span class="ic">${c.icon}</span><div class="tt"><b>${c.label}　${c.title}</b><small>${s.n}問 ／ 習得 ${s.m}${p===100?' 🏅コンプリート！':''}</small></div></div>
  <div class="bar"><i style="width:${p}%"></i></div>
  <div class="row"><button class="btn sm" data-c="${c.key}" data-u="0">最初から</button><button class="btn sm alt" data-c="${c.key}" data-u="1" ${s.m===s.n?'disabled':''}>未習得だけ</button><button class="btn sm alt" data-c="${c.key}" data-u="2">📋 全問</button></div></div>`});
h+=`</div><div class="foot"><button class="link" id="snd">🔈 効果音：${sound?'ON':'OFF'}</button> <button class="link" id="rst">進捗をリセット</button><br>教材：非破壊検査による配筋探査（問題と解説）より作成</div>`;
 app.innerHTML=h;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>startMode(b.dataset.m));
 app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;let ids=QS.filter(q=>q.ch===k).map(q=>q.id);if(b.dataset.u==='1')ids=ids.filter(i=>!mastered(i));if(b.dataset.u==='2'){listAll(k);return}start({name:CHS.find(c=>c.key===k).title,ids})});
  $('#snd').onclick=()=>{sound=!sound;beep(660,.1);home()};
 $('#rst').onclick=()=>{if(confirm('学習の記録をすべて消します。よろしいですか？')){S={xp:0,best:0,days:0,last:'',ans:{},tot:0,ok:0};save();home()}};
 window.scrollTo(0,0);
}
function listAll(k){
 const c=CHS.find(x=>x.key===k),qs=QS.filter(q=>q.ch===k);
 const tg={wrong:'❌ 誤っているものを選べ',right:'⭕ 正しいものを選べ',other:'🎯 当てはまるものを選べ'};
 let h=`<div class="top-bar"><button class="btn sm alt" id="back">← もどる</button><div class="grow"><b>${c.label}　${c.title}</b></div><small>全${qs.length}問</small></div>`;
 qs.forEach((q,qi)=>{h+=`<div class="qcard" data-qi="${qi}" style="margin-bottom:14px"><div class="meta"><span class="tg ${q.type}">${tg[q.type]}</span><span>${c.label} 問${q.n}</span></div>
  <div class="stem">${q.stem}</div>${q.extra||''}
  <div class="choices">${q.choices.map((t,i)=>`<button class="ch" data-i="${i}"><span class="no">${NUM[i]}</span><span>${t}</span></button>`).join('')}</div><div class="after"></div></div>`});
 h+=`<button class="btn alt" id="back2">🏠 ホームへ</button>`;
 app.innerHTML=h;window.scrollTo(0,0);
 $('#back').onclick=$('#back2').onclick=()=>home();
 app.querySelectorAll('.qcard[data-qi]').forEach(card=>{
  const q=qs[+card.dataset.qi];
  card.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{
   const i=+b.dataset.i,ok=(i===q.ans);
   card.querySelectorAll('.ch').forEach((x,j)=>{x.disabled=true;if(j===q.ans)x.classList.add('ok');else if(j===i)x.classList.add('ng');else x.classList.add('dim')});
   card.querySelector('.after').innerHTML=`<div class="fb ${ok?'ok':'ng'}">${ok?'⭕ 正解':'❌ 不正解'}（正解は ${NUM[q.ans]}）</div><div class="exp"><div class="ref">📖 テキスト ${q.page||'（頁の記載なし）'}</div>${q.own?'<span class="own">教材に解説なし・補足</span><br>':''}${q.exp}</div>`;
  });
 });
}
function startMode(m){
 const all=QS.map(q=>q.id);
 if(m==='quota'){const un=shuffle(all.filter(i=>!mastered(i))),ms=shuffle(wrongIds().concat(all.filter(i=>mastered(i))));const q=quota()||10;start({name:'今日のノルマ',ids:un.concat(ms).slice(0,Math.max(q,3))})}
 else if(m==='mix'){const un=shuffle(all.filter(i=>!mastered(i))),ms=shuffle(all.filter(i=>mastered(i)));start({name:'10問チャレンジ',ids:un.concat(ms).slice(0,10)})}
 else if(m==='surv'){start({name:'サバイバル',ids:shuffle(all),hearts:3})}
 else if(m==='wrong'){start({name:'弱点復習',ids:shuffle(wrongIds())})}
 else if(m==='err'){start({name:'誤り探し特訓',ids:shuffle(QS.filter(q=>q.type==='wrong').map(q=>q.id)).slice(0,10)})}
}

/* ---------- クイズ ---------- */
let Q=null;
function start(o){Q={name:o.name,ids:o.ids,i:0,hearts:o.hearts||0,maxH:o.hearts||0,streak:0,gain:0,res:[],done:false};question()}
function question(){
 const q=byId[Q.ids[Q.i]],n=Q.ids.length;
 const tag={wrong:'❌ 誤っているものを選べ',right:'⭕ 正しいものを選べ',other:'🎯 当てはまるものを選べ'}[q.type];
 const ch=CHS.find(c=>c.key===q.ch);
 let h=`<div class="top-bar"><button class="btn sm alt" id="back">← もどる</button><div class="grow"><div class="prog"><i style="width:${Math.round(Q.i*100/n)}%"></i></div></div>
 <small>${Q.i+1}/${n}</small>${Q.maxH?`<span class="hearts">${'❤️'.repeat(Q.hearts)}${'🖤'.repeat(Q.maxH-Q.hearts)}</span>`:''}</div>
 <div class="qcard"><div class="meta"><span class="tg ${q.type}">${tag}</span><span>${ch.label} 問${q.n}</span>${Q.streak>=2?`<span>🔥 ${Q.streak}連続</span>`:''}</div>
 <div class="stem">${q.stem}</div>${q.extra||''}
 <div class="choices">${q.choices.map((c,i)=>`<button class="ch" data-i="${i}"><span class="no">${NUM[i]}</span><span>${c}</span></button>`).join('')}</div><div id="after"></div></div>`;
 app.innerHTML=h;window.scrollTo(0,0);
 $('#back').onclick=()=>home();
 app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 Q.locked=false;
}
const OKM=['ナイス！','その調子！','お見事！','さすが現場の人！','正解！','バッチリ！'];
const NGM=['おしい！','次は取れる！','ここが伸びしろ！','解説でスッキリ！','ドンマイ！'];
function answer(i){
 if(Q.locked)return;Q.locked=true;
 const q=byId[Q.ids[Q.i]],ok=(i===q.ans),a=st(q.id);
 a.c+=ok?1:0;a.w+=ok?0:1;a.l=ok;S.ans[q.id]=a;S.tot++;if(ok)S.ok++;S.daily=(S.daily&&S.daily.d===today())?S.daily:{d:today(),n:0};S.daily.n++;
 let gain=0;
 if(ok){Q.streak++;S.best=Math.max(S.best||0,Q.streak);gain=10+(Q.streak>=5?10:Q.streak>=3?5:0);const before=lvOf(S.xp);S.xp+=gain;Q.gain+=gain;
  beep(880,.12);setTimeout(()=>beep(1175,.15),110);pop('+'+gain+' XP');confetti(Q.streak>=3?30:12);
  if(lvOf(S.xp)>before){setTimeout(()=>{pop('🎊 レベルアップ！ '+TITLES[lvOf(S.xp)-1][0]);confetti(40)},700)}}
 else{Q.streak=0;beep(200,.25,'sawtooth');if(Q.maxH)Q.hearts--}
 save();Q.res.push({id:q.id,ok});
 app.querySelectorAll('.ch').forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add('ok');else if(k===i)b.classList.add('ng');else b.classList.add('dim')});
 const over=Q.maxH&&Q.hearts<=0,last=Q.i>=Q.ids.length-1;
 const fb=ok?`<div class="fb ok">⭕ ${OKM[Math.floor(Math.random()*OKM.length)]}（正解は ${NUM[q.ans]}）${Q.streak>=3?`　🔥${Q.streak}連続！`:''}</div>`:`<div class="fb ng">❌ ${NGM[Math.floor(Math.random()*NGM.length)]}　正解は ${NUM[q.ans]}</div>`;
 $('#after').innerHTML=fb+`<div class="exp"><div class="ref">📖 テキスト ${q.page||'（頁の記載なし）'}</div>${q.own?'<span class="own">教材に解説なし・補足</span><br>':''}${q.exp}</div>
 <div style="margin-top:12px"><button class="btn big" id="next">${(over||last)?'結果を見る 🏁':'次の問題へ ▶'}</button></div>`;
 $('#next').onclick=()=>{if(over||last)result();else{Q.i++;question()}};
 $('#next').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function result(){
 const n=Q.res.length,c=Q.res.filter(r=>r.ok).length,p=n?Math.round(c*100/n):0,stars=p>=90?3:p>=70?2:p>=40?1:0;
 const lv=lvOf(S.xp),T=TITLES[lv-1];
 const wr=Q.res.filter(r=>!r.ok);
 const surv=Q.maxH;const cleared=surv&&Q.hearts>0&&Q.i>=Q.ids.length-1;
 let msg=p===100?'パーフェクト！現場の神です👑':p>=80?'すばらしい！あと一歩でマスター':p>=50?'いい調子。復習でさらに伸びます':'ここからが伸びしろ。解説を読み返そう💪';
 if(surv)msg=cleared?'全問クリア！！伝説です🏆':`${c}問まで進みました！次は更新しよう🔥`;
 if(p===100&&n>=5)setTimeout(()=>confetti(50),300);
 app.innerHTML=`<div class="qcard res"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="score">${c} / ${n}</div>
 <p><b>${msg}</b></p><p>獲得 <b>+${Q.gain} XP</b>　／　${T[1]} Lv.${lv} ${T[0]}</p>
 ${wr.length?`<h2>復習ポイント（${wr.length}問）</h2><ul>${wr.map(r=>{const q=byId[r.id];const ch=CHS.find(x=>x.key===q.ch);return `<li>${ch.label} 問${q.n}：${q.stem.replace(/<[^>]+>/g,'').slice(0,46)}…<br><small>正解 ${NUM[q.ans]} ／ 📖 ${q.page||'―'}</small></li>`}).join('')}</ul>`:'<p>ミスなし！🎉</p>'}
 <div class="row" style="flex-direction:column;gap:8px">${wr.length?'<button class="btn" id="rt">🔁 まちがえた問題をもう一度</button>':''}<button class="btn alt" id="hm">🏠 ホームへ</button></div></div>`;
 window.scrollTo(0,0);
 if(wr.length)$('#rt').onclick=()=>start({name:'復習',ids:wr.map(r=>r.id)});
 $('#hm').onclick=home;
}
document.addEventListener('keydown',e=>{if(!Q||!document.querySelector('.ch'))return;
 if(/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.ch')[+e.key-1];if(b&&!b.disabled)b.click()}
 if(e.key==='Enter'){const n=$('#next');if(n)n.click()}});
const GLOSS={
 '比強度':'<b>比強度</b>＝強度 ÷ 重さ（密度）。<br>「軽さのわりに、どれだけ強いか」の指標です。<br>コンクリートは重いので比強度が<b>小さい</b>。地震の力は建物の重さに比例するため、耐震では不利になります。だから設計の工夫（鉄筋の配置など）が必要、というのがこの問題の答えです。',
 'コールドジョイント':'<b>コールドジョイント</b><br>先に打ったコンクリートが固まり始めてから次を打ち重ねたため、一体にならずにできる継ぎ目です。弱点になり、水の通り道や鉄筋の腐食の原因になります。打重ね時間間隔が長すぎると起こります。',
 'ブリーディング':'<b>ブリーディング</b><br>打込み後、重い材料（セメント・骨材）が沈み、水だけが表面に浮き上がってくる現象です。表面がもろくなったり、鉄筋の下側に水の隙間ができて付着が落ちたりします。',
 'アルカリシリカ反応':'<b>アルカリシリカ反応（ASR）</b><br>セメントのアルカリと、骨材の中の反応性シリカが反応し、水を吸って膨らむゲルができます。その膨張でコンクリートが内部から割れる現象で、亀甲状のひび割れが特徴です。',
 'エフロレッセンス':'<b>エフロレッセンス（白華）</b><br>ひび割れなどから染み出した水にコンクリート中のカルシウム分が溶け、表面で空気中の二酸化炭素と反応して白く固まったものです。',
 'ポップアウト':'<b>ポップアウト</b><br>コンクリート表面近くの骨材などが膨張し、表面が円錐状（お椀状）に飛び出してはがれる現象です。原因は反応性骨材や凍結融解などです。',
 'クリープ':'<b>クリープ</b><br>一定の力をかけ続けると、時間がたつにつれて変形（ひずみ）が少しずつ増えていく現象です。力を増やしていないのに進むのがポイントです。',
 'フレッシュコンクリート':'<b>フレッシュコンクリート</b><br>練り混ぜた直後から固まり始める前までの、まだやわらかい状態のコンクリートです。固まった後は「硬化コンクリート」と呼びます。',
 'ワーカビリティー':'<b>ワーカビリティー</b><br>運搬・打込み・締固め・仕上げのしやすさです。材料が分離せず、均一に施工できる度合いを表します。',
 '比誘電率':'<b>比誘電率</b><br>電磁波の伝わり方に関わる材料の性質で、真空を1とした比です。電磁波の速度 ＝ 光速 ÷ √比誘電率 なので、値が大きいほど電磁波は遅くなります。目安は、空気が1、コンクリートが約6〜10、水が約80です。レーダ法では、比誘電率が違う境目で電磁波が反射します。',
 '直接反射波形':'<b>直接反射波形（Aモード）</b><br>ある1地点で受信した反射波を、横軸＝時間（深さ）、縦軸＝振幅で表した波形です。その最初の山（ピーク）の向き＝極性を見ることで、反射した物の性質がわかります。',
 '極性':'<b>極性</b><br>反射波の山・谷の向き（プラスかマイナスか）のことです。コンクリートより比誘電率が<b>小さい</b>物（空洞）で反射するとプラス、<b>大きい</b>物（鉄筋）で反射するとマイナスになります。そのため、最初のピークの極性から比誘電率の大小関係がわかります（材質や大きさまではわかりません）。',
 'NDIS':'<b>NDIS</b><br>日本非破壊検査協会が定める規格（日本非破壊検査協会規格）の略称です。配筋探査では、NDIS 3429（電磁波レーダ法）とNDIS 3430（電磁誘導法）が中心です。'
};
const GKEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function wrapFirst(els,k){
 for(const el of els){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.term')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let n;
  while(n=w.nextNode()){
   const i=n.nodeValue.indexOf(k);
   if(i<0)continue;
   const mid=n.splitText(i);mid.splitText(k.length);
   const sp=document.createElement('span');sp.className='term';sp.dataset.k=k;
   mid.parentNode.replaceChild(sp,mid);sp.appendChild(mid);
   return;
  }
 }
}
function decorate(){
 app.querySelectorAll('.qcard[data-qi],.qcard:not([data-qi])').forEach(card=>{
  if(card.dataset.g)return;card.dataset.g=1;
  const els=[...card.querySelectorAll('.stem,.ch>span:last-child')];
  GKEYS.forEach(k=>wrapFirst(els,k));
 });
}
new MutationObserver(decorate).observe(app,{childList:true,subtree:true});
document.addEventListener('click',e=>{
 const old=document.getElementById('tip');if(old)old.remove();
 const t=e.target.closest&&e.target.closest('.term');
 if(!t)return;
 e.stopPropagation();e.preventDefault();
 const d=document.createElement('div');d.id='tip';
 d.innerHTML=GLOSS[t.dataset.k]+'<small>（どこかをタップすると閉じます）</small>';
 document.body.appendChild(d);
},true);
home();
})();
</script>
